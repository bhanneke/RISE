slug: econ-agent-skills
name: "EconAgentSkills"
type: external
status: dormant
url: "https://github.com/JonasWeinert/EconAgentSkills"
maintainers:
  - "Jonas Weinert"
year_started: 2026

positioning: >
  Ten opinionated agent skills covering the applied-econometrics
  workbench in four stages: data (working-with-data, api-data-fetcher,
  stata-data-cleaning), analysis (r-econometrics, stata-regression,
  python-panel-data), writing (academic-paper-writer, latex-tables) and
  communication (econ-visualization, beamer-presentation). Each ships a
  SKILL.md routing layer plus reference.md and runnable examples in R,
  Python, Stata, Julia and LaTeX. Sits in the RISE analysis layer beside
  statspai, stata-code and stata-mcp, but supplies *method guidance* to
  a coding agent rather than an execution surface.

distinctive_contribution: >
  The only pack in the catalog that pins the modern
  heterogeneity-robust estimators by name rather than gesturing at
  "econometrics": Callaway-Sant'Anna, Sun-Abraham,
  Borusyak-Jaravel-Spiess and de Chaisemartin-D'Haultfoeuille for
  staggered DiD, weak-IV-robust inference with first-stage F-tests and
  Anderson-Rubin confidence sets, rdrobust optimal bandwidths, and wild
  cluster bootstrap — written explicitly to stop an agent reaching for
  plain TWFE on staggered treatment. Its second contribution is
  AGENT_POLICY.md, a four-level escalation ladder (ASK = block and
  present options; DEFAULT+flag = use the stated default and notify;
  DOCUMENT = record the assumption in a decisions log and continue;
  PROCEED = execute) with every generated script carrying a decisions-log
  header whose uncertain items are tagged "[HUMAN: please confirm]".

focus: analysis

