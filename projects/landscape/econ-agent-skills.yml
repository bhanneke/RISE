scores:
  lifecycle_coverage:
    score: 2
    note: "Four stages — API data fetching, panel/DiD/IV/RDD analysis, script generation, and LaTeX table + manuscript writing — with large gaps: no literature discovery or synthesis, no referee simulation, no replication."
  autonomy_level:
    score: 1
    note: "Copilot by explicit policy: the ASK level of AGENT_POLICY.md blocks and presents options without proceeding, and every generated script carries a decisions-log header with '[HUMAN: please confirm]' items — human approval is designed into each significant methodological choice."
  architectural_transparency:
    score: 3
    note: "Every SKILL.md, its reference.md, the runnable R/Python/Stata/Julia/LaTeX examples and AGENT_POLICY.md are in the repo; the README states the CC0 dedication and documents the routing and decision-tree design. No evaluation harness exists to publish."
  inputs_supported:
    score: 2
    note: "Multiple input forms (user datasets in several formats, a free-text analysis request, an existing draft for latex-tables / academic-paper-writer) plus data-source access via api-data-fetcher; no literature corpus or bibliographic connector of any kind."
  outputs_reproducibility:
    score: 2
    note: "Produces runnable analysis scripts, LaTeX tables and vector figures, and mandates a decisions-log header plus DIME master-do-file discipline — genuine provenance for the choices made — but there is no end-to-end reproducibility guarantee and no manifest tying outputs back to inputs."
  internal_evaluation:
    score: 0
    note: "No evaluation, test suite, or worked-benchmark comparison reported; the method choices are asserted from the literature, not validated against a gold standard. Verified by reading the README on 2026-09-08."
  openness:
    score: 2
    note: "README dedicates the work under CC0 1.0 (maximally permissive) and the skills are plain markdown with runnable examples, but the GitHub API cannot parse the license and reports 'Other (NOASSERTION)', so the formal reuse terms are ambiguous; the three Stata skills additionally require a commercial Stata license to reproduce."
  maturity_traction:
    score: 1
    note: "18 stars, 3 forks, 3 commits — all on 2026-05-05, the day the repo was created, with nothing pushed since. A well-made single-drop personal pack, not a maintained project."
  cross_family_policy:
    score: 0
    note: "No cross-family review mechanism: the skills are runtime-portable markdown but say nothing about which model executes versus which reviews, and no second-family check is defined anywhere. Portability is not a cross-family policy."
  assurance_runtime:
    score: 1
    note: "One light in-flight mechanism, applied consistently: the ASK/DEFAULT+flag/DOCUMENT/PROCEED ladder plus the decisions-log header surface and escalate methodological assumptions. Nothing verifies the numbers — no result audit, no re-estimation check, no figure or claim inspection."
  cross_platform_portability:
    score: 2
    note: "Built on the open SKILL.md standard with a Python installer targeting Claude Code, Cursor and Codex, and examples in five languages — 3 documented runtimes, short of the 5+ environments band 3 requires."
scored_on: "2026-09-08"

limitations:
  - "Dormant: 3 commits, all on the creation date 2026-05-05, none in the four months since."
  - "License is formally ambiguous — the README dedicates CC0 1.0 but GitHub reports NOASSERTION, so downstream reuse rests on the README text alone."
  - "Deliberately opinionated: the defaults are one defensible position in live methodological debates, and a research design the author did not anticipate will fight the skill rather than be served by it."
  - "Method coverage is a mid-2026 snapshot; a named-estimator pack ages faster than a generic one, and there is no maintainer activity to refresh it."
  - "No evaluation of whether following the skills produces better estimates than an unguided agent."
  - "The three Stata skills are unusable without a commercial Stata license."
  - "No literature, review, or replication coverage — it must be paired with a review pack to cover a paper's lifecycle."

related:
  - statspai
  - stata-code
  - stata-mcp
  - auto-empirical-research-skills
  - ai-research-feedback

