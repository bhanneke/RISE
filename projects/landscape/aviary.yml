slug: aviary
name: "Aviary (FutureHouse)"
type: external
status: active
url: "https://github.com/Future-House/aviary"
maintainers:
  - "FutureHouse"
year_started: 2024

positioning: >
  A gymnasium for defining custom language-agent environments
  (arXiv:2412.21154), with pre-built environments for math, general
  knowledge, biological sequences, scientific literature search, and
  protein stability. Aviary is **evaluation infrastructure** for RISE
  systems, not a RISE pipeline itself — but it is directly relevant
  because it defines tasks against which RISE pipelines can be measured.

distinctive_contribution: >
  Provides a standardized environment-and-agent abstraction (paired
  with the LDP language-decision-process library) for benchmarking
  agentic systems on scientific tasks. Lowers the cost of producing
  comparable evaluations across pipelines.

focus: end-to-end

pipeline_stages:
  - data-analysis
  - literature-discovery

architectural_features:
  - tool-use
  - artifact-versioning

discipline: general

