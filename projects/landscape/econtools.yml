year_started: 2026

positioning: >
  A personal Claude Code skill pack for economic-history and economics
  research workflows: simulated peer review with named referee personas
  (Diebolt), Economic History Review journal house-style automation
  (EHRstyle), a research-idea sounding board modelled on a real doctoral
  mentor (Janluiten), a dual-model adversarial reference auditor (Kris),
  a LaTeX-Word round-trip for language editing (Tanniedi), and a
  PDF-to-markdown literature converter (Tyler). Spans ideation,
  literature processing, revision, referee-simulation, and dissemination.

distinctive_contribution: >
  Two skills stand out versus other cataloged economics skill packs:
  Kris runs Claude and Codex (GPT-5.4) as two genuinely independent
  verification methods over a .bib file, randomly pairs references
  across models so no fixed Claude/Codex pair reviews the same batch,
  and stages an adversarial challenge round before flagging a reference
  as fake; EHRstyle encodes an entire journal's submission house style
  (Economic History Review, Feb 2026 Notes for Contributors) down to a
  bespoke biblatex style file. Diebolt's referee panel is explicit about
  its inspiration and gives public credit to two upstream projects
  (PHY041/claude-skill-citation-checker and Imbad0202/academic-research-skills).

