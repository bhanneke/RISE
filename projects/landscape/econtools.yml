scores:
  lifecycle_coverage:
    score: 2
    note: "Five distinct stages (idea sounding board, literature conversion, dissemination formatting, citation/language revision, referee simulation) but no data-analysis, formal-modeling, or paper-drafting-from-scratch skill."
  autonomy_level:
    score: 1
    note: "Copilot pattern throughout: Diebolt's editor briefing requires the user to choose which changes to implement; Kris produces a scorecard for human sign-off rather than auto-editing the bibliography."
  architectural_transparency:
    score: 3
    note: "All skills are public Markdown with full prompt text; Kris additionally ships 8 open Python helper scripts and a labelled test fixture."
  inputs_supported:
    score: 2
    note: "Multiple input forms (LaTeX manuscript, .bib file, PDF folder, free-text research idea) plus literature-API access (CrossRef/OpenAlex/Semantic Scholar/arXiv and more for Kris); no private data-source access."
  outputs_reproducibility:
    score: 2
    note: "Persists revised manuscripts, bibliographies, review logs (review_log.json), and a markdown literature wiki; no unified cross-skill artifact manifest."
  internal_evaluation:
    score: 1
    note: "Only Kris ships a labelled test fixture (10 references with known REAL/FAKE/CHIMERIC cases); the other five skills have no reported evaluation."
  openness:
    score: 2
    note: "MIT license; skills are plain Markdown/Python but require per-user placeholder substitution (paths, Codex availability, Zotero setup) before they run out of the box."
  maturity_traction:
    score: 1
    note: "37 stars, 9 forks, single maintainer; active (69 commits) but pre-1.0 personal tool."
  cross_family_policy:
    score: 1
    note: "Diebolt and Kris both add a second model family (Codex/GPT-5.4) when available, but it is explicitly conditional ('if Codex is available') rather than required or the sole default path."
  assurance_runtime:
    score: 2
    note: "Kris runs two non-overlapping verification methods plus an adversarial challenge round before a reference is flagged fake; Diebolt enforces information barriers between isolated referees."
  cross_platform_portability:
    score: 1
    note: "Primary runtime is Claude Code, with Codex CLI as an optional second backend for two skills; no other IDEs or providers documented."
scored_on: "2026-10-01"

limitations:
  - "Single-maintainer personal project; heavy per-user placeholder setup (paths, Codex availability, Zotero/BibTeX pipeline)."
  - "EHRstyle is hard-coded to one journal's house style (Economic History Review) and not generalizable without rewriting the style files."
  - "Only one of six skills (Kris) has any labelled evaluation; the rest are undemonstrated beyond README description."
  - "Low external traction (37 stars) relative to the sophistication of the Kris verification design."

