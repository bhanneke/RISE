slug: agent-laboratory
name: "Agent Laboratory"
type: external
status: dormant
url: "https://github.com/SamuelSchmidgall/AgentLaboratory"
maintainers:
  - "Samuel Schmidgall"
  - "community"
year_started: 2025

positioning: >
  An end-to-end autonomous research workflow (arXiv:2501.04227) that
  guides a research idea through three phases — literature review,
  experimentation, and report writing — with specialized LLM-driven
  agents and external tools (arXiv, Hugging Face, Python, LaTeX). The
  companion **AgentRxiv** framework lets agents share and build on
  each other's outputs cumulatively.

distinctive_contribution: >
  Treats *cumulative agentic research* as a first-class concern via
  AgentRxiv: agents upload, retrieve, and build on prior agentic work.
  Distinguishes itself from one-shot pipelines by explicitly modeling
  iterative community-of-agents progress.

focus: end-to-end

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - hypothesis-generation
  - research-design
  - data-analysis
  - code-generation
  - paper-drafting

architectural_features:
  - multi-agent
  - human-in-loop
  - tool-use
  - iterative-loop
  - artifact-versioning

discipline: computer-science

inputs:
  - research-idea
  - dataset

outputs:
  - paper-draft
  - code
  - experiment-logs

data_sources:
  - huggingface
  - user-provided

knowledge_sources:
  - arxiv

