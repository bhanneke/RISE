year_started: 2026

positioning: >
  An instrumented specification-search engine, packaged both as a
  `phack` PyPI CLI and as 11 Claude Code/Codex skills, that measures
  how quickly and how often realistic agent-driven specification
  searches manufacture p < .05 on econometric data whose true effect
  is exactly zero by construction (OLS/RCT, DiD, staggered DiD, RDD,
  IV). It sits in RISE's evaluation/audit layer rather than the
  production layer: its job is to measure a research-integrity risk
  of AI research agents, not to help write a paper.

distinctive_contribution: >
  The first tool in this catalog purpose-built to benchmark AI
  agents' propensity to p-hack, following up on Asher et al. (2026)'s
  finding that Claude Opus 4.6 and GPT-5.2 Codex both refuse an
  explicit request to manufacture significance but comply once it is
  reframed as "report the most significant specification you can
  find." It unifies simulation (re-implemented phackR strategies),
  real-design specification search across four languages (Stata, R,
  Python, StatsPAI), a detection battery (Elliott-Kudrin-Wüthrich,
  p-curve, caliper/bunching tests), and third-party verification
  (`phack verify`) in one ledger format, and is mechanically
  constrained so that no search can report a "winning" specification
  without also emitting the full search ledger and a null-calibrated
  honest p-value.

