slug: naturebench
name: "NatureBench"
type: external
status: active
url: "https://github.com/FrontisAI/NatureBench"
maintainers:
  - "FrontisAI"
year_started: 2026

positioning: >
  A cross-discipline benchmark (arXiv:2606.24530) of 90 tasks
  distilled from peer-reviewed Nature-family papers across six
  scientific domains, asking whether AI coding agents can match — or
  surpass — the published state of the art. Each task is a
  containerized package (task brief, the paper's dataset, a held-out
  test set with hidden ground truth, an automated evaluator) built by
  NatureGym, an automated Claude-Code-skills pipeline that converts a
  published paper into an executable Docker task. Sits in the RISE
  evaluation-infrastructure layer alongside AstaBench, MLGym, and
  EconCS Bench, but targets empirical scientific ML with executable,
  SOTA-anchored scoring.

distinctive_contribution: >
  Scores agents against each source paper's *reported SOTA*
  (Surpass-SOTA rate) rather than mere reproduction, with an
  information firewall that strips the source method from the task
  brief so agents must discover solutions. Ships a full harness with
  built-in adapters for Claude Code, Codex CLI, and Gemini CLI, a
  post-hoc validity judge, and a public leaderboard: across twelve
  harness-model configurations the best reaches a 17.8% Surpass-SOTA
  rate, with failures dominated by method-selection errors.

focus: analysis

