scores:
  lifecycle_coverage:
    score: 0
    note: "Evaluation infrastructure: it grades ML-engineering execution and produces scores, not scholarship — no question formulation, literature or write-up stage exists."
  autonomy_level:
    score: 0
    note: "Fixed competition tasks plus a deterministic grader; the harness is explicitly agent-agnostic and all agency sits in the evaluated scaffolds."
  architectural_transparency:
    score: 3
    note: "Public dataset-construction code, per-competition prepare/grade logic, split files, the `mlebench-env` Docker image, the grading server, the aggregation scripts, and the three baseline agents — plus a paper documenting the rules."
  inputs_supported:
    score: 2
    note: "75 standardized competition tasks in Low/Medium/High and Lite splits, each with description and local data, runnable by any agent and demonstrated across three scaffolds."
  outputs_reproducibility:
    score: 2
    note: "Task and grading are explicitly deterministic, splits are versioned files, and every leaderboard row ships a grading report — but agent runs are high-variance (hence the ≥3-seed protocol) and 3.3 TB with ~2 days of Kaggle-API prep stands between a reader and a rerun."
  internal_evaluation:
    score: 3
    note: "Peer-reviewed at ICLR 2025 as an Oral (verified on iclr.cc), and externally validated in practice by ~28 leaderboard rows of third-party agent submissions with published grading reports through early 2026."
  openness:
    score: 2
    note: "MIT licence, but explicitly scoped — 'this license applies to the code in this repository, but not the external datasets and files that may be downloaded' — so the data arrives under Kaggle's own competition terms and needs an accepted-rules Kaggle account."
  maturity_traction:
    score: 3
    note: "1,739 stars, 257 forks, an ICLR 2025 Oral, and sustained external adoption: leaderboard submissions from Baidu, Google Cloud AI Research, Microsoft (R&D-Agent), Meta (AIRA-dojo), SJTU, Fractal AI and startups, running from 2024-10 to 2026-03."
  cross_family_policy:
    score: 0
    note: "Not applicable — grading is deterministic CSV scoring with no LLM in the evaluation path, so there is no executor/reviewer pairing to make cross-family."
  assurance_runtime:
    score: 1
    note: "Deterministic grading plus optional extras (a rule-violation detector and a plagiarism detector) and obfuscated competition descriptions; these are post-submission checks with no in-flight gating of an agent's run."
  cross_platform_portability:
    score: 2
    note: "Deliberately agent-agnostic — three open-source scaffolds demonstrated and leaderboard entrants have run it with OpenAI, Anthropic, Google and DeepSeek models — but the harness itself needs Linux, Docker and the Kaggle API."
scored_on: "2026-09-08"

limitations:
  - "Leaderboard submissions have been paused since 2026-04-24 'while we develop an improved process for ensuring submissions are fair and comparable', so the ranking is frozen mid-race."
  - "Most top submissions publish grading reports but not source code (the leaderboard's 'Source Code Available' column reads X for the leaders), so the highest scores cannot be independently reproduced."
  - "Known contamination and leakage problems are catalogued rather than fixed — including test-label leakage in some competitions — and deferred to a prospective v2."
  - "Costly at scale: 3.3 TB for the full set (158 GB for Lite), roughly two days of dataset preparation, and a canonical setup of 24 hours on 36 vCPUs / 440 GB RAM / one A10 GPU per run, at three seeds."
  - "Kaggle competitions measure ML engineering, not research: no hypothesis, identification, literature or write-up dimension, and medal thresholds are frozen snapshots of human leaderboards that no longer move."
  - "Increasingly saturated at the easy end — Lite-split scores above 80% leave little headroom — and the code has not been touched since 2026-04-24."
  - "The MIT licence covers only the harness; redistributing the competition data is not permitted, which complicates archival replication."

