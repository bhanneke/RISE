year_started: 2024

positioning: >
  Seventy-five Kaggle competitions repackaged as an offline agent
  benchmark: an agent gets the competition description and data and must
  produce a submission CSV, graded deterministically against the
  held-out test set and scored against the *human* medal thresholds from
  that competition's original leaderboard. Splits by complexity (Low ==
  Lite, 22 competitions and 158 GB; the full set is 3.3 TB), with a
  canonical protocol of at least three seeds reported as mean ± SEM, a
  Docker environment image, a grading server, and three open-source
  agent scaffolds (AIDE, MLAB, OpenHands) wired in as baselines. It
  measures the data-work leg of the RISE pipeline — the empirical
  execution that `analysis` entries automate — and is the sibling
  benchmark to `paperbench`'s replication framing.

distinctive_contribution: >
  Human medal thresholds as the yardstick: performance is reported as
  the share of competitions in which an agent would have won any Kaggle
  medal, so the scale is anchored to what thousands of human
  competitors actually achieved rather than to a synthetic metric. It is
  also the catalog's clearest longitudinal record of the autonomy curve
  — the same deterministic grader now carries roughly two years of
  third-party submissions with published grading reports, from the
  paper's AIDE + o1-preview at 17.1% Any-Medal on the full set to
  external agents from Baidu, Google, Microsoft, Meta, SJTU and several
  startups above 60%, with Lite-split scores now over 80%.

