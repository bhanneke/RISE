slug: storm
name: "STORM / Co-STORM"
type: external
status: dormant
url: "https://github.com/stanford-oval/storm"
maintainers:
  - "Stanford OVAL"
year_started: 2024

positioning: >
  An LLM-powered knowledge-curation system that writes Wikipedia-style
  long-form articles from web search. STORM uses perspective-guided
  question asking and simulated conversations between a writer and a
  topic expert; Co-STORM (EMNLP 2024) adds a collaborative discourse
  protocol with human-in-the-loop and a dynamic mind map.

distinctive_contribution: >
  Treats the *pre-writing* problem (deciding what questions to ask)
  as the central bottleneck of automated long-form writing, and
  operationalizes it via perspective discovery and simulated expert
  dialogue. Co-STORM further makes the human–LLM curation loop a
  first-class architectural element.

focus: literature

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - paper-drafting

architectural_features:
  - multi-agent
  - human-in-loop
  - tool-use
  - rag-knowledge-base
  - iterative-loop

discipline: general

inputs:
  - topic

outputs:
  - long-form-article
  - citations
  - mind-map

data_sources:
  - web-search
  - user-provided-documents

knowledge_sources:
  - bing-search
  - you-search
  - vector-rm

