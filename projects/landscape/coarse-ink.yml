slug: coarse-ink
name: "Coarse (coarse.ink)"
type: external
status: active
url: "https://coarse.ink/"
maintainers:
  - "coarse.ink team"
year_started: 2026

positioning: >
  A web-based AI peer-review service: users upload academic papers
  (up to 50 MB) and receive AI-generated referee reports with 20+
  detailed comments. Operates in two modes — web-based using
  user-supplied OpenRouter API keys, or local processing via Claude
  Code / Codex / Gemini CLI subscriptions. Sits squarely in the
  referee-simulation stage of the RISE pipeline.

distinctive_contribution: >
  Open-source (MIT) and explicitly anti-commercial in framing —
  "Academic peer review runs on unpaid academic labor. Others
  decided to make a business out of that. We didn't like that." The
  site reports a blind self-evaluation against refine.ink, Stanford
  Agentic Reviewer, and reviewer3.com claiming higher coverage,
  specificity, and depth. Privacy-by-design: API keys remain in the
  user's browser tab and clear on close.

focus: review

pipeline_stages:
  - referee-simulation

architectural_features:
  - tool-use
  - human-in-loop

discipline: general

