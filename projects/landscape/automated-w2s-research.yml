scores:
  lifecycle_coverage:
    score: 2
    note: "Four adjacent stages (hypothesis-generation through code-generation/evaluation); no literature search or paper-drafting stage."
  autonomy_level:
    score: 3
    note: "Agents run multi-day, multi-hundred-hour research loops (propose, implement, train, evaluate, share) without per-step human approval within the sandboxed task."
  architectural_transparency:
    score: 3
    note: "Full agent code, prompts, sandbox/Docker/RunPod configs, dashboard, and five baseline implementations are public on GitHub under MIT."
  inputs_supported:
    score: 1
    note: "Single input form (a predefined weak-to-strong benchmark task) plus access to labeled/unlabeled chat, math, and code datasets; no literature access."
  outputs_reproducibility:
    score: 2
    note: "Persists code, trained models, and evaluation metrics with cached baseline results and three execution modes, but live agent runs are LLM-stochastic and GPU-dependent, not deterministically reproducible end-to-end."
  internal_evaluation:
    score: 2
    note: "Systematic evaluation across 10 alignment failures with held-out generalization checks and a time-boxed 28-researcher human baseline; arXiv preprint only, not yet peer-reviewed."
  openness:
    score: 2
    note: "MIT license with full setup docs and cached data/results; reproducing agent runs needs GPU compute (local or RunPod), not casual commodity hardware."
  maturity_traction:
    score: 1
    note: "Young research artifact (paper and repo, August 2026); 314 stars / 49 forks and only 2 commits on main at scoring date — early-stage, not a maintained product."
  cross_family_policy:
    score: 0
    note: "All nine automated-researcher agents run on Claude; no cross-model-family executor/reviewer setup."
  assurance_runtime:
    score: 2
    note: "Server-side held-out evaluation API withholds ground truth so agents cannot directly optimize against it, a moderate in-pipeline anti-gaming gate; no separate claim- or citation-faithfulness checks (not applicable to this task domain)."
  cross_platform_portability:
    score: 2
    note: "Three execution backends (local subprocess, Docker, RunPod cloud) support parallel distributed runs, though locked to the Claude model family."
scored_on: "2026-10-01"

limitations:
  - "Narrow to one task family (weak-to-strong generalization on chat/math/code data), not a general-purpose research agent."
  - "Single model family (Claude) only; no cross-family review built in."
  - "Requires GPU compute (local or RunPod) to run; not reproducible on a laptop without cloud spend."
  - "Early-stage research artifact (August 2026) with minimal commit history; not positioned as a maintained product."

