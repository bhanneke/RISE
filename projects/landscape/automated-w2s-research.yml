year_started: 2026

positioning: >
  Anthropic's open-sourced sandbox and agent harness for automating a
  specific slice of alignment research — weak-to-strong generalization.
  Nine Claude-powered agent instances autonomously propose training
  methods, implement them, train and evaluate models against a
  server-side held-out metric (Performance Gap Recovery), and post
  findings to a shared forum that other agents can read. Sits in the
  single-domain, experiment-driven corner of the landscape alongside
  AlphaEvolve and RD-Agent, but the object of study is AI safety
  research itself rather than general empirical science; covers
  hypothesis-generation through code-generation and evaluation with no
  literature search or paper-drafting stage.

distinctive_contribution: >
  The first publicly released code + sandbox + baselines for autonomous
  alignment research with a verifiable, cheat-resistant metric (ground
  truth never leaves the server) and a documented inter-agent "findings
  forum." The companion paper reports automated researchers closing
  almost the full performance gap (PGR 0.97) across 10 distinct
  alignment failure modes within six hours, outperforming the best
  one-shot method from 28 experienced human researchers given up to
  eight hours, with generalization to held-out benchmarks and models up
  to 4.7x larger than the target model.

