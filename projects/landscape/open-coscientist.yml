slug: open-coscientist
name: "Open CoScientist Agents"
type: external
status: archived
url: "https://github.com/conradry/open-coscientist-agents"
maintainers:
  - "conradry"
year_started: 2025

positioning: >
  An open-source implementation of Google DeepMind's *AI co-scientist*
  (arXiv:2502.18864), built on LangGraph and GPT Researcher. Realizes
  the co-scientist's multi-agent design — literature review,
  generation, reflection, evolution, meta-review, supervisor, and a
  tournament-style hypothesis competition with ELO ranking.

distinctive_contribution: >
  Makes a major closed industrial design (DeepMind's co-scientist)
  inspectable and runnable: every agent role and the ELO tournament
  loop are present in code, with a Streamlit dashboard for inspecting
  hypothesis competition transcripts. Useful as a reference
  implementation against which the original paper's claims can be
  audited.

focus: ideation

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - hypothesis-generation
  - research-design

architectural_features:
  - multi-agent
  - tool-use
  - rag-knowledge-base
  - iterative-loop
  - debate-consensus

discipline: general

inputs:
  - research-goal

outputs:
  - ranked-hypotheses
  - tournament-transcripts
  - research-report

data_sources:
  - web-search

knowledge_sources:
  - web-search
  - gpt-researcher

