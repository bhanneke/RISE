slug: refine-ink
name: "Refine (refine.ink)"
type: external
status: active
url: "https://www.refine.ink/"
maintainers:
  - "refine.ink team"
year_started: 2026

positioning: >
  A commercial AI peer-review service that produces reviewer-grade
  feedback on academic papers within ~20–40 minutes by running
  multi-hour parallel compute jobs (~2+ hours per review). Targets
  four error classes: accuracy (statistical / methodological),
  mathematical reasoning (proof gaps, edge cases), internal
  consistency (text↔tables↔citations), and general rigor. Sits in
  the referee-simulation stage of the RISE pipeline.

distinctive_contribution: >
  Positions itself as enterprise-grade with explicit security and
  privacy commitments (SOC 2 + ISO 27001 in progress, zero-retention
  contracts, papers never used for training). Markets adoption by
  Oxford / Stanford / Yale / MIT / Caltech / Cambridge / Brown /
  OpenAI researchers. Closed-source commercial offering; first
  document free.

focus: review

pipeline_stages:
  - referee-simulation

architectural_features:
  - multi-agent
  - tool-use

discipline: general

inputs:
  - submitted-paper-pdf

outputs:
