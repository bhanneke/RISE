slug: reclaim
name: "RECLAIM"
type: external
status: active
url: "https://github.com/mithils3/reclaim"
license: "MIT (code); CC BY 4.0 (datasets/run records)"
maintainers:
  - "Salunkhe, M."
  - "Ding, H."
  - "Verma, S."
  - "Kindratenko, V."
year_started: 2026

positioning: >
  A reproducibility benchmark of 100 NeurIPS 2025 papers that asks whether
  autonomous agents can recover a paper's pinned central empirical result
  under a fixed GPU-hour budget. Papers are stratified into three tiers by
  what the authors actually released — Run (code+data+weights), Retrain
  (no weights), Reimplement (no code) — so difficulty tracks artifact
  completeness rather than topic. Sits alongside `core-bench`, `paperbench`,
  and `repro-bench` in the RISE replication/evaluation-infrastructure
  layer, but is explicitly tiered and designed to be rebuilt yearly from
  each new conference cycle.

distinctive_contribution: >
  Unlike pass/fail replication leaderboards, RECLAIM ships full execution
  traces for all 372 graded runs (audit data, not just scores), is built
  to regenerate itself annually from new conference releases, and
  quantifies how reproduction rate collapses with release completeness
  (41% at Run tier down to 15% at Reimplement tier across four agents).

focus: replication

pipeline_stages:
  - replication
  - code-generation

architectural_features:
  - tool-use
  - iterative-loop

discipline: computer-science

inputs:
  - "ML paper + whatever artifacts (code/data/weights) its authors released"

outputs:
  - "reproduction success/fail verdict per paper"
  - "execution traces"
  - "leaderboard"

data_sources:
  - "NeurIPS 2025 paper release artifacts"

knowledge_sources:
  - "HuggingFace dataset (Mithilss/reclaim)"

scores:
  lifecycle_coverage:
    score: 1
    note: "Declared stages are replication and code-generation (retrain/reimplement tiers); no ideation, design, or write-up coverage."
  autonomy_level:
    score: 3
    note: "Reference agents run end-to-end within a 96 H100-hour GPU budget to recover the pinned target metric, without per-step human approval."
  architectural_transparency:
    score: 3
    note: "Full agent codebase (reclaim_repro, reclaim_claude), cluster scripts, and 372 run transcripts published."
  inputs_supported:
    score: 1
    note: "Single bundled input form (paper + its own released artifacts); no external literature or data-source access beyond that."
  outputs_reproducibility:
    score: 3
    note: "Versioned run records with full transcripts and audit data, reproducible via provided Slurm/Apptainer cluster scripts."
  internal_evaluation:
    score: 2
    note: "Systematic evaluation across 4 agents x 100 papers (400 agent-paper cells); paper is under review, not yet externally validated."
  openness:
    score: 2
    note: "Permissive licensing (MIT code / CC BY 4.0 data), but the declared 96 H100-hour-per-paper budget is far from commodity hardware."
  maturity_traction:
    score: 1
    note: "0 stars, repo marked 'anonymized ... under review' as of scoring date; brand-new (Sept 2026), single-team artifact."
  cross_family_policy:
    score: 0
    note: "Benchmarks separate agent runs for comparison, not a cross-family executor/reviewer design; each run uses one agent/model."
  assurance_runtime:
    score: 2
    note: "Grading is verified through execution traces matched against pinned target metrics — a runtime audit gate, not just a final score."
  cross_platform_portability:
    score: 2
    note: "Evaluates multiple agents/backbones (reference agent package plus 3 others) and ships Slurm/Apptainer cluster portability."
scored_on: "2026-10-01"

limitations:
  - "Requires a 96 H100-hour GPU budget per paper — not reproducible on commodity hardware."
  - "Repository is explicitly an 'anonymized ... under review' release; long-term maintenance/governance is unclear."
  - "ML/NeurIPS-specific; no economics or social-science papers in the benchmark."

related:
  - core-bench
  - paperbench
  - repro-bench
  - reprorepo
  - researchclaw-bench

papers:
