slug: tooluniverse
name: "ToolUniverse"
type: external
status: active
url: "https://github.com/mims-harvard/ToolUniverse"
maintainers:
  - "Mims Lab, Harvard Medical School (Zitnik Lab)"
year_started: 2025

positioning: >
  A curated tool registry and MCP server (arXiv:2509.23426) that
  packages biomedical, chemical, and general scientific APIs into a
  uniform agent-callable surface. Distributed as an MCP server, a
  Python SDK, and an agent-skills bundle; sits in the *infrastructure
  for RISE pipelines* layer, not as a pipeline itself.

distinctive_contribution: >
  Reframes the AI-scientist problem as an *interface* problem:
  scientific tools need to be discoverable, callable, and validable
  by agents through a uniform protocol. Backed by a Harvard lab and
  distributed via the MCP registry, making it a natural building
  block for downstream RISE systems.

focus: end-to-end

pipeline_stages:
  - data-acquisition
  - literature-discovery

architectural_features:
  - tool-use
  - rag-knowledge-base

discipline: biomedical

inputs:
  - tool-query

outputs:
  - tool-results

data_sources:
  - biomedical-apis
  - chemical-apis

knowledge_sources:
  - biomedical-literature

