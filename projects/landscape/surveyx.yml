slug: surveyx
name: "SurveyX"
type: external
status: dormant
url: "https://github.com/IAAR-Shanghai/SurveyX"
maintainers:
  - "IAAR Shanghai"
year_started: 2025

positioning: >
  An academic survey-automation system (arXiv:2502.14776) that
  generates domain-specific surveys from a paper title plus retrieval
  keywords. Open-source repository ships only the offline processing
  path; full-version capabilities (real-time online search,
  multimodal parsing) are gated behind the hosted surveyx.cn service.

distinctive_contribution: >
  Two-tier deployment — an open offline pipeline plus a commercial
  online service — making the field's tension between research
  reproducibility and product gating explicit. The offline release
  is usable as a methodological baseline.

focus: literature

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - paper-drafting

architectural_features:
  - multi-agent
  - rag-knowledge-base
  - iterative-loop

discipline: general

inputs:
  - survey-title
  - keywords
  - reference-markdown

outputs:
  - long-form-survey
  - citations

data_sources:
  - user-provided-markdown

knowledge_sources:
  - user-provided

scores:
  lifecycle_coverage:
    score: 1
    note: "Three stages around literature synthesis and drafting."
  autonomy_level:
    score: 3
    note: "Runs from title + keywords to survey; offline version is autonomous given the reference set."
  architectural_transparency:
    score: 2
    note: "arXiv:2502.14776 documents the method; offline code is public; online crawler + paper-DB system are closed."
  inputs_supported:
    score: 1
    note: "Open version: user-uploaded Markdown references only. Full feature set requires the hosted service."
  outputs_reproducibility:
    score: 1
    note: "Open path is reproducible given user-supplied references; hosted-service runs are not."
  internal_evaluation:
    score: 2
    note: "ArXiv paper reports comparative evaluation; the hosted-service variant has not been independently audited."
  openness:
    score: 1
    note: "No declared license in repository metadata; substantial functionality reserved for the commercial service."
  maturity_traction:
    score: 0
    note: "990 stars but the open-source repo has had no commits since 2025-06-22 (>12 months of inactivity, single branch); status revised active→dormant. Hosted service at surveyx.cn may still operate but was not independently verified."
  cross_family_policy:
    score: 0
    note: 'No cross-family policy in open release.'
  assurance_runtime:
    score: 1
    note: 'Offline path has reference-grounding only; full crawler + paper-DB closed.'
  cross_platform_portability:
    score: 1
    note: 'Offline (markdown) + hosted-service (closed) paths.'
scored_on: "2026-09-01"

limitations:
  - "Open-source release deliberately omits the most capability-relevant components (crawler, paper DB, multimodal parser)."
  - "No declared open-source license."
  - "Output quality on the open path depends entirely on the references the user supplies."
  - "Open-source repository dormant since 2025-06-22 (no commits in over a year as of this scoring); unclear whether the hosted surveyx.cn service is still maintained."

related:
  - autosurvey
  - storm
  - open-scholar

# ── Papers describing this project ─────────────────────
papers:
  - title: 'SurveyX: Academic Survey Automation via Large Language Models'
    authors:
      - 'Liang, X.'
      - 'Yang, J.'
      - 'Wang, Y.'
      - 'Tang, C.'
      - 'Zheng, Z.'
      - 'Song, S.'
      - 'et al.'
    year: 2025
    venue: 'arXiv'
    arxiv_id: '2502.14776'

references:
