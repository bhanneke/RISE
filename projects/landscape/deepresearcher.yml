year_started: 2025

positioning: >
  An end-to-end RL-trained deep-research agent (arXiv:2504.03160)
  that learns to plan, retrieve, cross-validate, and self-reflect via
  reinforcement learning in real-world web environments rather than
  in simulated retrieval. Ships a 7B HuggingFace checkpoint
  (DeepResearcher-7b) trained via this pipeline.

distinctive_contribution: >
  Argues that *end-to-end RL on real web environments* — not prompt
  engineering and not RL on retrieval simulators — is what unlocks
  emergent cognitive behaviors in research agents (planning, multi-
  source cross-validation, self-reflection, honest non-answer when
  evidence is missing). Reports +28.9 points over prompt baselines
  and +7.2 over RAG-RL baselines.

