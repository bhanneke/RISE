scores:
  lifecycle_coverage:
    score: 2
    note: "Six stages centered on the writing layer (reference search, in-workspace analysis/code since March 2026, drafting, revision, publication prep); nothing upstream of the manuscript."
  autonomy_level:
    score: 1
    note: "Copilot: the researcher authors the paper; the in-document model drafts, edits, and self-repairs LaTeX on request, with the human approving changes."
  architectural_transparency:
    score: 1
    note: "Model identity (GPT-5.2/5.3-Codex), Crixet foundation, and in-document context integration disclosed; no prompts, code, or architecture documentation beyond marketing."
  inputs_supported:
    score: 2
    note: "Multiple input forms (LaTeX projects, natural-language and voice instructions, sketch photos, data files) plus arXiv literature access; no private-corpus integration."
  outputs_reproducibility:
    score: 2
    note: "Cloud projects persist LaTeX source, bibliographies, and (post-March) executed code and generated figures; no Git integration, limited version-history transparency, no reproducibility manifest."
  internal_evaluation:
    score: 0
    note: "No published evaluation, benchmark, or systematic quality evidence in launch or upgrade coverage at scoring date."
  openness:
    score: 1
    note: "Closed-source, but the hosted service is free with a personal ChatGPT account (unlimited projects/collaborators); advanced AI features expected to move behind paid tiers."
  maturity_traction:
    score: 2
    note: "Production launch (Jan 2026) on an acquired platform, open globally to ChatGPT Free/Go/Plus/Pro with a major March upgrade; no adoption numbers disclosed."
  cross_family_policy:
    score: 0
    note: "OpenAI models only (GPT-5.2, then GPT-5.3 with Codex CLI); no cross-family configuration."
  assurance_runtime:
    score: 1
    note: "Compile-check-revise self-repair loops and arXiv-grounded citation insertion; no claim-audit, fact-check, or figure-integrity gates."
  cross_platform_portability:
    score: 0
    note: "Single hosted web surface tied to one provider; no self-hosting, IDE integrations, or alternative runtimes."
scored_on: "2026-07-23"

limitations:
  - "Closed-source hosted service: manuscripts live in OpenAI's cloud with only the standard ChatGPT training opt-out; no self-hosting or audit path."
  - "No native Git integration and limited version-history transparency; early reviews describe it as a functional silo disconnected from external codebases."
  - "Locked to OpenAI models, and the free tier is strategic — advanced AI features are slated to require paid ChatGPT subscriptions."

