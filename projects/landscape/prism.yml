slug: prism
name: "Prism"
type: external
status: active
url: "https://openai.com/prism/"
maintainers:
  - "OpenAI"
year_started: 2026

positioning: >
  OpenAI's free AI-native LaTeX workspace for scientific writing and
  collaboration, launched late January 2026 on Crixet, a cloud LaTeX
  platform OpenAI acquired. GPT-5.2 (upgraded to GPT-5.3 with Codex
  CLI in March 2026) operates inside the document with access to the
  paper's structure, equations, citations, and figures, covering
  drafting, revision, real-time collaboration, arXiv-backed
  referencing, and publication prep. Sits in the writing layer of
  the RISE pipeline — the manuscript-workspace counterpart to
  workbench products like Claude Science.

distinctive_contribution: >
  First big-lab product to make the manuscript itself the AI-native
  surface: the model is embedded in the LaTeX project rather than
  bolted on as a chat sidecar, and the workspace is free with
  unlimited projects and collaborators on a personal ChatGPT
  account. Converts whiteboard/handwritten sketches to LaTeX,
  auto-finds and formats arXiv references, and — since the March
  2026 Codex integration — runs Python/R in-workspace with
  compile-check-revise self-repair loops for LaTeX errors.

focus: drafting

