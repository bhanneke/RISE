slug: ai-research-feedback
name: "AI Research Feedback"
type: external
status: active
url: "https://github.com/claesbackman/AI-research-feedback"
maintainers:
  - "Claes Bäckman"
year_started: 2026

positioning: >
  Ten Claude Code skills that referee economics and finance research
  artifacts before they leave the author's hands. The core is
  `review-paper`, an 8-subagent referee panel (grammar, internal
  consistency, claims, mathematics, figures, contribution, plus an
  opposing-perspective agent) writing a consolidated
  `reviews/PRE_SUBMISSION_REVIEW_[date].md`, with `review-paper-light`
  (2 agents) and `review-paper-checks` (3 agents, mechanical only) as
  cheaper tiers. Sits in the RISE referee-simulation layer alongside
  reviewer and the review half of academic-research-skills, but is
  calibrated to a named top-journal set (AER, QJE, JPE, Econometrica,
  REStud, JF, JFE, RFS, JFQA, AEJ:Macro, JME, RED) rather than to
  generic academic quality.

distinctive_contribution: >
  It is the only pack in the catalog that extends referee simulation
  beyond the manuscript to three neighbouring artifacts: `review-pap`
  runs a 6-agent panel over pre-analysis plans against AEA/EGAP/OSF
  registry conventions, `review-grant` a 6-agent panel over NSF / NIH /
  ERC / Horizon Europe proposals, and `review-paper-code` maps each
  empirical claim in a draft back to the line of analysis code that
  produced it. `audit-analysis` runs an adversarial audit of changed
  analysis code in a deliberately isolated subagent context so the
  auditor cannot see the author's own justification.

focus: review

pipeline_stages:
  - research-design
  - revision-editing
  - referee-simulation

architectural_features:
  - multi-agent
  - debate-consensus
  - human-in-loop

discipline: economics

