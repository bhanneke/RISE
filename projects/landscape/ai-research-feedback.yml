scores:
  lifecycle_coverage:
    score: 2
    note: "Four stages: research-design (pre-analysis-plan review), revision-editing, referee-simulation, and since 2026-11 dissemination (`paper-version`, the two explorable deck skills, `paper-website`). Every skill still starts from a document the human already wrote, and the README states analysis code is never executed, so `replication` is not claimed even though `review-paper-code` reads code."
  autonomy_level:
    score: 2
    note: "Supervised agent: the human types `/review-paper` once, the skill fans out to 7 parallel general-purpose subagents, runs a verification pass over their findings and writes one consolidated dated report that the human then reads — no per-agent approval gate in between."
  architectural_transparency:
    score: 3
    note: "MIT license with every SKILL.md prompt published, subagent counts and roles enumerated per skill, and the output path of each report documented in the README; no separate evaluation harness is shipped."
  inputs_supported:
    score: 1
    note: "Four document input forms (draft, pre-analysis plan, grant proposal, code diff) but no external literature-corpus or data-source connector — reference checking is done from the draft's own bibliography, so the band-2 requirement of literature *or* data access is not met."
  outputs_reproducibility:
    score: 2
    note: "Persists date-stamped markdown reports under `reviews/`, standalone HTML for `paper-version` and `explain-diff`, and since 2026-11 slide decks with their chart code and figures (`explorable-deck`, `explorable-beamer`) and a paper website with the build scripts that regenerate it (`paper-website`). Nothing ties outputs to versioned inputs end to end, and subagent panels are LLM-stochastic, so two runs on the same draft differ."
  internal_evaluation:
    score: 0
    note: "No validation, testing, accuracy, or agreement-with-human-referee claims appear anywhere in the repo documentation (verified by reading the README on 2026-09-08); the 566 stars (2026-11-18) are adoption signal, not evaluation."
  openness:
    score: 2
    note: "MIT license and the skills are plain markdown, but running any multi-agent skill requires a paid Claude Code subscription with `general-purpose` subagent access — not reproducible on free infrastructure."
  maturity_traction:
    score: 2
    note: "566 stars / 106 forks / 0 open issues, pushed 2026-11-15, created 2026-03-01 (checked 2026-11-18) — real external adoption, but 40 commits, no tagged releases or versioning, and a single maintainer."
  cross_family_policy:
    score: 0
    note: "Single-family by design: every subagent in every panel is a Claude Code `general-purpose` subagent, so the 7-agent referee panel is seven views from one model family. No config option for an outside-family reviewer."
  assurance_runtime:
    score: 1
    note: "The review *is* the deliverable, not a gate on a pipeline: nothing blocks or loops back on failure. The one integrity mechanism is the verification pass inside `review-paper`, which drops wrong and marginal findings before the report is written; it replaced the opposing-perspective agent in 2026-11, and the isolated-context `audit-analysis` skill was removed upstream at the same time."
  cross_platform_portability:
    score: 0
    note: "Locked to Claude Code: the README's global requirement is 'Claude Code with access to the general-purpose subagent', and the fan-out design depends on that runtime primitive. No Cursor / Codex / Gemini CLI install path documented."
scored_on: "2026-11-18"

limitations:
  - "Zero reported evaluation — no measured agreement with human referees, no false-positive/false-negative calibration, nothing to indicate whether the 7-agent panel finds real problems or plausible-sounding ones."
  - "`review-paper-code` reasons about code statically; the README states analysis code is never run, so a claim that a table 'matches the code' is an inference, not a re-execution."
  - "Journal calibration is explicitly top-five economics and top-three finance; feedback may be systematically mis-scaled for field journals or IS venues."
  - "All seven referee views come from one model family, so correlated blind spots are structurally unaddressed."
  - "40 commits, no releases, single maintainer, no license-independent guarantee of continuity."
  - "Requires a paid Claude Code subscription and cannot be run on any other agent runtime."

