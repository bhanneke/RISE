slug: gpt-researcher
name: "GPT Researcher"
type: external
status: active
url: "https://github.com/assafelovic/gpt-researcher"
maintainers:
  - "Assaf Elovic"
  - "community"
year_started: 2023

positioning: >
  An autonomous "deep research" agent that produces long-form, cited
  reports on any topic from web and local sources. Uses a planner +
  parallel execution-agent architecture inspired by Plan-and-Solve
  and RAG; outputs reports of 2,000+ words with smart image scraping
  and inline image generation.

distinctive_contribution: >
  Earliest and most-adopted general-purpose deep-research agent; the
  planner/executor split with parallelized sub-queries set the
  reference pattern that several later systems adopted. Distributed
  as a pip package, Claude Skill, Docker image, and Colab notebook.

focus: literature

pipeline_stages:
  - rq-formulation
  - literature-discovery
  - literature-synthesis
  - paper-drafting

architectural_features:
  - multi-agent
  - tool-use
  - rag-knowledge-base
  - iterative-loop

discipline: general

inputs:
  - research-query
  - local-documents

outputs:
  - long-form-report
  - citations
  - inline-images

data_sources:
  - web-search
  - user-provided-documents

knowledge_sources:
  - web-search

