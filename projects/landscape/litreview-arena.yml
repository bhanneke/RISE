slug: litreview-arena
name: "LitReview Arena"
type: external
status: active
url: "https://github.com/VanellopeAsher/LitReview-Arena"
license: "MIT"
maintainers:
  - "Zhao, R. (Tsinghua University) and co-authors"
year_started: 2026

positioning: >
  A benchmark and evaluation platform for literature-review-writing agents:
  it collects blind pairwise ("battle-style") expert preferences between
  AI-generated and human/baseline literature-review drafts across five
  dimensions (coverage, claim support, structure, research suggestions,
  overall utility), then converts them into a reproducible offline
  benchmark. Sits in the RISE evaluation-infrastructure layer next to
  `asta-bench` and `surveyx`, but targets literature-synthesis quality
  specifically rather than end-to-end research-agent capability.

distinctive_contribution: >
  Replaces citation-overlap metrics and generic LLM-as-judge scoring with
  ~2,754 recruited-expert pairwise judgments (experts constrained to
  researchers with AI paper-writing experience), and ships `LitJudge`, a
  calibrated evaluator whose alignment with human judgment (Spearman's
  rho 0.78) approaches inter-expert consistency — far above a naive
  LLM-judge baseline (rho 0.467).

