slug: ape
name: "APE — Automated Peer Evaluator"
type: external
status: active
url: "https://ape.socialcatalystlab.org/"
maintainers:
  - "Social Catalyst Lab"
year_started: 2026

positioning: >
  A focused tool for automated peer evaluation of submitted papers,
  sitting at the *referee-simulation* stage of the RISE pipeline. Does
  not produce papers itself; consumes them and produces structured
  reviews.

distinctive_contribution: >
  Treats peer review as a first-class agentic capability with its own
  product surface, decoupled from upstream authoring. Provides a
  reusable evaluation interface that other RISE pipelines can route
  drafts through.

focus: review

pipeline_stages:
  - referee-simulation

architectural_features:
  - multi-agent
  - tool-use
  - rag-knowledge-base

discipline: general

inputs:
  - submitted-paper

outputs:
  - referee-report
  - structured-scores

data_sources: []

knowledge_sources:
  - prior-reviews
  - literature

scores:
  lifecycle_coverage:
    score: 0
    note: "Single stage (referee simulation) only."
  autonomy_level:
    score: 2
    note: "Supervised agent: user submits a paper and receives a structured review."
  architectural_transparency:
    score: 1
    note: "Service homepage describes capability; internals not publicly documented in detail."
  inputs_supported:
    score: 1
    note: "Accepts submitted papers; limited integration with external corpora."
  outputs_reproducibility:
    score: 1
    note: "Structured reports are persisted; not aimed at reproducibility across runs."
  internal_evaluation:
    score: 1
    note: "Demonstration-level evaluation; no published systematic benchmark to date."
  openness:
    score: 1
    note: "Hosted service; source not publicly available at time of scoring."
  maturity_traction:
    score: 1
    note: "Active service; user-base scope unclear from public info."
scored_on: "2026-05-14"

limitations:
  - "Single-stage coverage limits use as a standalone RISE system."
  - "Closed implementation hampers reproducibility of the review process."
  - "Dependence on a hosted service introduces availability risk."

related: []

references:
  - gartenberg2026morebetter
  - naddaf2025aipeer
  - neurips2024checklist
