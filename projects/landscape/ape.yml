slug: ape
name: "Project APE"
type: external
status: active
url: "https://ape.socialcatalystlab.org/"
maintainers:
  - "Social Catalyst Lab"
year_started: 2026

positioning: >
  An autonomous system that generates empirical economic policy
  research papers end-to-end from publicly available data, then
  scores them via a TrueSkill tournament in which AI-generated papers
  compete head-to-head against peer-reviewed human benchmarks from
  AER and AEJ:Policy (judged by Gemini 3.1 Flash Lite). The motivating
  problem: "Most policies — probably millions of them globally —
  are never rigorously evaluated."

distinctive_contribution: >
  *Combines* autonomous research generation with an explicit
  human-benchmark tournament — most catalog projects do one or the
  other. The TrueSkill ranking + AER/AEJ:Policy benchmark set is a
  reusable evaluation harness; everything (papers, code, data,
  failures) is published transparently. The project explicitly
  disclaims policy use: "None of the generated papers have been
  peer-reviewed and should not be used for evidence-based policy
  making."

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - research-design
  - data-acquisition
  - data-analysis
  - code-generation
  - paper-drafting
  - referee-simulation
  - replication

architectural_features:
  - multi-agent
  - tool-use
  - artifact-versioning
  - debate-consensus

discipline: economics

inputs:
  - policy-question

outputs:
  - paper
  - code
  - data
  - tournament-ranking

data_sources:
  - public-policy-data

knowledge_sources:
  - aer
  - aej-policy

scores:
  lifecycle_coverage:
    score: 3
    note: "Eight stages from hypothesis through replication-verification; full end-to-end loop."
  autonomy_level:
    score: 3
    note: "Generates papers autonomously without per-step human approval."
  architectural_transparency:
    score: 3
    note: "Stated commitment: 'everything is public — papers, code, data, failures.' TrueSkill scoring + benchmark set are open."
  inputs_supported:
    score: 2
    note: "Policy-question inputs; integrates public-data sources; uses AER / AEJ:Policy corpus as benchmark."
  outputs_reproducibility:
    score: 3
    note: "Replication-verification step: 'Checks whether code executes and outputs match.' Full artifact transparency by design."
  internal_evaluation:
    score: 3
    note: "Tournament evaluation against peer-reviewed human-benchmark papers from top economics journals — strongest internal-eval design in the catalog. 2026-07 follow-up ('Verifying the Verifiers') adds a versioned CRED error-taxonomy and benchmarks 60+ LLMs as verifiers against it."
  openness:
    score: 3
    note: "Fully open: papers, code, data, failures."
  maturity_traction:
    score: 1
    note: "Companion GitHub repo (SocialCatalystLab/ape-papers, 433 stars) generated 1,000+ AI papers Jan–Apr 2026, then paused production to build the CRED error-taxonomy and verifier benchmark; an independent arXiv paper (Li, 2026, 'The Ideation Bottleneck', arXiv:2604.03338) uses its human/AI tournament corpus. Still single-team (Social Catalyst Lab); no evidence of external adoption of the tool itself."

  cross_family_policy:
    score: 1
    note: 'Judge is Gemini 3.1 Flash Lite, distinct from execution back-end — implicit cross-family setup.'
  assurance_runtime:
    score: 2
    note: 'TrueSkill tournament vs human benchmarks + replication-verification step (code-execution + output-match check).'
  cross_platform_portability:
    score: 1
    note: "Hosted service; back-end choice is the maintainers', not user-facing."
scored_on: "2026-09-01"

limitations:
  - "Explicit author disclaimer that outputs should not be used for evidence-based policy making."
  - "Tournament judge (Gemini 3.1 Flash Lite) may itself be biased — meta-evaluation question."
  - "Economics-policy scope by design; portability to other empirical fields untested."
  - "Maintainer identity (Social Catalyst Lab) and funding model not publicly detailed."

related:
  - e2er
  - clo-author
  - sakana-ai-scientist
  - social-science-replicability

# ── Papers describing this project ─────────────────────
papers:
  - title: 'Verifying the Verifiers: Towards Autonomous Policy Evaluation'
    authors:
      - 'Yanagizawa-Drott, D.'
      - 'Willner, O.'
    year: 2026
    venue: 'Social Catalyst Lab working paper'
    url: 'https://ape.socialcatalystlab.org/verify'
    note: 'Introduces the CRED error/defect taxonomy and a benchmark scoring 60+ LLMs on their ability to detect known errors inserted into 100 papers.'
  - title: 'The Ideation Bottleneck: Decomposing the Quality Gap Between AI-Generated and Human Economics Research'
    authors:
      - 'Li, N.'
    year: 2026
    venue: 'arXiv'
    arxiv_id: '2604.03338'
    note: 'Uses Project APE AI-generated papers vs. 43 human AER/AEJ:Policy papers to decompose the quality gap into ideation (~71%) vs. execution (~29%).'

references:
  - wu2025agenticreasoning
  - filimonovic2025genai
