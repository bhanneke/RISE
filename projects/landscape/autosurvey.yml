slug: autosurvey
name: "AutoSurvey"
type: external
status: dormant
url: "https://github.com/AutoSurveys/AutoSurvey"
maintainers:
  - "Yidong Wang"
  - "Westlake University + Peking University + Nanjing University + HIT Shenzhen + Squirrel AI"
year_started: 2024

positioning: >
  A NeurIPS 2024 framework (arXiv:2406.10252) for automatically
  generating comprehensive literature surveys from a topic and a
  paper database. Demonstrated on survey lengths of 8k–64k tokens
  with reported citation-quality and content-quality scores. Sits
  squarely in the literature-synthesis stage of the RISE diagram.

distinctive_contribution: >
  Among the first systems to treat *long-form survey writing* (not
  short-form QA or summarization) as the target task, with explicit
  evaluation of citation quality at scale. Ships with a 530K-abstract
  arXiv-CS database used in the published experiments.

focus: literature

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - paper-drafting

architectural_features:
  - multi-agent
  - rag-knowledge-base
  - iterative-loop

discipline: general

inputs:
  - survey-topic

outputs:
  - long-form-survey
  - citations

data_sources:
  - arxiv-cs-abstracts

knowledge_sources:
  - arxiv

