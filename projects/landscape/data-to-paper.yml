slug: data-to-paper
name: "data-to-paper"
type: external
status: dormant
url: "https://github.com/Technion-Kishony-lab/data-to-paper"
maintainers:
  - "Roy Kishony Lab (Technion)"
year_started: 2023

positioning: >
  An end-to-end framework that takes annotated data and produces
  *backward-traceable* scientific manuscripts: every numeric value
  in the output can be click-traced to the specific code line that
  generated it. Navigates interacting LLM and rule-based agents
  through data exploration, literature search, hypothesis raising,
  code-debugging, interpretation, and step-by-step paper writing.
  Released alongside an NEJM AI peer-reviewed paper (Ifargan et al.,
  2024 — DOI:10.1056/AIoa2400555).

distinctive_contribution: >
  The "data-chained" provenance design is unique in the catalog: the
  manuscript is constructed so that traceability is intrinsic, not a
  reporting add-on — any reported number resolves backward through
  the data analysis steps. Ships both Autopilot and Copilot modes
  (oversee / inspect / guide / rewind / replay) and overrides
  standard statistical packages with coding guardrails to minimize
  common LLM coding errors.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - literature-discovery
  - research-design
  - data-analysis
  - code-generation
  - paper-drafting
  - revision-editing

architectural_features:
  - multi-agent
  - human-in-loop
  - tool-use
  - artifact-versioning
  - dag-orchestration

discipline: general

inputs:
  - annotated-dataset
  - research-goal

outputs:
  - traceable-manuscript
  - data-chained-paper
  - code

data_sources:
  - user-provided

knowledge_sources:
  - literature

