scores:
  lifecycle_coverage:
    score: 2
    note: "Eight stages from hypothesis through write-up; the peer-review skill and blind-reviewer gate are optional runtime checks, not a declared referee-simulation or dissemination stage."
  autonomy_level:
    score: 2
    note: "Supervised agent: user sets a goal, the agent runs the research loop with tool permissions and a read-only plan mode; user reviews the resulting artifacts."
  architectural_transparency:
    score: 3
    note: "Full code, agent prompts (per-provider prompt files), skills, connectors, config schema, ARCHITECTURE.md and AGENTS.md all public; released builds fetch the skill catalog from the Atlas index, source builds bundle it."
  inputs_supported:
    score: 3
    note: "Goal prompts, existing project directories, and local datasets; literature APIs (arXiv, OpenAlex, Semantic Scholar, Europe PMC) plus ~30 scientific databases, with private local data by construction."
  outputs_reproducibility:
    score: 2
    note: "Sessions, artifacts, and provenance persist on disk and are shareable as links, and the critic scores reproducibility — but end-to-end re-runnability from declared inputs is not demonstrated."
  internal_evaluation:
    score: 1
    note: "Demo sessions and launch write-ups only; no benchmark results or third-party evaluation of research-output quality published."
  openness:
    score: 2
    note: "Apache-2.0, npm-installable, BYOK free and non-gated; demo examples need paid provider keys and heavier experiments need cloud compute, so reproducibility on commodity hardware is partial."
  maturity_traction:
    score: 1
    note: "2,696 stars / 374 forks in under three weeks amid a coordinated 'open Claude Science alternative' press cycle; velocity is plausible for the niche and no direct evidence of star manipulation was found (star-timestamp audit unavailable), but the core team is 2-3 people and v1.3.4 landed eight days after repo creation — too young to call durable adoption."
  cross_family_policy:
    score: 1
    note: "Per-request routing across 75+ providers makes cross-family executor/reviewer setups configurable (e.g., critique sub-agent on another family), but cross-family review is neither default nor required."
  assurance_runtime:
    score: 1
    note: "Optional blind-reviewer gate at finalize plus RSI trajectory critic and tool-permission prompts; all optional, with no mandatory claim-audit or citation-verification gating."
  cross_platform_portability:
    score: 2
    note: "75+ model providers and macOS/Windows/Linux via npm or platform binaries, but a single self-contained runtime — not deployable across other agent frameworks."
scored_on: "2026-07-23"

limitations:
  - "Near-twin disambiguation: ai4s-research/open-science (~900 stars, created the same day, since rebranded 'Open Science Desktop') is not a fork or mirror but an independently built Tauri desktop app on an attributed OpenCode sidecar, from an anonymous org registered 2026-06-27 with bot-named commits and the name-adjacent domain openedscience.com; org identity (Synthetic Sciences, est. 2025, named maintainers), npm distribution (@synsci/openscience), the openscience.sh docs domain, and launch press mark synthetic-sciences/openscience as the canonical OpenScience — but the namespace confusion persists."
  - "Runtime provenance is under-disclosed: the agent core closely mirrors the MIT-licensed OpenCode CLI (identical provider-prompt file set — anthropic.txt, beast.txt, gemini.txt, qwen.txt — and session-module layout), yet the NOTICE file credits no OpenCode lineage."
  - "Three weeks old with a 2-3 person team and no published evaluation of output quality; by the project's own security note the agent is not sandboxed — the permission system is not an isolation boundary."

