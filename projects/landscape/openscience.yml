slug: openscience
name: "OpenScience"
type: external
status: active
url: "https://github.com/synthetic-sciences/openscience"
maintainers:
  - "Synthetic Sciences (Ishaan Gangwani, Aayam Bansal)"
year_started: 2026

positioning: >
  An open-source (Apache-2.0), model-agnostic AI workbench for
  scientific research, launched 2026-07-03 as an explicit open
  alternative to Claude Science: a Bun/TypeScript monorepo whose CLI
  starts a local server hosting a browser workspace, an agent
  runtime (default `research` agent plus `biology`/`physics`/`ml`
  specialists with critique and literature-review sub-agents), 292
  bundled markdown skills, and ~30 scientific-database connectors
  (UniProt, PDB, ChEMBL, PubChem, arXiv, OpenAlex, Semantic
  Scholar). Sits in the big-lab workbench layer alongside Claude
  Science, Prism, and Google Co-Scientist, but self-hosted and
  bring-your-own-key.

distinctive_contribution: >
  The first credible open-source counterweight to the closed
  research workbenches: per-request model routing across 75+
  providers, local-first operation with no account required, and
  the entire stack — prompts, agents, skills, connectors, SDK,
  plugin runtime — auditable and editable in one repo, with an
  optional managed platform (Atlas) kept strictly non-required.
  Ships an RSI trajectory critic (correctness / efficiency /
  coverage / reproducibility, 0-100) and an optional blind-reviewer
  gate at session finalize.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - literature-discovery
  - literature-synthesis
  - data-acquisition
  - data-analysis
  - code-generation
  - paper-drafting
  - revision-editing

architectural_features:
  - multi-agent
  - tool-use
  - iterative-loop
  - persistent-memory
  - artifact-versioning

discipline: general

inputs:
