slug: paperbench
name: "PaperBench (OpenAI)"
type: external
status: dormant
url: "https://github.com/openai/frontier-evals/tree/main/project/paperbench"
maintainers:
  - "OpenAI"
  - "Giulio Starace"
  - "Oliver Jaffe"
  - "Dane Sherburn"
  - "Tejal Patwardhan"
year_started: 2025

positioning: >
  The reference replication benchmark for AI research: agents must
  reproduce 20 ICML 2024 Spotlight and Oral papers from scratch —
  understanding the contribution, writing the codebase, and executing
  the experiments — with no starter code. Each sample pairs the paper
  (PDF and Markdown) with a hierarchical rubric co-developed with that
  paper's own authors, decomposing replication into 8,316 individually
  gradable leaves across three requirement types (Code Development,
  Execution, Result Match). The harness runs three containers per
  attempt: agent rollout, then re-execution of the submitted codebase
  in a fresh GPU container, then LLM grading against the rubric. Sits
  at the replication block of the RISE pipeline as the target that
  `paper2code` and the replication agents are measured against, and as
  the AI-research counterpart to `mle-bench`'s Kaggle framing.

distinctive_contribution: >
  Author-co-developed hierarchical rubrics are the mechanism nothing
  else in the catalog has: replication stops being a binary pass and
  becomes 8,316 graded claims, which is what makes partial credit
  meaningful and lets Code-Dev (code only, no GPUs, ~85% cheaper
  grading) exist as a lighter variant of the same target. It also
  benchmarks its own grader — JudgeEval is a separate evaluation of
  judge accuracy — and anchors agents against recruited top ML PhDs,
  reporting that the best agent (Claude 3.5 Sonnet with open-source
  scaffolding, 21.0%) still did not beat the human baseline.

focus: replication

