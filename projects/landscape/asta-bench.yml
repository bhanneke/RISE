slug: asta-bench
name: "AstaBench (AI2)"
type: external
status: active
url: "https://github.com/allenai/asta-bench"
maintainers:
  - "Allen Institute for AI"
year_started: 2025

positioning: >
  An evaluation framework from AI2 for measuring scientific-research
  abilities of AI agents. 2,400+ examples across 11 benchmarks
  covering literature search, code execution, data analysis, and
  end-to-end discovery. Built on the InspectAI framework. Sits in
  the *RISE evaluation infrastructure* layer alongside Aviary and
  MLGym.

distinctive_contribution: >
  The most-scoped benchmark suite for scholarly-research agent
  abilities specifically — not generic agent benchmarks, not
  domain-specific science tasks (cf. BixBench), but a curated
  spectrum of *research skills* with standardized tools and
  execution environments for fair efficiency-comparable runs.

focus: end-to-end

pipeline_stages:
  - literature-discovery
  - data-analysis
  - code-generation

architectural_features:
  - tool-use
  - artifact-versioning

discipline: general

inputs:
  - task-specification
  - agent-implementation

outputs:
  - agent-trajectories
  - leaderboard-submissions
  - efficiency-metrics

data_sources:
  - benchmark-tasks

knowledge_sources:
  - paper-corpus

