slug: scholar-loop
name: "Scholar Loop"
type: external
status: active
url: "https://github.com/renee-jia/scholar-loop"
maintainers:
  - "renee-jia"
year_started: 2026

positioning: >
  A single-maintainer "autonomous AI scientist" that runs the full PhD
  loop on a single-GPU budget: literature scouting (arXiv + OpenAlex,
  citation-ranked), grounded hypothesis generation, debate-gated real
  PyTorch experiments in a smoke -> verify -> full funnel, reflection
  into a time-decaying skill library, and a number-grounded write-up
  with self-review — all under a self-stopping budget governor. Sits
  with the AI-scientist family (Sakana, Agent Laboratory) but leads
  with deterministic anti-reward-hacking guards rather than scale.

distinctive_contribution: >
  Treats the outer loop and its integrity guards as the product:
  two-phase frozen scoring the experiment code cannot fake, an edit
  allowlist, a VerifiedRegistry that grounds every number in the
  draft, and universal predict-then-verify calibration that scores
  each agent's checkable claims against ground truth — with a bundled
  adversarial "cheater" engine to prove the guards hold, and the whole
  eight-agent loop testable deterministically without an API key or GPU.

focus: end-to-end

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - hypothesis-generation
  - code-generation
  - data-analysis
  - paper-drafting
  - referee-simulation

