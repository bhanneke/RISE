scores:
  lifecycle_coverage:
    score: 2
    note: "Seven stages from literature through drafting and self-review; domains are pre-defined YAML profiles with fixed metrics, so no open research-question formulation."
  autonomy_level:
    score: 3
    note: "Runs unattended under a self-stopping governor (dollar budget, round cap, convergence); the user supplies only the domain profile and budget up front."
  architectural_transparency:
    score: 3
    note: "MIT-licensed full code with typed JSON-schema agent I/O, 108 tests, CI, and captured end-to-end runs publishing paper, run log, and raw ledger."
  inputs_supported:
    score: 1
    note: "One input form (a domain profile plus engine pair; two shipped) with live literature access via arXiv and OpenAlex."
  outputs_reproducibility:
    score: 2
    note: "Persists drafts, run ledgers, and logs — every reported number traces to a frozen-metric measurement in the jsonl — but exact re-runs are deterministic only under the MockLLM."
  internal_evaluation:
    score: 1
    note: "Two captured live Opus runs on toy tasks (digits 5.0%->3.82% err, diabetes RMSE 56.5->55.24) plus a reward-hacking stress test; no benchmark evaluation or external validation."
  openness:
    score: 3
    note: "MIT; pip-installable; the entire loop runs deterministically in under a second on CPU with no API key via the bundled MockLLM."
  maturity_traction:
    score: 1
    note: "462 stars and 36 forks within weeks of release, but a 26-commit single-maintainer research preview with no pushes since 2026-06-23 (one month idle at scoring)."
  cross_family_policy:
    score: 0
    note: "Single family — the optional [llm] extra ships only an Anthropic client, and writer and reviewer share the same model; the optimization loop deliberately uses no LLM-as-judge."
  assurance_runtime:
    score: 3
    note: "Heavy deterministic guard stack with gating: frozen two-phase scoring, edit allowlist, VerifiedRegistry number-grounding, schema validate-retry, per-agent predict-then-verify calibration, and tiered promotion gates — adversarially tested via the cheater engine."
  cross_platform_portability:
    score: 0
    note: "Pure-Python package runs anywhere, but live runs support only the Anthropic backend; the MockLLM is a test double, not a deployment target."
scored_on: "2026-07-23"

limitations:
  - "Watch item: no commits since 2026-06-23 despite rapid star growth — a single-maintainer 'research preview' that may already be stalled; status here assumes <3 months idle still counts as active."
  - "Shipped domains are toy sklearn/PyTorch tasks with weak baselines, and the system's own reviewer rejects both captured papers as too marginal (the README concedes it is not wrong)."
  - "Anthropic-only live backend and no container sandboxing yet — the author names sandboxing as the open residual boundary."

