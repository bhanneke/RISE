slug: parness
name: "PARNESS"
type: external
status: dormant
url: "https://github.com/gtrhythm/PARNESS"
maintainers:
  - "Yuchen Wang"
  - "Zhongzhi Luan"
year_started: 2026

positioning: >
  A declarative "paper harness": research pipelines are composed in
  YAML over a thin (~900-line) DAG kernel that does topological
  sorting and data flow, while control flow is agent-driven — modules
  emit `_route` signals to branch, iterate or stop. The catalog of
  140+ lazy-loaded modules covers 18 research agents, 17 paper
  crawlers (arXiv, Semantic Scholar, OpenAlex, Crossref, NCBI,
  bioRxiv, DBLP, ACL, CVF, IEEE, SSRN, Springer, ACS, PLOS, ICLR,
  Europe PMC, Frontiers), a 9-module idea pipeline, a 12-module
  experiment system with plan generation and a verifier, 20
  knowledge-graph modules, 9 paper-writing modules ending in LaTeX
  generation, 7 iteration controllers and 19 gate/persistence
  modules, with 38 example pipelines including a four-phase
  idea-to-paper run. Sits in the RISE end-to-end layer beside
  AI-Scientist, Agent Laboratory and AutoResearchClaw, differing by
  treating the pipeline as editable configuration rather than code.

distinctive_contribution: >
  Pipelines are data, not Python: a run is fully specified by a YAML
  file with explicit dot-path `input_mapping`/`output_mapping`
  dependencies, a validation script that checks every connection
  before execution, per-node subprocess isolation that releases GPU
  memory on exit, and incremental JSONL persistence taps that write
  each node's results in real time so a crashed run resumes rather
  than restarts. The paper additionally claims full-text PDF indexing
  with fallbacks, scenario-typed knowledge-graph retrieval and
  cross-run knowledge accumulation as the four design components that
  distinguish it from context-bounded pipelines — of which only the
  indexing and knowledge-graph layers are visible in the public
  module catalog.

focus: end-to-end

pipeline_stages:
