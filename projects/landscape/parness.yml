scores:
  lifecycle_coverage:
    score: 3
    note: "The 38 shipped pipelines span crawling and indexing, idea generation with an Evaluator/Judge, experiment plan/run/verify, and a LaTeX write-up with Editor and Coherence Checker — eight declared stages including paper-drafting plus in-pipeline result gates as the validation layer."
  autonomy_level:
    score: 3
    note: "No human approval gates are documented anywhere: the human selects or edits a YAML pipeline and launches one command, after which routing, iteration (threshold, patience, LLM-judged) and stopping are all agent- or controller-decided."
  architectural_transparency:
    score: 2
    note: "src/, scripts/, skills/ and config/ with 38 YAML pipelines are public and the README documents the full module catalog and the DAG kernel, but no evaluation harness ships and per-module prompt files were not verified as published."
  inputs_supported:
    score: 2
    note: "Accepts a research topic plus PDF corpora, with 17 literature crawler sources behind the discovery layer; no connectors for empirical datasets, so data access is whatever the user mounts."
  outputs_reproducibility:
    score: 2
    note: "A run is declared entirely by its YAML config and every node's output is written incrementally to JSONL, which is unusually close to a run manifest — but nothing demonstrates a rerun, and the LaTeX/BibTeX outputs come with no reproducibility claim."
  internal_evaluation:
    score: 1
    note: "The paper's only evidence is one verbatim machine-generated paper in its appendix; the README reports no benchmark, baseline, ablation or success rate, and 0 forks means no external run exists to check."
  openness:
    score: 1
    note: "The README states 'MIT' in prose but the repository has no LICENSE file and the GitHub API reports license: null (both verified 2026-09-08), so reuse terms are legally undeclared rather than permissive."
  maturity_traction:
    score: 1
    note: "10 stars, 0 forks, 5 commits total, nothing pushed since 2026-06-15 and no tagged release — substantive code (src/ plus 140+ modules) published as a one-off drop alongside the paper, so it sits at the floor of the research-prototype band."
  cross_family_policy:
    score: 1
    note: "A provider dispatcher abstracts OpenAI, Anthropic, MiniMax, GLM and others with per-module model assignment, so a cross-family writer/reviewer pairing is configurable — but no cross-family policy is stated, recommended or defaulted."
  assurance_runtime:
    score: 2
    note: "Multiple in-pipeline gates: 19 gate/persistence modules including result gates, an idea Evaluator and Judge, an experiment Verifier, a Coherence Checker, per-node timeouts, retry with backoff and a global max_rounds ceiling. No claim-faithfulness, citation-grounding or figure-inspection audit."
  cross_platform_portability:
    score: 2
    note: "Four-plus LLM providers behind the dispatcher and AI coding skills shipped for two agent runtimes (Claude Code and OpenCode); pip-installable, but the PDF-parsing extra requires CUDA."
scored_on: "2026-09-08"

limitations:
  - "No LICENSE file despite the README's prose claim of MIT — the GitHub API reports no license and a root directory listing on 2026-09-08 confirms no LICENSE/COPYING file, so reuse terms are undeclared."
  - "Two of the paper's four headline contributions could not be confirmed from public material: extracting and cloning repository URLs found in paper bodies (paper-to-code linking), and cross-run knowledge accumulation. The README documents full and incremental paper indexing and knowledge-graph retrieval, but not either of those mechanisms."
  - "No evaluation of any kind. One appended machine-generated paper is the entire evidence base; there is no reported success rate, no comparison against AI-Scientist-class baselines, and no ablation of the features the paper argues for."
  - "5 commits, 10 stars, 0 forks, nothing pushed since 2026-06-15: a 140-module framework that no external user has demonstrably run."
  - "Generality is asserted rather than shown — the crawler set is heavily life-science and CS, and the single demonstration is an ML-style paper, so the claim that YAML workflows adapt across disciplines is untested."

