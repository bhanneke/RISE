  - paper-metadata

data_sources:
  - harvard-dataverse

knowledge_sources:
  - published-social-science-corpus

scores:
  lifecycle_coverage:
    score: 0
    note: "Single stage: a task set targeting replication. It produces no scholarship itself — the coverage lives entirely in the agents being measured."
  autonomy_level:
    score: 0
    note: "Static JSON task set curated by the authors; all agency belongs to the coding agents attempting the tasks."
  architectural_transparency:
    score: 2
    note: "Gold answers, research questions and paper metadata are published as three documented JSON files, and the paper describes the task construction — but the repo ships no scoring harness, no agent prompts and no run configs, so the measured pipeline cannot be inspected."
  inputs_supported:
    score: 1
    note: "One input form (a reproduction task = paper metadata + research question + the authors' code and data), with data access supplied off-repo via the anonymised Harvard Dataverse deposit; no standardized agent interface."
  outputs_reproducibility:
    score: 0
    note: "No system outputs. The gold-answer JSON is a durable artifact, but with no runner or scoring script in the repo the reported Claude Code and Codex accuracies cannot be regenerated from what is published here."
  internal_evaluation:
    score: 2
    note: "Systematic evaluation of two frontier coding agents across all 221 tasks, reported at both task and paper level in a companion arXiv preprint (2606.11447, submitted 2026-06-09); not peer-reviewed at scoring date and no third-party replication of the measurement."
  openness:
    score: 1
    note: "The repo page states CC BY 4.0 but the GitHub API reports 'Other (NOASSERTION)', so terms are ambiguous; the materials themselves are gated behind an off-repo anonymised Dataverse deposit, some tasks require a commercial Stata license, and no harness is provided — reproducing the headline numbers is not possible from the repo alone."
  maturity_traction:
    score: 1
    note: "13 stars, 1 fork, 7 commits, all on 2026-03-06 — created and last pushed the same day, untouched since. Credible author team (Zurich / NYU) and a widely-noticed preprint, but no external users or releases."
  cross_family_policy:
    score: 0
    note: "Not applicable — a static task set with no runtime and no policy on solving systems. The paper does compare across families (Claude Code vs Codex), but that is the object of measurement, not a cross-family review requirement."
  assurance_runtime:
    score: 0
    note: "No runtime, so no in-flight checks. The 'No Data' / 'No Code or Data' traps are an integrity property of the *benchmark design*, catching agent overclaiming after the fact rather than gating a pipeline as it runs."
  cross_platform_portability:
    score: 3
    note: "Plain JSON gold answers plus a Dataverse deposit, agent-agnostic and format-minimal; already exercised against two entirely different agent stacks, and the tasks span three analysis languages, so nothing in the artifact assumes a runtime."
scored_on: "2026-09-08"

limitations:
  - "No evaluation harness, scoring script or leaderboard in the repo, so the reported 93.4% / 78.0% and 62.1% / 35.8% figures are not independently reproducible from what is published."
  - "License ambiguity: repo page says CC BY 4.0, GitHub API reports NOASSERTION."
  - "Untouched since its creation day (2026-03-06), so the task set will not track newer agents or newly deposited papers."
  - "Gold answers are published in plain JSON in a public repo — a standing training-contamination risk for any agent evaluated after the release date."
  - "Measures the easier reproduction task: reproducing a result *from the authors' own code*, not rebuilding the analysis from methods and data as social-science-replicability does."
  - "Replication materials are anonymised and hosted off-repo on Dataverse; some tasks additionally require a commercial Stata license."
  - "The arXiv abstract does not state the headline percentages — the accuracy figures come from the repo README, so the two sources should be cited distinctly."

related:
