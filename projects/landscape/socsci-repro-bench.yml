slug: socsci-repro-bench
name: "SocSci-Repro-Bench"
type: external
status: dormant
url: "https://github.com/malizad/SocSci-Repro-Bench"
maintainers:
  - "Meysam Alizadeh"
  - "Mohsen Mosleh"
  - "Fabrizio Gilardi"
  - "Atoosa Kasirzadeh"
  - "Joshua Tucker"
year_started: 2026

positioning: >
  A benchmark of 221 reproduction tasks drawn from 54 published
  social-science papers across four disciplines (political science,
  sociology, economics, psychology) and roughly a dozen substantive
  domains, where an agent must execute the authors' own analysis code in
  R, Python or Stata and extract the target quantitative result. The
  repo holds the gold answers (`SocSci_Repro_Bench.json`), the research
  questions (`SocSci_Repro_Bench_RQ.json`) and paper metadata
  (`SocSci_Repro_Bench_Metadata.json`); the anonymised replication
  materials for all 54 papers live on Harvard Dataverse. Sits in the
  RISE evaluation-infrastructure layer next to social-science-replicability
  and reprorepo, and is the only entry there that scores
  computational reproducibility on social-science papers with Stata in
  the loop.

distinctive_contribution: >
  Two design choices make it a real test rather than a pass-rate
  exercise. First, the task set deliberately includes papers that are
  *not* reproducible because materials are missing, marked "No Data" or
  "No Code or Data", so an agent can be wrong by succeeding — a
  hallucinated result on an infeasible task is scored as failure.
  Second, it reports a paper-level metric alongside the task-level one:
  the repo README gives Claude Code 93.4% task-level but only 78.0%
  paper-level, and Codex 62.1% and 35.8%, exposing how much task-level
  accuracy overstates whether a paper actually reproduces.

focus: replication

pipeline_stages:
  - replication

architectural_features: []

discipline: social-sciences

inputs:
  - published-paper-with-author-materials

outputs:
