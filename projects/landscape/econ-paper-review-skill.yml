slug: econ-paper-review-skill
name: "Econ Paper Review Skill (econ-review)"
type: external
status: active
url: "https://github.com/hanlulong/econ-paper-review-skill"
license: "PolyForm Noncommercial 1.0.0 (source-available; free for academic/nonprofit use, commercial use requires separate terms)"
maintainers:
  - "Lu Han"
year_started: 2026

positioning: >
  A referee-simulation Claude Code/Codex skill for economics (and
  adjacent social-science) manuscripts: it reads a paper, reconstructs
  its argument and evidence chain, checks quotations, calculations and
  citations against the source and against live literature, and
  produces a typeset referee report plus a prioritized, agent-ready
  revision plan. It is one of three sibling tools from the same author
  (alongside the already-catalogued openecon-data and stata-mcp) and
  is named as the self-refereeing component inside the author's own
  envisioned econ-auto-research pipeline (not yet released — see
  watch-list).

distinctive_contribution: >
  Verification-first design: every comment either quotes the
  manuscript directly or names the specific checked comparison or
  calculation it rests on, and claims of novelty or missing citations
  trigger a live literature search before being included, rather than
  being asserted from the model's own training knowledge. This
  distinguishes it from the catalog's more generic, model-ensemble
  referee tools (ai-peer-review-skill, Reviewer) by making
  per-comment evidentiary grounding the core trust mechanism, and by
  being deliberately economics/social-science-specific (identification
  strategy, proofs, reproducibility standards) rather than
  domain-agnostic.

