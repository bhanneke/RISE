scores:
  lifecycle_coverage:
    score: 1
    note: "Covers referee-simulation plus a structured revision-editing handoff (the revision plan); no literature-discovery, data, or drafting stages of its own."
  autonomy_level:
    score: 1
    note: "Copilot: a full review runs unattended for 30+ minutes, but the author must read the report and decide what to implement before any revision proceeds."
  architectural_transparency:
    score: 2
    note: "Source-available (PolyForm Noncommercial) with the review methodology (reconstruct -> verify -> report) documented in the README; the verification engine's internals are not fully walked through as prompts."
  inputs_supported:
    score: 1
    note: "A single input form (the manuscript) plus live literature-verification access; no structured data or multi-format research input."
  outputs_reproducibility:
    score: 1
    note: "Persists a referee report and revision plan (prose/structured text); output can vary run to run and is not itself a versioned analysis artifact."
  internal_evaluation:
    score: 1
    note: "Demonstrated via one bundled sample review (25 comments) on a demo manuscript with intentionally inserted errors; no external benchmark or human-referee comparison reported."
  openness:
    score: 1
    note: "Source-available under PolyForm Noncommercial 1.0.0 — free for academic/nonprofit use but not an OSI-permissive license; commercial use requires a separate agreement."
  maturity_traction:
    score: 1
    note: "25 stars, 5 forks, 36 commits; young (first public ~2026), single-author."
  cross_family_policy:
    score: 0
    note: "Single-agent by design (one Claude Code or Codex session); no cross-model-family review step."
  assurance_runtime:
    score: 2
    note: "Built-in verification passes (quotation/calculation checks, live literature verification for novelty/citation claims) run before comments are finalized, described as happening 'late in the run' specifically to keep comments trustworthy."
  cross_platform_portability:
    score: 1
    note: "Supports two agent runtimes (Claude Code and Codex) via a standalone-skill or plugin install."
scored_on: "2026-10-01"

