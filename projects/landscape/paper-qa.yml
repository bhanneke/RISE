slug: paper-qa
name: "PaperQA2 (FutureHouse)"
type: external
status: active
url: "https://github.com/Future-House/paper-qa"
maintainers:
  - "FutureHouse"
year_started: 2023

positioning: >
  A high-accuracy retrieval-augmented generation package focused on
  scientific PDFs (and Office docs, source code). PaperQA2 combines
  agentic document retrieval with metadata enrichment (incl.
  retraction checks) to answer questions over scientific corpora with
  citations. Sits in the knowledge-layer block of the RISE diagram as
  a building block, not a full pipeline.

distinctive_contribution: >
  Reports superhuman performance on scientific QA, summarization, and
  contradiction-detection tasks in the accompanying 2024 paper, with
  particular attention to citation accuracy and retraction awareness.
  Distributed as a battle-tested library that other RISE projects can
  embed.

focus: literature

pipeline_stages:
  - literature-discovery
  - literature-synthesis

architectural_features:
  - multi-agent
  - tool-use
  - rag-knowledge-base
  - artifact-versioning

discipline: general

