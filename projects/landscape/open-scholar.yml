slug: open-scholar
name: "OpenScholar (AI2)"
type: external
status: dormant
url: "https://github.com/AkariAsai/OpenScholar"
maintainers:
  - "Akari Asai"
  - "Allen Institute for AI"
year_started: 2024

positioning: >
  A retrieval-augmented LM designed to answer scientific queries by
  searching the literature and generating responses grounded in
  sources. Releases include training code, an 8B fine-tuned Llama
  checkpoint, an offline retrieval index, and the ScholarQABench
  evaluation suite. Sits in the literature block of the RISE diagram
  with strong evaluation tooling.

distinctive_contribution: >
  Pairs the inference system with two purpose-built evaluation
  artifacts — ScholarQABench (automatic) and OpenScholar_ExpertEval
  (human) — addressing the under-developed *evaluation* axis of
  scholarly-synthesis systems. Open weights make it usable as a
  research baseline.

focus: literature

pipeline_stages:
  - literature-discovery
  - literature-synthesis

architectural_features:
  - rag-knowledge-base
  - tool-use
  - iterative-loop

discipline: general

