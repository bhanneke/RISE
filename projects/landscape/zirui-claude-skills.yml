slug: zirui-claude-skills
name: "Claude Code Skills for Empirical Research (zirui-song)"
type: external
status: active
url: "https://github.com/zirui-song/claude-skills"
license: "MIT"
maintainers:
  - "Zirui Song"
year_started: 2026

positioning: >
  A personal Claude Code skill pack of 21 skills for empirical
  economics/finance research, split into six legacy "/command"-style
  skills (robustness checklist, literature review, coding guidelines,
  data documentation, project structure, referee response) and fifteen
  newer agent-skill-format skills organised into four groups: an
  empirical pipeline group (table regeneration, pipeline refresh,
  Stata-preflight, robustness-battery, spec-curve-sweep, power-first), a
  verification group (verify-claims, verify-numbers-pipeline,
  referee-panel), a LaTeX/Overleaf sync group, and a cross-model-review
  group built on Claude-Codex plan debate.

distinctive_contribution: >
  Unlike most cataloged economics skill packs, this one's centre of
  gravity is runtime numerical assurance rather than drafting or
  literature work: verify-numbers-pipeline builds a YAML claim manifest
  of every reported statistic plus a verify_numbers.py checker wired to
  a git pre-commit hook that blocks a commit containing a stale number,
  and referee-panel runs five parallel adversarial reviewers
  (identification, power, literature, provenance, independent
  replication) into one ranked threat memo. spec-curve-sweep operationalises
  a 200-500-specification sweep with a resumable runner and drafted
  online appendix — a concrete, code-backed version of specification-curve
  analysis rarely automated elsewhere in this catalog.

