slug: asta-autodiscovery
name: "Asta AutoDiscovery"
type: external
status: active
url: "https://allenai.org/blog/autodiscovery"
maintainers:
  - "Allen Institute for AI (Ai2)"
year_started: 2025

positioning: >
  Ai2's autonomous data-driven discovery agent (formerly AutoDS;
  relaunched inside AstaLabs on 2026-02-12): pointed at a structured
  dataset, it generates natural-language hypotheses, proposes
  experiment plans, writes and executes Python analyses — up to 500
  experiments in a session — and ranks the resulting findings by
  Bayesian surprise, the shift from the LLM's prior to posterior
  belief in each hypothesis. Sits at the hypothesis-generation →
  data-analysis → code-generation slice of the pipeline; no
  literature layer and no paper drafting.

distinctive_contribution: >
  The first production discovery agent to use Bayesian surprise as
  the objective: an MCTS search with progressive widening treats
  surprisal as reward, so the system hunts belief-shifting findings
  rather than confirmations. Early-access users have generated 46K+
  hypotheses across oncology, neuroscience, climate science, and the
  social sciences, and several independently verified social-science
  findings were published in a peer-reviewed paper (arXiv:2511.12529).
  In an August 2026 partnership with Providence Swedish Cancer
  Institute's Paul G. Allen Research Center, AutoDiscovery applied to
  TCGA data flagged a stronger-than-expected immune signature in
  invasive lobular carcinoma, validated on an independent cohort and
  posted as a preprint.

