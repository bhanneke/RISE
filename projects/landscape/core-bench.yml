slug: core-bench
name: "CORE-Bench"
type: external
status: dormant
url: "https://github.com/siegelz/core-bench"
maintainers:
  - "Zachary S. Siegel"
  - "Sayash Kapoor"
  - "Nitya Nadgir"
  - "Benedikt Stroebl"
  - "Arvind Narayanan"
year_started: 2024

positioning: >
  A computational-reproducibility benchmark: 270 tasks built from 90
  published papers (Code Ocean capsules) in computer science, social
  science and medicine, written in Python or R, each asking an agent to
  reproduce the reported results and then answer written and
  vision-based questions about the output into a supplied
  `report.json`. Three difficulty tiers strip away scaffolding on the
  same 90 papers: CORE-Bench-Easy hands the agent the complete output
  of a successful run, Medium supplies the Dockerfile plus a README,
  Hard gives only the README so the agent must install dependencies and
  work out the run command itself. Sits in the RISE
  evaluation-infrastructure layer next to socsci-repro-bench,
  reprorepo and NatureBench, and is the reference benchmark for the
  reproducibility end of that layer.

distinctive_contribution: >
  The tiered design isolates *where* reproducibility agents fail
  rather than reporting one pass rate: with the same papers at every
  level, CORE-Agent on GPT-4o scores 60.00% (Easy), 57.78% (Medium)
  and 21.48% (Hard), which localises the bottleneck in environment
  setup rather than in reading results, while the split between 87.88%
  correct on written questions and 59.26% on vision questions isolates
  figure reading as a separate failure mode. It also ships a
  task-specialised agent (CORE-Agent, derived from a general AutoGPT
  baseline) alongside the harness and publishes its own cost curve —
  $0.6407 / $1.2005 / $2.9643 average per task under a $4 cap — one of
  the few benchmarks in the catalog that reports what running it costs.

focus: replication

pipeline_stages:
  - replication

architectural_features:
  - tool-use

discipline: general

inputs:
  - code-capsule
  - task-questions
  - dockerfile-or-readme

outputs:
