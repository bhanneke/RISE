scores:
  lifecycle_coverage:
    score: 2
    note: "Five stages (literature discovery/synthesis, notation/math revision, drafting, presentation output) but no data-analysis, research-design, or referee-simulation skill."
  autonomy_level:
    score: 1
    note: "audit-econ presents severity-sorted findings for the user to triage and 'manages fix workflow' rather than auto-committing fixes; lit-review stress-tests via an adversarial referee but surfaces the gap for the user."
  architectural_transparency:
    score: 3
    note: "All seven skills are public Markdown with explicit sub-agent and consensus-mechanism descriptions; no closed components."
  inputs_supported:
    score: 2
    note: "Multiple input forms (citekey, pasted PDF, LaTeX document, .bib file) plus a literature-access pathway via lit-review's multi-agent search; no private data-source access."
  outputs_reproducibility:
    score: 2
    note: "Persists compiled LaTeX documents, Beamer decks, and standalone-PDF figures/tables, but requires per-user placeholder setup (paths, Zotero/Better BibTeX) and has no cross-skill artifact manifest."
  internal_evaluation:
    score: 0
    note: "No test fixtures, benchmark, or reported evaluation for any of the seven skills at scoring date."
  openness:
    score: 2
    note: "MIT license; functional use requires replacing ~10 user-specific placeholders and a Zotero + Better BibTeX bibliography pipeline, so not zero-setup."
  maturity_traction:
    score: 1
    note: "7 stars, 1 fork, single commit on record at scoring date — a young, single-maintainer personal tool."
  cross_family_policy:
    score: 0
    note: "No cross-model-family mechanism described; audit-econ's 'consensus' is among same-family Opus sub-agents, not across model families."
  assurance_runtime:
    score: 2
    note: "audit-econ dispatches independent sub-agents to a Delphi consensus before reporting findings; lit-review stress-tests its own novelty claim with an adversarial referee pass until convergence."
  cross_platform_portability:
    score: 0
    note: "Claude Code only; no stated support for other agent runtimes."
