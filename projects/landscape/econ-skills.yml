slug: econ-skills
name: "econ-skills (zbsaygin)"
type: external
status: active
url: "https://github.com/zbsaygin/econ-skills"
license: "MIT"
maintainers:
  - "zbsaygin"
year_started: 2026

positioning: >
  A personal Claude Code skill pack for academic economics research
  workflows: reading papers by citekey, multi-agent literature review
  with novelty assessment, a Delphi-consensus correctness audit of math
  and econometrics, Econometrica-style notation cleanup, and LaTeX
  document/Beamer-slide/figure production. Spans literature discovery
  through paper-drafting and presentation output.

distinctive_contribution: >
  notation-clean is a narrow, unusual skill not found in any other
  cataloged pack: it audits and simplifies mathematical notation against
  an explicit "Econometrica publication standard" (Greek-for-parameters
  vs. Latin-for-variables, a 5-use threshold for introducing new symbols,
  reserved-symbol collision checks), triggered specifically on
  notation-focused requests rather than general correctness review.
  audit-econ pairs this with a Delphi-consensus multi-agent audit of
  derivations, econometrics, code, and data.

focus: analysis

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - revision-editing
  - paper-drafting
  - dissemination

architectural_features:
  - multi-agent
  - debate-consensus
  - tool-use

discipline: economics

