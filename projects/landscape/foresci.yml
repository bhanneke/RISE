slug: foresci
name: "ForeSci"
type: external
status: research-prototype
url: "https://github.com/roytian1992/ResearchForesight"
license: "none"
maintainers:
  - "Tian, Qiuyu"
  - "Yin, Haojie"
  - "Xia, Yingce"
  - "Kong, Youyong"
  - "Liu, Zequn"
year_started: 2026

positioning: >
  A temporally-controlled benchmark of 500 tasks testing whether LLM
  agents can make forward-looking research judgments — direction
  forecasting, bottleneck/opportunity discovery, strategic research
  planning, and venue-aware positioning — from a frozen, cutoff-dated
  knowledge base (~7,500 documents across four fast-moving AI subfields:
  LLM agents, fine-tuning, RAG systems, visual generative modeling),
  with post-cutoff papers held out purely for validation. Sits in the
  RISE evaluation-infrastructure layer testing the rq-formulation /
  research-design front end of the pipeline, alongside `econcs-bench`
  and `naturebench`, rather than any component that itself produces a
  paper.

distinctive_contribution: >
  The only benchmark in the catalog scoring forward-looking research
  judgment itself — what should be studied next, and where it would be
  publishable — rather than execution skill, via a leakage-controlled
  design (knowledge base frozen at a cutoff, evaluation targets drawn
  only from post-cutoff papers) and family-specific LLM-as-judge rubrics
  for persuasiveness and evidence traceability.

focus: ideation

pipeline_stages:
  - rq-formulation
  - hypothesis-generation
  - research-design
  - dissemination

architectural_features: []

discipline: computer-science

inputs:
  - frozen-knowledge-base
  - task-prompt

outputs:
