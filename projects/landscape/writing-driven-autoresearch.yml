slug: writing-driven-autoresearch
name: "Writing-Driven Autoresearch"
type: external
status: active
url: "https://github.com/happyhappy-jun/writing-driven-autoresearch"
maintainers:
  - "Byungjun Yoon (happyhappy-jun)"
year_started: 2026

positioning: >
  A multi-agent harness that inverts the usual autoresearch order:
  instead of experimenting and then writing up, it drafts a complete
  submittable paper first — claims, tables and all, with the numbers
  standing in as placeholders — and then drives every experiment from
  the claims in that draft in a modify → measure → verify → revise
  loop. The founding instruction is "write the paper first, then make
  it true". Published as the complete run record of the 1st-place
  entry in the Auto Research track of Ralphthon@ICML 2026, not as an
  installable framework: three agent personas (master.md,
  experiment.md, writing.md), the writing guidelines they were held
  to, 136 timestamped decisions and 53 result JSONs under ralph/, the
  experiment scripts, and the resulting paper source and PDF, secrets
  redacted and otherwise exactly as the agents left them.

distinctive_contribution: >
  Number provenance enforced by tooling rather than trust. Two LaTeX
  macros split invented numbers (\ph{}) from measured ones (\phm{});
  every \phm{} maps to an exact key in a result JSON through a
  placeholder ledger (ralph/PH-LEDGER.md); verify-phm.py checks each
  claimed number against those JSONs; and writing-audit.sh fails the
  build if any unfilled \ph{} survives to submission — so, in the
  authors' framing, the paper is true because the system was built to
  make untruth expensive. No other entry in the catalog makes an
  unverified number a build failure, and none ships its full decision
  log as the artifact.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - research-design
  - code-generation
  - data-analysis
  - paper-drafting
  - revision-editing

architectural_features:
  - multi-agent
  - tool-use
  - iterative-loop
  - artifact-versioning

discipline: computer-science

inputs:
  - research-task-spec
  - project-plan-document

outputs:
