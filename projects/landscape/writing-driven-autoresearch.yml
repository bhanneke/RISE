scores:
  lifecycle_coverage:
    score: 2
    note: "Six stages from claim formulation through experiment design, implementation, measurement and revision to a compiled paper — a substantial slice, but with no literature stage and no referee simulation."
  autonomy_level:
    score: 3
    note: "Three agents produced a complete workshop paper in three hours under hackathon rules with minimal human guidance; the integrity checks are scripts in the build, not human approval gates. Evidence is a single run."
  architectural_transparency:
    score: 3
    note: "The repo is the trace: agent persona files, writing guidelines and style guide, the four integrity scripts (verify-phm.py, writing-audit.sh, unwrap-phm.sh, gen-table.py), the 1,100-line plan, all 136 decisions and all 53 result JSONs are published under Apache-2.0."
  inputs_supported:
    score: 0
    note: "One narrow input form — a research task plus a hand-written project spec. No literature retrieval, no dataset connectors; the only data is what the agents' own scripts generate."
  outputs_reproducibility:
    score: 2
    note: "Unusually strong artifact provenance — every claimed number traces to a named key in a shipped result JSON and is mechanically checkable — but the run itself cannot be re-executed: nothing is packaged, and the models used are not named or pinned."
  internal_evaluation:
    score: 2
    note: "Externally judged: 1st place in the Auto Research track of Ralphthon@ICML 2026 before 11 expert reviewers. That is one run scored in a hackathon, not peer review, and the writing-driven method is never ablated against an experiment-first run."
  openness:
    score: 2
    note: "Apache-2.0 with the entire run public, but the README states it is not a framework to install, and the experiments needed GPU-scale training plus paid frontier agents — so nothing here is reproducible on commodity hardware."
  maturity_traction:
    score: 0
    note: "A demonstration by construction: 21 stars, 1 fork, one three-hour run frozen on 2026-07-14, no release, no packaging, and an explicit statement that it is not installable. Scored on installability and adoption, not on quality of the idea."
  cross_family_policy:
    score: 0
    note: "No reviewer role and no model-family policy: verification is deterministic scripts checking numbers against JSONs, and the README does not name which models ran the three personas."
  assurance_runtime:
    score: 3
    note: "The entry's whole point is a gating runtime audit of claim-to-evidence faithfulness: macro-level separation of guessed from measured numbers, a ledger binding each measured value to a result-JSON key, per-number mechanical verification, and a build that fails on any surviving unverified placeholder. Narrower than a full stack — no figure inspection and no proof checking."
  cross_platform_portability:
    score: 1
    note: "The harness is plain Markdown personas plus POSIX shell and Python, so it is portable in form, but nothing is packaged, no runtime or provider is named, and it has been run once — portability is untested."
scored_on: "2026-09-08"

limitations:
  - "Not an installable framework — the README says so outright. It is one run's record with secrets redacted, so adopting the method means reading the personas and scripts and reimplementing them."
  - "n = 1. A single three-hour run that won a hackathon track is the entire evidence base: no repeated trials, no ablation against an experiment-first ordering, and no reported failure rate for the placeholder-verification loop."
  - "The honesty guarantee is narrower than it sounds. It proves a number in the text matches a number in a JSON the agents produced. It says nothing about whether the measurement was the right one — which is where economics claims actually fail, since no ledger key can verify an identification assumption."
  - "No literature stage: nothing retrieves or cites prior work, so every novelty and positioning claim in the draft is unverified by construction — a serious gap for a method whose first act is asserting the paper's claims."
  - "Subject matter is ML training (Depth-AR, skipping transformer layers), where the agents wrote both the claim and the measurement script. The provenance mechanism transfers to other fields; the demonstrated competence does not."
  - "21 stars, 1 fork, and the models used are unnamed, so the run cannot be priced or re-attempted like-for-like."

