slug: agent-economist
name: "AgentEconomist"
type: external
status: active
url: "https://arxiv.org/abs/2604.27725"
maintainers:
  - "Zhongguancun Academy / Tsinghua University / USTC (Chen, He, Li, et al.)"
year_started: 2026

positioning: >
  An interactive research copilot (arXiv:2604.27725) that turns a
  human researcher's abstract economic intuition into a runnable
  agent-based computational experiment. Three stages — literature-
  grounded hypothesis drafting, experimental-design/simulator
  parameterization, and experiment execution — sit on top of
  AgentEconomy, an LLM-driven agent-based macroeconomic simulator
  (households, firms, government, banking, calibrated from empirical
  microdata). A human reviews and steers each stage.

distinctive_contribution: >
  Targets the ideation-to-simulation slice of the economics research
  pipeline specifically, pairing a 13,000+ paper domain knowledge base
  with a full agent-based macro simulator rather than a generic code
  sandbox; explicitly positions itself against "The AI Scientist"-style
  systems, arguing those optimize for an autonomous end product over
  supporting the human's own research process.

focus: analysis

pipeline_stages:
  - hypothesis-generation
  - research-design
  - formal-modeling
  - data-analysis

architectural_features:
  - multi-agent
  - human-in-loop
  - rag-knowledge-base
  - tool-use
  - iterative-loop

discipline: economics

inputs:
  - research-direction

outputs:
  - computational-results
  - simulation-code

data_sources:
