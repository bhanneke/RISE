slug: evoscientist
name: "EvoScientist"
type: external
status: active
url: "https://github.com/EvoScientist/EvoScientist"
maintainers:
  - "EvoScientist team"
year_started: 2026

positioning: >
  A self-evolving AI scientist system (arXiv:2603.08127) built on
  the DeepAgents framework. Six sub-agents (plan, research, code,
  debug, analyze, write) co-evolve with persistent memory, adaptive
  per-turn tool selection, dynamic system-prompt rewriting, and
  installable skill / knowledge packs (EvoSkills). Positioned around
  "vibe research" — a human-on-the-loop paradigm where the AI acts
  as a co-evolving research buddy that internalizes scholarly taste.

distinctive_contribution: >
  Strongest external-benchmark trajectory in the catalog: #1 on
  DeepResearch Bench, #1 on DeepResearch Bench II, #1 on AstaBench
  Code & Execution, #1 on AstaBench Data Analysis (all at submission
  time), plus 6/6 papers accepted at ICAIS 2025 with Best Paper +
  Appraisal awards. Skills + memory architecture is engineered for
  *evolution* over sessions, not just task completion.

focus: end-to-end

pipeline_stages:
  - rq-formulation
  - hypothesis-generation
  - literature-discovery
  - literature-synthesis
  - research-design
  - data-analysis
  - code-generation
  - paper-drafting
  - revision-editing

architectural_features:
  - multi-agent
  - human-in-loop
  - tool-use
  - rag-knowledge-base
  - persistent-memory
  - iterative-loop
  - artifact-versioning

discipline: general

inputs:
  - research-direction
  - prior-context

outputs:
  - research-report
  - code
  - paper-draft
  - evolved-skills

data_sources:
  - user-provided

knowledge_sources:
  - mcp-servers
  - evoskills

scores:
