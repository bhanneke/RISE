slug: aarri-bench
name: "AARRI-Bench"
type: external
status: active
url: "https://github.com/AARR-bench/AARRI-bench"
maintainers:
  - "AARR-bench team"
year_started: 2026

positioning: >
  "Act As a Real Research Intern" (arXiv:2606.07462) — 82
  containerized scenarios in standardized Harbor task format, each
  with an assertion-based verifier, probing whether LLM agents show
  the professionalism of human researchers in *granular* research
  situations (citation integrity, ablation-completeness audits,
  dead-end recognition, contradictory-advisor merging) rather than
  end-to-end execution. Inaugural stage of a planned three-stage
  AARR series (AARRI intern -> AARRA agent -> AARRS scientist); sits
  in the RISE evaluation-infrastructure layer alongside AstaBench,
  MLGym, and AIRS-Bench.

distinctive_contribution: >
  Isolates the micro-level judgment failures that end-to-end
  benchmarks average away — context sensitivity, independent
  judgment, knowing when to quit, collaboration under conflicting
  guidance — as individually verifiable scenarios. The 11-author
  paper reports the best configuration (Mini-SWE-Agent with Claude
  Opus 4.7) at a 68.3% success rate, quantifying a specific gap
  between frontier agent harnesses and human research interns.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - literature-synthesis
  - research-design
  - data-analysis
  - code-generation
  - revision-editing

architectural_features: []

discipline: computer-science

inputs:
  - task-specification
  - agent-implementation

outputs:
  - pass-fail-verdicts
  - evaluation-metrics

data_sources:
  - benchmark-tasks

knowledge_sources:
  - task-descriptions

scores:
  lifecycle_coverage:
    score: 0
    note: "Scenario catalog / evaluation target; does not produce scholarship itself."
  autonomy_level:
    score: 0
    note: "Static containerized scenarios with verifiers; all agency lives in the agents being evaluated."
  architectural_transparency:
    score: 3
    note: "All 82 task definitions with per-task test_outputs.py verifiers public in standardized Harbor format; arXiv paper documents the evaluation setup."
  inputs_supported:
    score: 1
    note: "Single standardized input form (Harbor containerized task); runnable via Harbor Hub registry or local installation."
  outputs_reproducibility:
    score: 2
    note: "Containerized environments plus deterministic assertion-based verification make scoring rerunnable; agent stochasticity limits exact trajectory reruns."
  internal_evaluation:
    score: 2
    note: "Systematic evaluation of frontier LLMs and agent harnesses in the companion paper (best 68.3%); arXiv-only, no third-party replication yet."
  openness:
    score: 1
    note: "Public repo, free to run, but no license file at scoring date — reuse terms unclear."
  maturity_traction:
    score: 1
    note: "Very young (Apr-Jun 2026) and small (8 stars); active single-team development anchored to an 11-author academic paper."
  cross_family_policy:
    score: 0
    note: "Not applicable — model-agnostic evaluation target; paper evaluates multiple families as subjects but the benchmark has no cross-family mechanism of its own."
  assurance_runtime:
    score: 1
    note: "Deterministic per-task pass/fail verification scripts; no in-flight integrity gating beyond final assertions."
  cross_platform_portability:
    score: 2
    note: "Harbor-format tasks run under multiple agent harnesses and any model provider; containerized execution required."
scored_on: "2026-07-23"

limitations:
  - "No license file at scoring date — reuse terms are unclear."
  - "Very early traction (8 stars, launched April 2026); single-team maintenance."
  - "Granular scenarios test judgment in isolation — deliberately does not measure end-to-end research execution, so it complements rather than replaces benchmarks like AIRS-Bench or MLGym."

