slug: deepresearch-bench
name: "DeepResearch Bench"
type: external
status: active
url: "https://github.com/Ayanami0730/deep_research_bench"
license: "Apache-2.0 (LICENSE file; the README badge says MIT)"
maintainers:
  - "Mingxuan Du"
  - "Benfeng Xu"
  - "et al."
year_started: 2025

positioning: >
  An ICLR 2026 benchmark of 100 PhD-level research tasks (50 Chinese,
  50 English) across 22 fields, written by domain experts to match
  real user query distributions, for evaluating "Deep Research Agent"
  (DRA) systems — i.e., web-search-and-synthesis agents rather than
  wet-lab or formal-modeling systems. Evaluates agent *outputs*
  (submitted reports) rather than running agents itself, so it sits
  downstream of systems like GPT-Researcher, STORM, or OpenAI/Gemini
  Deep Research in the RISE evaluation-infrastructure layer.

distinctive_contribution: >
  Two purpose-built automated evaluators instead of a single LLM
  judge: RACE (Reference-based Adaptive Criteria-driven Evaluation),
  which generates task-specific criteria across comprehensiveness,
  insight/depth, instruction-following and readability and scores
  reports against reference reports with task-adapted weights; and
  FACT (Framework for Factual Abundance and Citation Trustworthiness),
  which extracts statement-URL pairs, scrapes cited sources, and
  reports citation accuracy and effective-citation counts per task.
  The authors report strong agreement between RACE/FACT and human
  judges, and the repo has run a maintained public leaderboard since
  2025 (migrated its judge model from Gemini-2.5-Pro to GPT-5.5 in
  2026 after a Google API deprecation).

focus: end-to-end

pipeline_stages:
  - literature-discovery
  - literature-synthesis

architectural_features: []

discipline: general

