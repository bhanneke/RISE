scores:
  lifecycle_coverage:
    score: 0
    note: "Evaluation infrastructure; scores the literature-discovery/synthesis quality of agents under test, does not itself produce scholarship."
  autonomy_level:
    score: 0
    note: "Static query set plus an automated scoring pipeline (RACE + FACT); agency lives entirely in the deep-research agent being evaluated."
  architectural_transparency:
    score: 3
    note: "Public code and data (query set, evaluation criteria, RACE/FACT scripts), with the evaluator-model migration history documented in-repo and a companion paper describing both scoring methodologies."
  inputs_supported:
    score: 1
    note: "One input form — a JSON report per query matching the required schema — with no requirement on how the agent under test sources its literature or data."
  outputs_reproducibility:
    score: 2
    note: "Fixed 100-task query set with versioned reference/criteria data and a public leaderboard submission protocol (reproducibility link, raw articles, model metadata required); judge-model drift (Gemini to GPT-5.5) means absolute scores are not stable across the benchmark's own history."
  internal_evaluation:
    score: 2
    note: "Systematic cross-model evaluation reported for the official leaderboard with claimed strong RACE/FACT-vs-human agreement; peer-reviewed via ICLR 2026 acceptance, though human-judgment validation numbers are the authors' own and not independently replicated in this catalog."
  openness:
    score: 2
    note: "Code and benchmark data are public under Apache-2.0 (the LICENSE file; the README badge says MIT, checked 2026-11-02); official leaderboard submission requires a temporary GPT-5.5 access key from the maintainers."
  maturity_traction:
    score: 2
    note: "848 stars / 87 forks / 47 commits as of 2026-11-01, 21 open issues, ICLR 2026 acceptance, and an actively maintained leaderboard with a documented 2026 evaluator migration — real external usage, though governed by a single academic group."
  cross_family_policy:
    score: 0
    note: "Not applicable — model-agnostic evaluation target; the benchmark itself uses a fixed judge model (GPT-5.5) rather than a cross-family executor/reviewer pairing."
  assurance_runtime:
    score: 0
    note: "No runtime mechanism — FACT's citation checking and RACE's criteria scoring are both post-hoc evaluation of a finished report, not an in-flight gate during agent execution."
  cross_platform_portability:
    score: 1
    note: "Supports OpenRouter or direct OpenAI backends for the evaluator, and accepts any agent's output via a documented JSON schema, but ships as a single Python evaluation pipeline, not a multi-runtime protocol."
scored_on: "2026-11-01"

limitations:
  - "The README badge says MIT while the LICENSE file is Apache-2.0; the LICENSE file governs."
  - "Evaluates web-search-and-synthesis 'deep research' agents specifically — out of scope for systems that don't produce a written report (e.g., pure code/experiment agents)."
  - "Judge-model dependency: the 2026 forced migration from Gemini-2.5-Pro to GPT-5.5 after a Google deprecation shows leaderboard scores are not judge-model-stable over time; legacy results live on a separate Gemini-2.5 branch."
  - "Official leaderboard submission requires a maintainer-issued temporary API key, adding friction beyond self-hosted evaluation."

