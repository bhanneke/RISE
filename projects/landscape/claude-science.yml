scores:
  lifecycle_coverage:
    score: 2
    note: "Eight stages from literature through manuscript refinement, but no declared referee-simulation or dissemination stage; the background reviewer is a runtime check, not a review stage."
  autonomy_level:
    score: 2
    note: "Supervised agent: user sets the task; coordinating agent spawns specialists, manages compute, and self-corrects, with the user reviewing resulting artifacts."
  architectural_transparency:
    score: 1
    note: "Coordinator/specialist/reviewer agent topology, skills-and-connectors model, and compute management documented at a high level; no code, prompts, or orchestration internals."
  inputs_supported:
    score: 3
    note: "Research prompts, own datasets, and custom skills/connectors to lab tools; both literature access and 60+ scientific databases, plus private data via SSH to users' own clusters."
  outputs_reproducibility:
    score: 3
    note: "Headline design: every artifact ships with exact code, computational environment, plain-language methodology, and full message history — vendor-described, not yet independently verified."
  internal_evaluation:
    score: 1
    note: "Vendor-selected case studies (Manifold Bio, Allen Institute, UCSF Brain Tumor Center); no benchmark results or third-party evaluation."
  openness:
    score: 1
    note: "Closed-source, but since 2026-08-27 Anthropic's 'Claude Team plan for scientists' gives verified PIs at accredited universities/nonprofits a free standard seat (premium seats $15/mo, price locked one year) covering the Team tier Claude Science runs on — a genuine free tier, heavily gated behind PI verification and, for biology/chemistry, Opus-class-only model limits."
  maturity_traction:
    score: 2
    note: "Public beta (June 2026) with external users across paid tiers, named institutional early adopters, discounted academic Team plan, and a grants program; weeks old at scoring date."
  cross_family_policy:
    score: 0
    note: "Anthropic models only; no cross-family executor/reviewer configuration."
  assurance_runtime:
    score: 2
    note: "Background reviewer agent flags incorrect citations, untraceable numbers, and figure-code mismatches in-flight and self-corrects; gating behavior not documented."
  cross_platform_portability:
    score: 1
    note: "Single provider and dedicated macOS/Linux app, but compute targets span local machines, HPC via SSH, and Modal GPUs."
scored_on: "2026-09-01"

limitations:
  - "Closed-source and subscription-gated; cannot be audited, self-hosted, or pointed at non-Anthropic models."
  - "Pre-configured depth is life-science-specific (genomics, proteomics, structural biology, cheminformatics) and the grants program prioritizes biology — other disciplines start from a generic baseline."
  - "Effectiveness evidence is vendor-selected case studies rather than independent benchmarks; macOS/Linux only, no Windows."

