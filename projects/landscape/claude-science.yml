slug: claude-science
name: "Claude Science"
type: external
status: active
url: "https://claude.com/product/claude-science"
maintainers:
  - "Anthropic"
year_started: 2026

positioning: >
  Anthropic's AI workbench for researchers ("Claude Code for
  science"), announced 2026-06-30: a desktop app (macOS/Linux) in
  which a generalist coordinating agent with 60+ curated skills and
  connectors spawns specialist agents to run literature analysis,
  database queries, multistep data analyses, figure iteration, and
  manuscript drafting, with compute spanning the local machine, HPC
  clusters via SSH, and Modal GPUs. Covers a broad slice of the RISE
  pipeline from literature work through manuscript refinement, in
  the same big-lab workbench layer as Prism and Google Co-Scientist.

distinctive_contribution: >
  Auditable-artifact design: every figure ships with a
  reproducibility package (exact code, computational environment,
  plain-language methodology, full message history), and a
  background reviewer agent flags incorrect citations, untraceable
  numbers, and figures that don't match their underlying code as
  work progresses. Deepest pre-configured life-science stack of any
  big-lab offering — 60+ databases (UniProt, PDB, Ensembl, ChEMBL),
  NVIDIA BioNeMo Agent Toolkit, Evo 2, Boltz-2, OpenFold3 — backed
  by an AI-for-Science credit program (originally $30,000/project,
  applications closed 2026-07-15) that Anthropic expanded on
  2026-08-27 to up to $50,000 in API credits per project and beyond
  biology into mathematics and engineering, alongside 10,000 free or
  discounted Claude Team seats for verified academic PIs.

focus: end-to-end

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - research-design
  - data-acquisition
  - data-analysis
  - code-generation
  - paper-drafting
  - revision-editing

