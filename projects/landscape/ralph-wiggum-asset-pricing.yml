positioning: >
  Geoff Huntley's "Ralph Wiggum" loop applied to an academic asset-pricing
  paper: the human writes a paper specification (the paper in bullet
  points), an economic-background file and a test selection; then Claude
  Code or Codex, running with permissions disabled inside a firewalled dev
  container, repeats plan → improve → test on the LaTeX paper and R code
  until every PASS/FAIL test passes. The human stays "on the loop",
  watching logs and editing the spec between stretches. Sits in the
  drafting-and-revision layer of RISE for finance theory, next to ape and
  clo-author on the empirical side.

distinctive_contribution: >
  The loop's stopping rule is a test suite written for a finance paper:
  25 agent-run tests in six families (required elements, fact checks of
  claims against code output, literature and each other, conformance to
  the spec, theory-paper quality, figure rendering, writing) plus
  optional open-ended referee agents. It produced a public case study,
  "Hedging the Singularity" (arXiv 2604.16997), whose abstract discloses
  that it was AI-generated and whose human preface reports that the
  author could not reach "human as Clockmaker" (set up the loop, then
  accept the output unedited). Every iteration is a git commit, and the
  full run, a human-written preface and three human referee reports on
  an earlier paper are kept on separate branches for comparison.

