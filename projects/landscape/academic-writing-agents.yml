year_started: 2026

positioning: >
  A Claude Code plugin that puts a manuscript-audit orchestrator over
  twelve specialist agents: five read-only reviewers
  (consistency-checker, logic-reviewer, technical-reviewer,
  writing-reviewer, latex-layout-auditor), a bibliography-auditor, two
  web-enabled research agents (research-analyst for related work,
  novelty and positioning; brainstormer for alternative framings), a
  paper-crawler over the DBLP and OpenAlex APIs, and three agents that
  modify the source (prose-polisher, section-drafter,
  latex-figure-specialist). Invoked as `/academic <task>` or
  auto-triggered on `.tex` files, it fans the independent reviewers out
  in parallel, synthesises one report prioritised Critical / Important /
  Minor, then runs a sequential fix-and-verify pass. Sits in the
  drafting/revision band of RISE next to research-paper-writing-skills
  and Academic Research Skills, but is narrower and manuscript-first.

distinctive_contribution: >
  Review persistence. Findings are written to
  `.review/YYYY-MM-DD-<scope>.md`; a later pass compares file
  timestamps and re-reviews only sections that changed, and the action
  agents read the stored findings so each edit is traceable to the
  reviewer concern that motivated it — incremental review state that
  the larger skill catalogs in this band do not carry. Behaviour is
  pinned to a codified 30 Principles document (18.8 KB, six categories
  from structure and narrative through process and meta), and agent
  files declare their own tool set and model in frontmatter — the
  sampled consistency-checker declares `tools: Read, Glob, Grep` and
  `model: opus`, so the read-only reviewers structurally cannot edit
  the manuscript they are auditing.

