slug: kosmos
name: "Kosmos (jimmc414 implementation)"
type: external
status: research-prototype
url: "https://github.com/jimmc414/Kosmos"
maintainers:
  - "jimmc414"
year_started: 2025

positioning: >
  An open-source implementation of the Kosmos AI scientist
  architecture (Lu et al., arXiv:2511.02824), adapted to run via
  Claude Code or the Anthropic / OpenAI APIs. Runs autonomous
  research cycles: hypothesis generation, experiment design, code
  execution in sandboxed Docker, validation against an 8-dimension
  quality framework, and knowledge-graph construction.

distinctive_contribution: >
  Operationalizes the Kosmos architecture as a runnable system on
  commodity infrastructure, including a built-in 8-dimension
  validation harness and an explicit knowledge-graph layer that
  tracks concept relationships across cycles. The validation
  framework is independently reusable as a methodological scaffold.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - research-design
  - data-analysis
  - code-generation

architectural_features:
  - multi-agent
  - tool-use
  - rag-knowledge-base
  - persistent-memory
  - iterative-loop
  - artifact-versioning

discipline: general

inputs:
  - research-area
  - data

outputs:
  - hypotheses
  - experiment-results
  - knowledge-graph
  - validated-discoveries

data_sources:
  - user-provided

knowledge_sources:
  - literature
  - knowledge-graph

