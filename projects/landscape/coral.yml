slug: coral
name: "CORAL"
type: external
status: active
url: "https://github.com/Human-Agent-Society/CORAL"
maintainers:
  - "Human-Agent-Society"
year_started: 2026

positioning: >
  Infrastructure (arXiv:2604.01658) for *multi-agent autonomous
  self-evolution* — organizations of AI agents that run experiments,
  share knowledge through persistent stores, and continuously improve
  solutions against a user-supplied grading script. Sits in the
  *autoresearch infrastructure* layer alongside Aviary and MLGym, but
  emphasizes evolution and self-improvement rather than benchmarking.

distinctive_contribution: >
  Treats the *organization* of agents (workspaces, shared knowledge,
  judges) as a first-class engineering surface, with rubric-based
  judge packages (race_japan_grader, apex_judge) that themselves
  spawn Claude Code for evaluation. Natively integrated with Claude
  Code, OpenCode, Codex, and Cursor.

focus: end-to-end

pipeline_stages:
  - research-design
  - data-analysis
  - code-generation
  - referee-simulation

architectural_features:
  - multi-agent
  - persistent-memory
  - artifact-versioning
  - iterative-loop
  - debate-consensus

discipline: general

inputs:
  - codebase
  - grading-script

outputs:
