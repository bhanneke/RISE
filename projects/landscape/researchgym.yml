year_started: 2026

positioning: >
  A benchmark and execution environment (arXiv:2602.15112, ICLR 2026
  Agents in the Wild Workshop) that turns five oral/spotlight papers
  from ICML, ICLR, and ACL into 39 containerized sub-tasks: each
  paper's dataset, evaluation harness, and baseline code are kept, but
  its proposed method is hidden, so an agent must propose a hypothesis,
  implement it, and beat the paper's own metric. Sits in the RISE
  evaluation-infrastructure layer alongside AIRS-Bench, MLGym, and
  AstaBench.

distinctive_contribution: >
  A Gym-like `AgenticEnv` interface (UV-local or Docker runtime) with
  an explicit $10 default API-cost budget per 12-24h run, cost tracking
  baked into the harness, and a dedicated InspectionAgent that
  post-hoc audits each completed run for cheating or rule violations —
  a runtime-integrity layer most sibling benchmarks lack. The companion
  paper reports a GPT-5-based agent beating the provided human baseline
  in only 1 of 15 runs (6.7%) while completing ~26.5% of sub-tasks on
  average, with one run surpassing an ICML 2025 Spotlight result.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - research-design
  - data-analysis
  - code-generation

architectural_features: []

