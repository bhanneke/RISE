slug: ai-co-mathematician
name: "AI Co-Mathematician (Google DeepMind)"
type: external
status: active
url: "https://arxiv.org/abs/2605.06651"
maintainers:
  - "Google DeepMind"
year_started: 2026

positioning: >
  A closed, agentic multi-agent workbench (arXiv:2605.06651) built on
  Gemini 3.1 for open-ended *mathematics* research. A hierarchy of
  specialized agents runs under a top-level project coordinator across
  asynchronous, parallel workstreams — ideation, literature search,
  computational exploration, theorem proving, theory building —
  managing uncertainty, tracking failed hypotheses, and producing LaTeX
  write-ups with margin annotations and provenance notes. Explicitly
  modelled on agentic coding environments (e.g. Claude Code), it spans
  the full pipeline from research intent to a written mathematical
  result rather than optimizing a single stage.

distinctive_contribution: >
  One of the first agentic systems to demonstrate open-ended
  mathematical *discovery* rather than benchmark problem-solving alone:
  it scored 48% (23/48) on FrontierMath Tier 4 — versus 19% for the
  Gemini 3.1 Pro base model — and Oxford mathematician Marc Lackenby
  used it to resolve Problem 21.10 of the Kourovka Notebook, a
  group-theory question open since 1965. The RISE skills catalog's
  theorist-toolbox (co-math skills) explicitly emulates this system's
  coordinator + workstream + reviewer-gate design in an open,
  skills-as-Markdown form.

