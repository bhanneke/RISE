slug: academic-research-skills
name: "Academic Research Skills (ARS)"
type: external
status: active
url: "https://github.com/Imbad0202/academic-research-skills"
maintainers:
  - "Edward Cheng-I Wu"
year_started: 2026

positioning: >
  A comprehensive Claude Code plugin suite (v3.9.0 at scoring date)
  for the academic research pipeline: literature → write → review →
  revise → finalize. Three sub-suites — Deep Research (13 agents),
  Academic Paper (12 agents), Academic Paper Reviewer (7 agents) —
  with Style Calibration, anti-leakage protocols, Semantic Scholar
  API verification, VLM figure verification, and explicit human-in-
  the-loop gates throughout.

distinctive_contribution: >
  Most-adopted Claude Code-native research plugin (9k+ stars) with
  an explicit "AI as copilot, not pilot" design stance. v3.8
  introduces a *claim-faithfulness audit pass*
  (`ARS_CLAIM_AUDIT=1`) that fetches each cited source against
  three-layer citation anchors and gate-blocks output on five
  hallucination classes (claim-not-supported,
  negative-constraint-violation, fabricated-reference, anchorless,
  constraint-violation-uncited). This is the most operationally
  serious anti-hallucination apparatus in the catalog.

focus: end-to-end

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - paper-drafting
  - revision-editing
  - referee-simulation

architectural_features:
