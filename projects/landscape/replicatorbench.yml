slug: replicatorbench
name: "ReplicatorBench / ReplicatorAgent"
type: external
status: active
url: "https://github.com/CenterForOpenScience/llm-benchmarking"
license: "Apache-2.0"
maintainers:
  - "Center for Open Science (Shakhlo Nematova, Timothy M. Errington) with Old Dominion University, Penn State, and Notre Dame partners"
year_started: 2026

positioning: >
  A benchmark plus reference agent for evaluating whether LLM agents can
  replicate empirical findings in the social and behavioral sciences
  end-to-end: extracting replication-relevant metadata and data from a
  paper's PDF, designing and generating a replication analysis, executing
  it in a sandboxed Docker environment, interpreting the statistical
  results, and validating the verdict against expert-annotated
  human-coded ground truth. Sits in the RISE evaluation-infrastructure
  layer alongside core-bench, reprorepo, and repro-bench, but is
  purpose-built for social/behavioral-science replicability rather than
  ML-paper or natural-science reproduction.

distinctive_contribution: >
  Built by the Center for Open Science — the nonprofit behind OSF and the
  large-scale Reproducibility Projects in psychology and cancer biology —
  and funded by a Coefficient Giving grant explicitly targeting
  "Benchmarking LLM Agents on Consequential Real-World Tasks." The
  benchmark pairs human-verified replicable/non-replicable claims with an
  LLM-as-judge validator rather than self-reported scores, and the
  companion paper ("ReplicatorBench: Benchmarking LLM Agents for
  Replicability in Social and Behavioral Sciences") was accepted to the
  inaugural AI4Sciences track at KDD 2026.

focus: replication

pipeline_stages:
  - data-acquisition
  - research-design
  - code-generation
  - data-analysis
  - replication

architectural_features:
  - dag-orchestration
  - tool-use

discipline: social-sciences

inputs:
  - paper-pdf
  - dataset

outputs:
  - replication-code
  - replication-report
  - replication-verdict

data_sources:
  - paper-supplied-datasets

knowledge_sources:
  - paper-pdf-metadata

scores:
  lifecycle_coverage:
    score: 2
    note: "Covers extraction, research design, code generation, execution/analysis, and the replication verdict itself — five stages, but no literature or paper-drafting component."
  autonomy_level:
    score: 2
    note: "ReplicatorAgent runs extraction-through-validation without per-step human approval on a fixed benchmark task, but the system is operated as a research/benchmarking harness, not a self-directed research agent."
  architectural_transparency:
    score: 3
    note: "Full pipeline published (info_extractor/generator/interpreter/validator), with prompt templates, JSON schemas, and the paper's methodology."
  inputs_supported:
    score: 2
    note: "Two input forms (paper PDF + accompanying dataset/data files) with the paper itself as the knowledge source; no broader literature-corpus or idea/RQ input."
  outputs_reproducibility:
    score: 2
    note: "Persists replication code, analysis reports, and a verdict per benchmark item, but no versioned end-to-end artifact manifest demonstrated publicly."
  internal_evaluation:
    score: 2
    note: "Core design is a systematic benchmark: agent verdicts scored by an LLM-as-judge against expert-annotated ground truth; companion paper accepted to KDD 2026 AI4Sciences track."
  openness:
    score: 2
    note: "Apache-2.0, permissive; running it requires Docker sandboxing and LLM API access, so not zero-friction on commodity hardware."
  maturity_traction:
    score: 1
    note: "9 stars, 325 commits, young (created 2026); credible institutional backing (COS + three university partners + a dedicated grant) but minimal external community adoption yet."
  cross_family_policy:
    score: 0
    note: "No stated cross-model-family requirement or default; README does not describe a multi-provider review policy."
  assurance_runtime:
    score: 1
    note: "Sandboxed execution catches runtime/syntax failures in generated code; the LLM-as-judge validator is framed as benchmark scoring (post-hoc), not an in-flight integrity gate."
  cross_platform_portability:
    score: 1
    note: "Single benchmark framework targeting one agent implementation (ReplicatorAgent); no stated multi-IDE or multi-runtime support."
scored_on: "2026-10-01"

limitations:
  - "Very young repo (9 stars); KDD 2026 acceptance covers the benchmark paper, not independent third-party use of the released code."
  - "Benchmark size/coverage statistics are not disclosed in the public README."
  - "Requires Docker sandboxing and LLM API access to reproduce a run."
  - "The companion 'robustness' module is explicitly marked as an in-progress scaffold, underdeveloped relative to the replication module."

