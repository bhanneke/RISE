slug: statspai
name: "StatsPAI"
type: external
status: active
url: "https://github.com/brycewang-stanford/StatsPAI"
maintainers:
  - "Biaoyue (Bryce) Wang (Stanford REAP)"
  - "Scott Rozelle (Stanford REAP)"
year_started: 2025

positioning: >
  An "agent-native" Python library for causal inference and applied
  econometrics — a Stata/R-replacement workbench (regress, ivreg,
  feols, Callaway-Sant'Anna DiD, rdrobust, synthetic control,
  matching, DML, meta-learners, causal forests, structural
  estimation; 1,145 registered functions across 87 submodules) whose
  structured result objects, machine-readable schemas, and MCP server
  are designed for LLM agents to call. Sits in the
  infrastructure-for-pipelines layer of RISE, like ToolUniverse, not
  a research pipeline itself.

distinctive_contribution: >
  The catalog's clearest case of tooling redesigned *for* agents
  rather than agents wrapped around tooling: one `import statspai as
  sp` entry point, `.to_agent_summary()` / `.to_latex()` /
  serialization on every result object, an MCP server, and a
  validation-tiered registry that records per-estimator R/Stata
  reference-parity status separately from API breadth — explicitly so
  that surface area is not passed off as validation evidence.

focus: analysis

pipeline_stages:
  - data-analysis

