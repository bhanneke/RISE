scores:
  lifecycle_coverage:
    score: 0
    note: "Estimation/analysis library touching one stage; all other lifecycle stages are left to the calling agent or companion skill repos (AERS, Paper-WorkFlow)."
  autonomy_level:
    score: 0
    note: "Pure tool: every estimation call is driven by a human or an external agent; the library performs no orchestration of its own."
  architectural_transparency:
    score: 3
    note: "Full open source with machine-readable schemas, a function registry with per-estimator validation status, extensive docs, and a very detailed changelog."
  inputs_supported:
    score: 1
    note: "Single input form (dataframe + formula/estimator spec) plus bundled teaching datasets (Card 1995, LaLonde, mpdta, Lee 2008, Prop 99); no literature access."
  outputs_reproducibility:
    score: 2
    note: "Structured result objects with tidy/LaTeX/DOCX export, plotting, citation, and serialization; deterministic reruns, but no end-to-end paper/data-manifest artifacts."
  internal_evaluation:
    score: 2
    note: "R/Stata reference-parity tests with validation_status tiers and sp.cross_validate, ~200k LOC of tests in CI; JOSS review pending, no external validation yet."
  openness:
    score: 3
    note: "MIT license, pip-installable from PyPI, examples run offline on commodity hardware after install; Zenodo-archived releases."
  maturity_traction:
    score: 2
    note: "282 stars / 58 forks, v1.20.0 with rapid release cadence over ~12 months, PyPI + Zenodo DOI; external adoption still modest and peer review (JOSS) not yet complete."
  cross_family_policy:
    score: 0
    note: "Not applicable — no LLM in the loop; a deterministic library callable from any model family."
  assurance_runtime:
    score: 1
    note: "Schema-validated structured results, validation-tier metadata, and audit methods on result objects; no claim-audit stack (largely inapplicable to a library)."
  cross_platform_portability:
    score: 2
    note: "Three integration surfaces — plain Python API, MCP server, and skill packaging — all provider-agnostic, but deployment is confined to Python environments."
scored_on: "2026-07-23"

limitations:
  - "A library, not a research system: design choice, specification, and interpretation remain entirely with the calling agent or human."
  - "Only a subset of the 1,145 registered functions carries certified R/Stata parity — validation_status must be checked per estimator; API breadth outpaces validation depth."
  - "Very high single-team development velocity (~600 KB changelog, 97 KB migration guide in about a year) raises API-stability concerns; JOSS review still pending."

related:
