slug: reviewer
name: "Reviewer (Ingar30)"
type: external
status: active
url: "https://github.com/Ingar30/reviewer"
maintainers:
  - "Ingar30"
year_started: 2026

positioning: >
  A reproducible multi-agent reviewer for academic economics papers.
  Takes a PDF as input, runs a fixed set of mandatory reviewers plus
  dynamically-selected optional reviewers, validates their JSON output
  against schemas, deduplicates findings, and assembles a final editor
  report. Sits firmly in the referee-simulation stage of the RISE
  pipeline.

distinctive_contribution: >
  Treats peer review as a structured engineering problem with explicit
  schemas, validation, parser-quality preflight, and editor-bundle
  assembly — distinguishing itself from chat-style review assistants.
  Reviewer prompts and orchestration are open and reproducible; review
  outputs are kept private by default.

focus: review

pipeline_stages:
  - referee-simulation

architectural_features:
  - multi-agent
  - dag-orchestration
  - tool-use
  - artifact-versioning

discipline: economics

inputs:
