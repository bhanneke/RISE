knowledge_sources: []

scores:
  lifecycle_coverage:
    score: 1
    note: "Touches two adjacent stages (data-analysis, code-generation); no literature, drafting, or review coverage."
  autonomy_level:
    score: 0
    note: "Tool: every MCP call, kernel cell, or CLI command is issued by a human or calling agent; the daemon persists data but does not plan or execute tasks independently."
  architectural_transparency:
    score: 3
    note: "MIT-licensed, full source for all four frontends, comprehensive CI-covered test suite (schema, runner, console parser, MCP, kernel, VS Code integration) and a documented 34-category error taxonomy."
  inputs_supported:
    score: 1
    note: "One input form (Stata code) plus direct dataset access via pystata/console backends; no literature or external-corpus access."
  outputs_reproducibility:
    score: 2
    note: "Persists structured code/log/graph references and publication-ready tables; token-efficient by design (refs over inline content) but no end-to-end paper/data-manifest bundle."
  internal_evaluation:
    score: 2
    note: "Systematic internal test suite across all interfaces plus StatsPAI cross-validation for numeric result-parity auditing between two independently built tools — no external/third-party validation yet."
  openness:
    score: 2
    note: "MIT license (explicitly chosen over AGPL to avoid copyleft transmission), pip-installable; still requires a paid Stata 13+ (17+ preferred) license to actually execute analyses."
  maturity_traction:
    score: 1
    note: "42 stars, 161 commits, v0.12 (July 2026) — active single-maintainer research prototype, pre-1.0."
  cross_family_policy:
    score: 0
    note: "Not applicable — an execution tool invoked by whichever AI assistant (Claude Code, Cursor, etc.) the user configures; no cross-model review of its own."
  assurance_runtime:
    score: 2
    note: "Multiple in-pipeline gates: typed 34-category error handling with suggested fixes, pre-execution command-safety guardrails (blocks shell escapes/file deletion), and StatsPAI cross-validation for result parity."
  cross_platform_portability:
    score: 2
    note: "Four execution surfaces (MCP, Jupyter kernel, VS Code extension, CLI) over one core, usable from Claude Code, Cursor, Claude Desktop, and plain Jupyter/VS Code."
scored_on: "2026-09-01"

limitations:
  - "Requires a paid Stata 13+ installation (17+ preferred for the pystata in-memory backend); not runnable end-to-end on free/commodity software alone."
  - "Single-maintainer, pre-1.0 (v0.12); API and error-taxonomy surface may still shift release to release."
  - "Cross-validation against StatsPAI checks numeric parity between two tools from the same maintainer ecosystem, not against an independent ground truth."

