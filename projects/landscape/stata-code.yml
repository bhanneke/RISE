slug: stata-code
name: "stata-code"
type: external
status: active
url: "https://github.com/brycewang-stanford/stata-code"
maintainers:
  - "Bryce Wang (Stanford REAP / CoPaper.AI)"
year_started: 2026

positioning: >
  An agent-native Python bridge to Stata offering four parallel
  interfaces onto one core — an MCP server (21 tools), a Jupyter
  kernel, a VS Code extension, and a CLI — for running econometric
  analyses (DiD, IV, RDD) and producing publication-ready tables with
  token-efficient, structured output. Sits in the data-analysis /
  code-generation layer of RISE alongside StatsPAI (same maintainer
  ecosystem) and stata-mcp (hanlulong), as a Stata-execution bridge
  rather than a Python-native re-implementation of Stata's estimators.

distinctive_contribution: >
  The only Stata bridge in the catalog offering four simultaneous
  frontends (MCP/Jupyter/VS Code/CLI) over one core, a persistent
  daemon mode for cross-call data retention via Unix socket, 34 typed
  error categories with suggested fixes, command-safety guardrails
  that block shell escapes and destructive file operations, and
  built-in cross-validation against StatsPAI for result-parity
  auditing between the two independent tools.

focus: analysis

pipeline_stages:
  - data-analysis
  - code-generation

architectural_features:
  - tool-use
  - persistent-memory

discipline: economics

