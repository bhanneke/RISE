slug: tongyi-deepresearch
name: "Tongyi DeepResearch"
type: external
status: active
url: "https://github.com/Alibaba-NLP/DeepResearch"
maintainers:
  - "Tongyi Lab, Alibaba"
year_started: 2025

positioning: >
  An agentic large language model purpose-built for long-horizon
  deep-information-seeking tasks (arXiv:2510.24701), shipped both as
  open weights (30.5B total / 3.3B active) and as inference code with
  ReAct and 'Heavy' (IterResearch) modes. Sits in the literature/
  synthesis block of the RISE diagram, with state-of-the-art reported
  results on agentic-search benchmarks (BrowseComp, FRAMES,
  Humanity's Last Exam).

distinctive_contribution: >
  Treats agentic-research capability as a *model-training* problem,
  not just an orchestration problem: continual agentic pre-training,
  fully automated synthetic data generation, and end-to-end on-policy
  RL with GRPO. Distinguishes itself from prompt-engineering pipelines
  by shipping a model purpose-trained for research-style tool use.

focus: literature

pipeline_stages:
  - rq-formulation
  - literature-discovery
  - literature-synthesis

architectural_features:
  - tool-use
  - rag-knowledge-base
  - iterative-loop

discipline: general

inputs:
