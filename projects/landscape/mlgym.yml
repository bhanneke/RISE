slug: mlgym
name: "MLGym (Meta)"
type: external
status: active
url: "https://github.com/facebookresearch/MLGym"
maintainers:
  - "Meta AI / FAIR"
year_started: 2025

positioning: >
  A gym-style framework and benchmark (MLGym-Bench, arXiv:2502.14499)
  for advancing AI research agents on 13 diverse ML research tasks
  (CV, NLP, RL, game theory). Like [`aviary`](aviary.md), MLGym is
  **evaluation infrastructure** for RISE-style systems rather than a
  RISE pipeline itself.

distinctive_contribution: >
  First gym environment specifically for *ML research tasks* — not
  general QA or knowledge work — covering idea generation, data
  processing, method implementation, training, and result analysis
  as a unified RL training surface. Distinct from Aviary in that it
  targets the *training* of research agents via RL, not only their
  evaluation.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - research-design
  - data-analysis
  - code-generation

architectural_features:
  - tool-use
  - artifact-versioning
  - iterative-loop

discipline: computer-science

inputs:
  - task-specification

outputs:
  - agent-trajectories
  - evaluation-metrics
  - training-data

data_sources:
  - benchmark-datasets

knowledge_sources:
  - task-descriptions

