scores:
  lifecycle_coverage:
    score: 1
    note: "Tools cover Stata execution and code work (data-analysis, code-generation) and the skills add rerun-based replication and robustness; referee-response and publication-QA skills organise reruns and table checks but do not draft or review a paper."
  autonomy_level:
    score: 0
    note: "A tool the host agent calls command by command; the server has no planning loop of its own, and the skills are instructions for the calling agent, not an autonomous pipeline."
  architectural_transparency:
    score: 3
    note: "AGPL-3.0 source for the Python server and Rust sorter, all 20 SKILL.md files, MCP config examples, a pytest suite with CI, and a benchmark harness are public in the repo."
  inputs_supported:
    score: 1
    note: "Stata code or .do files plus direct dataset loading (sysuse/webuse/path/URL); no literature corpus or external data-source connector."
  outputs_reproducibility:
    score: 2
    note: "Every run writes a log file and returns structured results and exported graphs, and session history diffs give an audit trail; no bundled manifest ties outputs to data versions for end-to-end regeneration."
  internal_evaluation:
    score: 1
    note: "Unit/integration tests and a speed benchmark (about 0.4 s per test on a 20-test suite) check the software, not the correctness of agent-produced analyses; no output-quality evaluation reported."
  openness:
    score: 1
    note: "Source available under AGPL-3.0, a copyleft rather than permissive licence, and every run requires a paid Stata 17+ licence plus a paid agent client."
  maturity_traction:
    score: 2
    note: "86 stars / 20 forks, 30 tagged releases up to v3.3.0 on PyPI, featured in Stata News; external users but single maintainer, and no push since 2026-05-12."
  cross_family_policy:
    score: 0
    note: "Not applicable: an MCP tool driven by whichever agent the user runs, with no reviewer role of its own."
  assurance_runtime:
    score: 1
    note: "Structured error envelopes (return codes, parsed r(XXX) errors, trace mode), a static .do/.ado linter and server-side safety enforcement on submitted code; nothing checks whether the estimates or claims built on them are right."
  cross_platform_portability:
    score: 3
    note: "Protocol-based stdio server with documented installers or configs for Claude Code, Claude Desktop, Codex, Gemini, Cursor, Windsurf, VS Code and Antigravity, plus Claude and Codex plugin manifests; runs on macOS, Linux and Windows."
scored_on: "2026-09-29"

limitations:
  - "Requires a licensed local Stata 17+ (MP, SE or BE) and uses Stata's proprietary pystata module; unusable without proprietary software."
  - "AGPL-3.0 copyleft: modified versions offered as a network service must publish their source, which restricts embedding in closed tools."
  - "No push since 2026-05-12 (dormant by the three-month rule) after a fast release cadence to v3.3.0; 13 open issues."
  - "The skills organise replication, QA and referee-response work but nothing validates the agent's econometric choices; correctness rests on the user."
  - "Single maintainer (a PhD candidate); the recommended install path pipes a remote script into the shell (curl | bash, irm | iex)."

related:
  - stata-mcp
  - stata-code
  - statspai
  - econ-agent-skills
  - auto-empirical-research-skills

