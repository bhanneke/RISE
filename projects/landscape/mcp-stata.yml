slug: mcp-stata
name: "mcp-stata (Stata agentic toolkit)"
type: external
status: dormant
url: "https://github.com/tmonk/mcp-stata"
license: "AGPL-3.0"
maintainers:
  - "Thomas Monk (London School of Economics)"
year_started: 2025

positioning: >
  A stdio MCP server, distributed on PyPI and run through uvx, that gives
  an AI agent control of a local licensed Stata 17+ installation: run
  commands or .do files (including background jobs), inspect and lint
  data and code, read r()/e()/s() stored results as structured JSON,
  export graphs, and diff session state. It ships with a catalog of 20
  Markdown skills (replication and robustness, data audit, data
  provenance, publication QA, referee response, causal inference, power
  analysis, legacy-code modernization) that tell the agent how to use
  those tools. Sits in the data-analysis / code-generation layer next to
  stata-mcp (hanlulong); the two are independent projects, and the IDE
  front end here is a separate companion repo, Stata Workbench
  (tmonk/stata-workbench, a VS Code extension, also AGPL-3.0).

distinctive_contribution: >
  Where stata-mcp (hanlulong) is an MIT-licensed VS Code extension that
  bundles an HTTP/SSE MCP server, mcp-stata is agent-first: a
  client-agnostic stdio server with one-line installers for Claude Code,
  Codex, Gemini, Cursor, Windsurf and VS Code, structured stored-results
  retrieval intended for programmatic checking of estimates, a
  command-history diff of variables and macros, and a research-workflow
  skill layer (replication, publication QA, referee response) that
  stata-mcp does not have. Its Stata News "Community corner" feature is
  the only vendor-side recognition of a Stata agent bridge in the catalog.

focus: analysis

