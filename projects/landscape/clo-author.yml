slug: clo-author
name: "Clo-Author"
type: external
status: active
url: "https://github.com/hugosantanna/clo-author"
maintainers:
  - "Hugo Sant'Anna (University of Alabama at Birmingham, Economics)"
year_started: 2026

positioning: >
  A Claude Code scaffold for empirical economics research, spanning
  literature review through journal submission. Eighteen agents
  organized as worker-critic pairs (e.g., Strategist + strategist-
  critic, Coder + coder-critic) with thirteen named pipeline commands
  from `/discover` and `/strategize` through `/write`, `/review`,
  `/revise`, `/talk`, and `/submit`. Targets the full inputs →
  knowledge production → outputs arc of the RISE diagram with a
  domain-specific focus on applied economics.

distinctive_contribution: >
  Worker-critic pair architecture as a first-class design principle:
  every creator agent has a paired critic that cannot edit files,
  with 3-round escalation when they disagree. Built-in peer-review
  simulation with intellectual-disposition reviewers (Structuralist,
  Credibility, Measurement, Policy, Theory, Skeptic) weighted by
  journal culture and FATAL / ADDRESSABLE / TASTE classification of
  comments. Direct sibling to [`e2er`](e2er.md) but distributed as
  a forkable Claude Code template rather than a Docker stack.

focus: end-to-end

