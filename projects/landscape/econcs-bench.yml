year_started: 2026

positioning: >
  A benchmark suite of open research challenges in Economics and
  Computation (EconCS), associated with the AI-Driven Research in
  EconCS workshop at EC 2026. 24 open problems — mechanism design,
  fair division (EFX, MMS, PMMS), prophet inequalities, information
  design, complexity of equilibria — each a markdown PROBLEM.md with
  YAML metadata, contributor attribution, known results, and an
  optional difficulty rating (Approachable / Challenging / Hard).
  Sits in the RISE evaluation-infrastructure layer alongside
  AstaBench, Aviary, and MLGym, but targets formal *theory* research
  rather than empirical, coding, or literature tasks.

distinctive_contribution: >
  The first community-curated open-problem benchmark aimed at
  AI-driven theory research: problems are contributed via pull
  requests by many of the field's leading researchers (Nisan,
  Papadimitriou, Procaccia, Conitzer, Feldman, Mirrokni, Weinberg,
  Dobzinski, Chen, Babaioff, Rubinstein, Duetting, Lucier, Branzei,
  Paes Leme), making it both a live registry of what experts consider
  genuinely open and a difficulty-graded target set for proof-capable
  research agents. Success has no harness: a solved benchmark problem
  is a publishable research result.

focus: end-to-end

