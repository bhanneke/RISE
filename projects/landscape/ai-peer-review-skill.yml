scores:
  lifecycle_coverage:
    score: 0
    note: "Single stage: referee simulation on a finished manuscript."
  autonomy_level:
    score: 2
    note: "One invocation yields the whole bundle — the human supplies the paper and optional parameters (num_reviewers 3-8, domain, output_dir) and reads the meta-review, with no intermediate approval."
  architectural_transparency:
    score: 3
    note: "MIT, and the system is essentially prompts plus glue: the reviewer templates and the meta-review prompt ship as files under prompts/, with scripts/ and a SKILL.md documenting the workflow and a comparison table against upstream. Nothing is hidden — there is simply no evaluation harness to publish."
  inputs_supported:
    score: 0
    note: "Four file formats but one input form (a manuscript) plus a domain string, with no literature corpus or data access — a stricter reading of the rubric than the earlier `reviewer` entry, which scored 1 for the same paper-only input."
  outputs_reproducibility:
    score: 2
    note: "Four durable artifacts per paper under papers/<paper-stem>/ including a machine-readable concerns matrix and a JSON bundle; no seeding or model pinning, so two runs on the same PDF give different panels."
  internal_evaluation:
    score: 0
    note: "None reported: no agreement statistics against human referee reports, no comparison against the upstream six-model panel it replaces, and no worked example in the repository."
  openness:
    score: 2
    note: "MIT (for the skill adaptation) and installation is a clone plus a symlink into ~/.claude/skills, but every run needs a paid Claude Code subscription and review quality tracks whichever frontier model is behind it — not free-tier reproducible."
  maturity_traction:
    score: 1
    note: "61 stars and 5 forks on 11 commits, every one pushed on 2026-05-08 with nothing since and no releases; upstream poldrack/ai-peer-review is larger (154 stars, 24 forks) and still being pushed as of 2026-07-05."
  cross_family_policy:
    score: 0
    note: "This is the port's defining trade-off: upstream ran six different proprietary LLMs to buy reviewer diversity, whereas this runs N instances of one Claude model, so disagreement between reviewers reflects sampling and prompt variation within a single family."
  assurance_runtime:
    score: 1
    note: "Single-pass structured review plus a meta-review synthesis; nothing checks a reviewer's assertion back against the manuscript or the literature, and no gate blocks a confabulated concern from reaching the CSV."
  cross_platform_portability:
    score: 0
    note: "Claude Code only — installed by symlink into ~/.claude/skills, and the parallel-reviewer mechanism is Claude Code's own subagent spawning; no other runtime or provider is supported."
scored_on: "2026-09-08"

limitations:
  - "Reviewer diversity is simulated inside one model family. The upstream tool used six different proprietary LLMs on purpose; N Claude subagents share priors and blind spots, so a concern all five miss is a concern the panel structurally cannot surface — and the usefulness ranking is produced by the same family it is ranking."
  - "No evaluation. Nothing compares its reviews to real referee reports or to the upstream panel, so there is no evidence the concerns matrix is calibrated rather than merely tidy."
  - "No literature access: reviewers cannot check a novelty or prior-work claim against anything, so novelty verdicts rest on model memory — the failure mode most likely to mislead an author."
  - "Frozen: 11 commits, all on 2026-05-08. The upstream poldrack/ai-peer-review is still maintained and is the better target for anyone who wants the multi-model panel."
  - "Claude Code and a paid subscription are hard requirements, and cost scales with num_reviewers (3-8) times paper length; domain adaptation is a prompt parameter, so field-specific standards (identification, institutional detail) are only as good as the model's priors."

