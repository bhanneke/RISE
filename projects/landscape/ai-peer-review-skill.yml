year_started: 2026

positioning: >
  A single-purpose Claude Code skill sitting squarely in the
  referee-simulation stage: hand it a manuscript (PDF, DOCX, TXT or
  MD) and it extracts the text, spawns N parallel Claude subagents
  (default 5, named with NATO codenames alfa through echo) that each
  return an independent structured review — summary, major concerns,
  minor concerns, verdict — with one slot optionally given to an
  AI-Alignment-Forum-style critic red-teaming narrative, novelty,
  baselines, ablations and reproducibility, then synthesises a
  meta-review separating shared from unique concerns and issuing a
  final verdict. It is an explicit adaptation of Russ Poldrack's
  poldrack/ai-peer-review (MIT, 154 stars, still maintained), whose
  six proprietary LLMs it replaces with parallel Claude subagents and
  whose hardcoded neuroscience domain it turns into a parameter —
  trading cross-model diversity for needing no API keys beyond Claude
  Code.

distinctive_contribution: >
  The output shape rather than the review itself. Alongside the
  per-reviewer markdown and meta_review.md it writes
  concerns_table.csv — a boolean concerns × reviewers matrix — plus
  results.json, and it ranks the reviewers by usefulness, so a
  simulated referee panel becomes something an author can sort and
  triage instead of read end to end. Among the catalog's review tools
  it is the cheapest thing that produces a machine-readable
  disagreement map across reviewers.

