year_started: 2026

positioning: >
  An open-source research harness for autonomous ML research
  (arXiv:2605.03042) built around *cross-model adversarial
  collaboration*: an executor model drives forward progress while a
  reviewer from a different model family critiques intermediate
  artifacts and requests revisions. Ships as 74+ Markdown-only
  `SKILL.md` files plus an optional standalone CLI (ARIS-Code), with
  the explicit design stance that the harness is a *methodology*,
  not a platform, portable across Claude Code, Codex CLI, Cursor,
  Trae, Antigravity, Copilot CLI, OpenClaw, Windsurf, and custom
  agents.

distinctive_contribution: >
  Treats *long-running plausible-unsupported-success* as the central
  failure mode of autonomous research and addresses it by mandating
  cross-model review as the default (executor and reviewer from
  different model families, e.g., Claude Code + Codex MCP at GPT-5.4
  xhigh, or MiniMax-M2.7 + GLM-5). Three-stage evidence verification,
  five-pass scientific editing pipeline, mathematical-proof checks,
  visual PDF inspection, and a persistent *Research Wiki* (papers /
  ideas / experiments / claims + relationship graph). Notably most-
  starred (9.8k+) Claude-Code-native research harness in the catalog.

