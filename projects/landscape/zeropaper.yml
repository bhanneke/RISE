slug: zeropaper
name: "zeropaper"
type: external
status: active
url: "https://github.com/alejandroll10/zeropaper"
maintainers:
  - "Alejandro Aldea"
year_started: 2025

positioning: >
  An autonomous paper-writing pipeline that takes a research topic and
  produces a written paper with minimal user input. Sits firmly in the
  paper-drafting / revision portion of the RISE pipeline with light
  upstream ideation.

distinctive_contribution: >
  Lightweight, accessible single-developer implementation of the
  autonomous-paper-writing idea, with a focus on minimizing per-paper
  human input rather than on multi-agent sophistication.

focus: drafting

pipeline_stages:
  - hypothesis-generation
  - literature-discovery
  - paper-drafting
  - revision-editing

architectural_features:
  - single-llm
  - tool-use
  - iterative-loop

discipline: general

inputs:
  - research-topic

outputs:
  - paper-draft

data_sources: []

knowledge_sources:
  - web-search

