    note: "Community/paper-seed inputs; configurable agent skill sets."
  outputs_reproducibility:
    score: 2
    note: "PyPI-installable; trajectories persisted; LLM nondeterminism limits exact reproduction."
  internal_evaluation:
    score: 2
    note: "ICML paper presents systematic evaluation of community-level metrics."
  openness:
    score: 3
    note: "Apache-2.0; pip-installable; active community channels."
  maturity_traction:
    score: 0
    note: "211 stars and ICML 2025 acceptance, but no human-authored commit since 2025-07-10 (14+ months); 15 open Dependabot dependency-bump PRs sit unmerged, several auto-flagged Stale since Jul 2026 — effectively unmaintained despite the published-paper pedigree."
  cross_family_policy:
