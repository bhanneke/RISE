positioning: >
  A single portable skill package (`research-paper-writing/`) for
  ML/CV/NLP paper writing: a SKILL.md core workflow plus eight
  section-specific reference guides (abstract, introduction, related
  work, method, experiments, conclusion, paper review, paragraph
  flow) and an example bank, curated and adapted from Prof. Peng
  Sida's (Zhejiang University) widely used open research-writing
  notes. Installs by directory copy into Codex, Claude Code, or
  Gemini CLI. Sits in the skills/knowledge-asset layer alongside
  Academic Research Skills, but is content-first: distilled human
  writing pedagogy packaged as agent-consumable markdown rather than
  an engineered agent pipeline.

distinctive_contribution: >
  Packages a respected researcher's writing methodology — reverse
  outlining, one-message-per-paragraph, claim-evidence alignment as
  a hard constraint, adversarial self-review from a reviewer mindset
  — into a runtime-portable skill with explicit provenance (MIT,
  with attribution to Peng's notes and repository). 5.4k stars in
  under four months is the clearest demonstration in the catalog
  that expert-curated writing knowledge, not orchestration
  machinery, is itself a distributable artifact.

