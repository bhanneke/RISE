slug: zochi
name: "Zochi (Intology)"
type: external
status: active
url: "https://github.com/IntologyAI/Zochi"
maintainers:
  - "Andy Zhou and Intology team"
year_started: 2025

positioning: >
  An end-to-end "artificial scientist" system from Intology, claimed
  to span hypothesis generation through to peer-reviewed publication.
  Differentiates itself from earlier AI-scientist releases by
  publishing the *outputs* — accepted ACL 2025 and ICLR 2025 workshop
  papers (CS-ReFT, Tempest/Siege) with reported state-of-the-art
  results — rather than only the pipeline.

distinctive_contribution: >
  The strongest *external-validation* claim in the AI-scientist
  landscape: peer-reviewed acceptances of papers produced by the
  system, including ACL 2025 main proceedings. The repository
  releases code and a technical report covering an earlier version
  of the system.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - research-design
  - data-analysis
  - code-generation
  - paper-drafting
  - revision-editing
  - referee-simulation

