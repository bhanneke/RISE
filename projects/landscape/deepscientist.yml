scores:
  lifecycle_coverage:
    score: 2
    note: "Seven stages — baseline reproduction, hypothesis generation from prior results, experiment loops, ablations, analysis and figures, paper drafting, LaTeX/PDF compilation — with real gaps: no literature-discovery or literature-synthesis stage, and no referee-simulation stage inside the pipeline."
  autonomy_level:
    score: 3
    note: "Designed for unattended long-horizon runs — the paper's headline campaign ran roughly a month on 16 H800 GPUs generating ~5,000 ideas — with human takeover offered as an option, not a required gate."
  architectural_transparency:
    score: 2
    note: "Apache-2.0 with 341 commits and an ICLR 2026 paper describing the Bayesian-optimisation loop, findings memory and quest structure; but the shipped repo is the npm-distributed TypeScript studio and I could not confirm from the repo page that per-agent prompts are published as inspectable files, nor is an evaluation harness included."
  inputs_supported:
    score: 2
    note: "Three input forms (a research objective, a paper, or an existing code repository) plus the user's own local code and data as the working substrate; no external literature-corpus connector or dataset catalogue is documented."
  outputs_reproducibility:
    score: 2
    note: "Every quest is a Git repository holding code, experiment branches, figures, report and LaTeX/PDF in-tree, with failed routes retained — strong artifact versioning — but no run manifest, seed policy or replication script is published, so end-to-end reproducibility from declared inputs is not demonstrated."
  internal_evaluation:
    score: 3
    note: "Peer-reviewed: published as a conference paper at ICLR 2026 (arXiv 2509.26603), reporting measured gains over human SOTA on three AI tasks with the full idea → validation → finding funnel, plus automated-reviewer scoring of the generated manuscripts."
  openness:
    score: 2
    note: "Apache-2.0 and installable in one line (`npm install -g @researai/deepscientist`), but the demonstrated results required 16 H800 GPUs and ~20,000 GPU hours plus a paid agent runner, so nothing shown is reproducible on commodity hardware."
  maturity_traction:
    score: 2
    note: "3,317 stars, 330 forks, 341 commits, tagged releases through v1.6.0 and an npm distribution — beta with real external users — but single-lab origin and last pushed 2026-06-28, so momentum has slowed."
  cross_family_policy:
    score: 1
    note: "Four interchangeable runners (Codex, Claude Code, Kimi Code, OpenCode) plus Ollama/Gemini backends make cross-family setups easy to configure, but nothing requires or defaults to an executor and a reviewer drawn from different model families."
  assurance_runtime:
    score: 1
    note: "The in-flight check is empirical rather than editorial — each hypothesis must survive a real experiment against a reproduced baseline, and failed branches are kept rather than hidden — but no claim-faithfulness, citation-grounding, math-verification or figure-audit gate is documented."
  cross_platform_portability:
    score: 2
    note: "Top of the band: four built-in agent runners plus local backends (Ollama, Gemini) via wrappers, and local-first execution on macOS/Linux — but native Windows is experimental (WSL2 recommended) and it is one studio runtime, not a library embeddable elsewhere."
scored_on: '2026-09-08'

limitations:
  - "Domain is ML/AI research — the reported targets are AI tasks (accuracy, tokens/second, AUROC) — with no evidence in economics, finance or the social sciences; the identification-and-robustness half of empirical social science has no analogue here."
  - "The discovery funnel is brutally thin: ~5,000 ideas → 1,100 validated → 21 findings (≈0.4%), at ~20,000 GPU hours on 16 H800s, so the cost per usable result is very high."
  - "Manuscript quality was assessed by an automated AI reviewer (reported as on par with average ICLR 2025 submissions, ~60% simulated acceptance), not by human referees."
  - "Last pushed 2026-06-28 — active by the three-month rule, but slowing; native Windows support is experimental."
  - "Requires a paid agent runner (Codex/Claude Code/Kimi/OpenCode) and serious GPU compute; the local-first design deliberately rules out cloud handoff of unpublished ideas."
  - "I could not open the OpenReview forum page directly (browser verification) — the ICLR 2026 acceptance is confirmed via the search-indexed OpenReview PDF header and the repo README's OpenReview link, not by fetching the page myself."

