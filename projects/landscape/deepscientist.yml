slug: deepscientist
name: "DeepScientist"
type: external
status: active
url: "https://github.com/ResearAI/DeepScientist"
maintainers:
  - "Yixuan Weng"
  - "Minjun Zhu"
  - "Yue Zhang"
  - "ResearAI"
year_started: 2025

positioning: >
  A local-first autonomous research studio for ML/AI work: you hand it a
  paper, a repository, or a bare research objective, and it reproduces a
  baseline, then runs long-horizon hypothesise → verify → analyse cycles
  under Bayesian optimisation, accumulating findings across sessions and
  ending in figures, reports and a LaTeX/PDF draft. Unlike the run-once
  pipelines elsewhere in the RISE end-to-end layer (aris,
  agent-laboratory, luxas), state is the architecture: one Git
  repository per research quest, branches expressing competing research
  routes, failed branches retained rather than discarded, and a
  "Findings Memory" that survives between runs.

distinctive_contribution: >
  The only catalogued end-to-end system whose persistence layer is
  ordinary version control — quest-as-Git-repo with per-route branches
  and preserved failures — combined with the field's most honest
  published funnel: an ICLR 2026 paper reporting roughly 5,000
  autonomously generated ideas, 1,100 taken to experimental validation
  and 21 that became scientific findings, over ~20,000 GPU hours, with
  gains of 183.7% (accuracy), 1.9% (tokens/second) and 7.9% (AUROC)
  over human-designed state of the art on three AI tasks. It is also
  runner-agnostic (Codex, Claude Code, Kimi Code, OpenCode) and supports
  human takeover at any point, which fits a human-approval-by-default
  workflow better than the unattended systems it competes with.

focus: end-to-end

