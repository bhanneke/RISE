slug: marg
name: "MARG (Multi-Agent Review Generation)"
type: external
status: active
url: "https://github.com/allenai/marg-reviewer"
maintainers:
  - "Allen Institute for AI"
year_started: 2024

positioning: >
  A research artifact (arXiv:2401.04259) and reusable demo for
  generating peer reviews of scientific papers using multiple
  specialized agents. Ships with a web interface and reproduction
  scripts for the published user study comparing MARG-S to single-LLM
  baselines (SARG-B, LiZCa). Sits at the referee-simulation stage of
  the RISE pipeline.

distinctive_contribution: >
  Among the earliest peer-reviewed treatments of agentic peer review,
  with an explicit user study comparing review quality across multiple
  generation strategies. The repository functions as both a runnable
  demo and a reproducibility package for the paper.

focus: review

pipeline_stages:
  - referee-simulation

architectural_features:
  - multi-agent
  - tool-use

discipline: general

inputs:
  - submitted-paper

outputs:
  - generated-review
  - alignment-metrics

data_sources:
