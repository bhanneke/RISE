year_started: 2026

positioning: >
  A portable agent skill (`skills/econ-write/`) that packages economics
  paper-writing craft — section formulas, identification-strategy-aware
  phrasing, LaTeX conventions, and a pre-submission checklist — distilled
  from 50+ guides by named economists (Cochrane, McCloskey, Shapiro,
  Head, Bellemare, Goldin, Kremer). Sits in the RISE drafting/revision
  layer alongside `research-paper-writing-skills` (the CS/ML analogue)
  and `academic-writing-agents`, but is economics-discipline-specific
  and content-first: curated human writing pedagogy packaged as
  agent-consumable markdown rather than an engineered pipeline.

distinctive_contribution: >
  The only writing-skill pack in the catalog tuned specifically to
  empirical-economics conventions: section formulas keyed to 13+
  identification strategies (RCT, DiD, IV, RDD, ...), dedicated
  templates for job-market papers, dissertations, and grant proposals,
  and a quantified pre-submission gate (24-item checklist, 100-point
  scoring rubric) rather than generic "write more clearly" guidance.

focus: drafting

pipeline_stages:
  - paper-drafting
  - revision-editing
  - referee-simulation
  - dissemination

architectural_features:
  - single-llm

discipline: economics

