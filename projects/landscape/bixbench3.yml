scores:
  lifecycle_coverage:
    score: 0
    note: "Evaluation infrastructure: it grades delegated analysis work and deliberately excludes question formulation, method choice and write-up, producing no scholarship of its own."
  autonomy_level:
    score: 0
    note: "Static task manifests plus graders; the harness has no agency, although the agents it measures run unattended for 6.8 hours on average per task."
  architectural_transparency:
    score: 3
    note: "The repo publishes the CLI, GCP runner, task manifests, response schemas, the deterministic grader and metrics, and the full 12 KB `judge_prompt.md` with its eight per-artifact rubrics and ten failure-mode tags — code, prompts and configs all visible."
  inputs_supported:
    score: 1
    note: "One input form per task (a prompt plus an exact artifact output contract) with raw study data staged from GCS; no literature-corpus access for the agent and no alternative scaffolds beyond the shipped Inspect harness."
  outputs_reproducibility:
    score: 2
    note: "Data is pinned to versioned release prefixes (gs://bixbench3-inputs/releases/v1.0.0/) and artifact grading is deterministic, but each run costs ~$43 and needs a GCP VM plus licensed 10x software, and the process-judge score is LLM-generated."
  internal_evaluation:
    score: 2
    note: "Systematic evaluation of 13 frontier models over 20 tasks and 138 artifacts with cost and step-count breakdowns in the companion preprint (arXiv:2608.25286, v1 2026-08-26); no peer review and no third-party replication yet."
  openness:
    score: 1
    note: "CC BY-SA 4.0 covers Edison-authored code and materials — a share-alike content licence rather than an OSI-permissive software one — mirrored scientific data keeps upstream terms, and the runtime additionally requires separately licensed 10x Cell Ranger binaries the repo will not redistribute."
  maturity_traction:
    score: 1
    note: "6 stars, 0 forks, a single commit dated 2026-08-22, no leaderboard, and no external users evident 2.5 weeks after release — a fresh single-team code drop alongside the preprint."
  cross_family_policy:
    score: 1
    note: "The process judge and network adjudicator are pinned to openai/gpt-5.5 while the agent under test can be any provider, so cross-family grading happens by default for non-OpenAI agents but is a fixed judge choice rather than a policy, and collapses to same-family when grading OpenAI models."
  assurance_runtime:
    score: 2
    note: "Two in-pipeline mechanisms: an LLM-adjudicated network gateway that polices the agent's outbound requests live (broker policy plus adjudication logs), and artifact contracts validated at submission before deterministic grading and process judging."
  cross_platform_portability:
    score: 1
    note: "Model side spans OpenAI, Google and Anthropic via `reference_models.yaml` and the UK-AISI Inspect harness, but the runner assumes GCP n2-standard-32 VMs in us-central1-a with GCS buckets and proprietary Cell Ranger images — not portable off Google Cloud."
scored_on: "2026-09-08"

limitations:
  - "GitHub holds only the harness and grader: prompts and contracts live on HuggingFace and both the raw inputs and ground-truth artifacts sit in Google Cloud Storage buckets, so the benchmark is not self-contained."
  - "Running it requires a GCP project, ~$43 of model spend and ~6.8 hours per task on average (up to $525 and 24 hours), plus manually accepting 10x Genomics' EULA to obtain Cell Ranger — far outside commodity-hardware reproducibility."
  - "One commit, 6 stars, 0 forks and no leaderboard; there is no submission process, so cross-lab comparability depends on the authors' own reported table."
  - "The process judge is pinned to a single OpenAI model at a fixed effort setting; a judge API or parsing failure is merely recorded, and the judge's own accuracy is not validated against human raters in the repo."
  - "Deliberately scoped to delegated implementation in computational biology — no question formulation, identification, literature or write-up dimension, and nothing transferable to social-science data without new tasks."
  - "The predecessor BixBench (arXiv:2503.00096) is not catalogued in RISE, so the lineage's earlier scores are not directly comparable here."

