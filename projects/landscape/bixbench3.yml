slug: bixbench3
name: "BixBench3"
type: external
status: active
url: "https://github.com/EdisonScientific/BixBench3"
maintainers:
  - "Edison Scientific"
  - "Zane Koch"
  - "Jon M. Laurent"
  - "Samuel G. Rodriques"
  - "Andrew D. White"
year_started: 2026

positioning: >
  Twenty computational-biology tasks at the scale of a whole research
  study, framed explicitly as *delegation* rather than autonomy: the
  scientist keeps the research question and the high-level method
  choice, and the agent implements every analysis step from the raw
  data of a published study up to a set of exactly specified output
  artifacts (138 artifacts across the 20 tasks). Grading is two-part —
  a deterministic grader comparing the agent's artifacts against the
  published ground truth with per-artifact metrics (F1, CCC, …), plus a
  PhDval-compatible LLM process judge scoring instruction following,
  transparency, analytical rigour and run-level failure modes. It is
  the third generation of the Future-House BixBench line (BixBench,
  Mitchener et al., arXiv:2503.00096 — 53 scenarios and ~300
  open-answer questions, not itself catalogued in RISE) rebuilt by the
  same core team now at Edison Scientific, and it sits in the RISE
  evaluation-infrastructure layer next to LifeSciBench and HeurekaBench.

distinctive_contribution: >
  Honest resource accounting is the contribution the rest of the
  benchmark field omits: the paper reports an average of 6.8 hours,
  102M tokens and $43 per task, with the longest attempts reaching 24
  hours, 1.07B tokens and $525 — so the autonomy gap (scores from 0.00
  to 0.48 across 13 frontier models, degrading from 0.36 on 1–2-step
  analyses to 0.24 on 3+ steps) is priced, not just measured. It also
  runs an LLM-adjudicated network gateway around the agent during the
  run, logging and policing outbound requests so a task cannot be
  solved by retrieving the published paper's own answers.

