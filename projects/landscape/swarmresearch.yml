year_started: 2026

positioning: >
  An orchestrator-subagent harness for open-ended discovery, from a
  four-author group at UIUC. A Shepherd Agent holds the global
  picture and spawns waves of Search Agents by launching
  non-interactive Codex or Claude Code sessions: Explorers start from
  a fresh context and attack a new approach, Optimizers fork a
  parent's conversation history and refine an existing solution, and
  the Shepherd steers the population through three levers — parent
  selection, agent type and prompt. Every major edit lands on its own
  git branch. Sits beside AlphaEvolve and CORAL in the
  discovery-not-drafting corner of the landscape: it produces
  algorithms and solutions, not manuscripts.

distinctive_contribution: >
  It ships as agent skills, not as a framework — three Markdown skills
  (swarmresearch, swarmresearch-explorer, swarmresearch-optimizer) in
  `.claude/skills` and `.codex/skills`, with the README noting that
  other coding agents are supported by changing the spawn commands, so
  the prompts *are* the implementation. The architectural claim is
  about breadth over depth: a single long-running agent converges on
  one high-level approach and then grinds on low-level edits, whereas
  branch-isolated waves keep competing approaches alive and scale
  parallelism adaptively with search depth. Reported to match or beat
  SOTA LLM-guided evolution and multi-agent baselines on 13 of 15
  tasks at a $50-per-task budget.

focus: end-to-end

