slug: researchagent
name: "ResearchAgent (NAACL 2025)"
type: external
status: dormant
url: "https://github.com/JinheonBaek/ResearchAgent"
maintainers:
  - "Jinheon Baek, Sujay Kumar Jauhar, Silviu Cucerzan, Sung Ju Hwang"
year_started: 2025

positioning: >
  The NAACL 2025 reference implementation (arXiv:2404.07738) of
  *iterative research idea generation over scientific literature*.
  Starting from a core paper, the system retrieves related work and
  entities, proposes a research problem, and refines it via parallel
  multi-criteria reviews from LLM reviewer agents.

distinctive_contribution: >
  Among the earliest peer-reviewed treatments of agentic ideation
  *grounded in literature*, with an explicit multi-reviewer feedback
  loop and a paper+entity knowledge store. Useful as a methodological
  reference for the catalog's ideation-focused projects rather than
  as a turnkey product.

focus: ideation

pipeline_stages:
  - literature-discovery
  - rq-formulation
  - hypothesis-generation
  - research-design

architectural_features:
  - multi-agent
  - tool-use
  - rag-knowledge-base
  - iterative-loop

discipline: general

inputs:
  - seed-paper-ids
  - knowledge-store

outputs:
  - research-problem
  - method-proposal
  - experiment-design
  - review-scores

data_sources:
  - semantic-scholar

knowledge_sources:
  - semantic-scholar
  - extracted-entities

