year_started: 2026

positioning: >
  A seven-stage controlled-execution framework (setup -> audit -> clean
  -> plan -> work -> review -> release) that constrains Claude Code to
  produce auditable, reproducible empirical research rather than
  general-purpose "vibe coding." Raw data is read-only, every cleaning
  and merge decision must leave a script and a log, every analysis
  task needs a script/log/output triple before it can be marked
  complete, and causal claims are checked against the declared
  identification strategy before a replication package is released.
  A separate standalone mode extracts paper-matched, analysis-ready
  subsamples and codebooks from raw multi-wave survey panels, for
  reproducing a published paper's sample construction before
  extending or re-estimating it.

distinctive_contribution: >
  Targets the data-cleaning/merging stage as the primary locus of
  silent failure (undocumented edits, broken merge keys reported as
  "done," causal language outrunning the identification design) rather
  than treating drafting or ideation as the hard part. The
  paper-subsample mode is concrete and checkable: a three-script
  pipeline (discover_vars -> subsample -> codebook) produces a
  codebook that flags each reconstructed variable CLOSE / MODERATE /
  DIFFERS against the published paper's own descriptive-statistics
  table, with required notes on any DIFFERS entry before it counts as
  ready.

