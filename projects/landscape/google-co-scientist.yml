scores:
  lifecycle_coverage:
    score: 1
    note: "Four tightly clustered upstream stages culminating in ranked hypotheses and proposed experiments; no execution, analysis, or drafting."
  autonomy_level:
    score: 3
    note: "Supervisor agent autonomously orchestrates the generate-debate-evolve tournament loop; scientist supplies the goal and reviews the ranked hypotheses."
  architectural_transparency:
    score: 1
    note: "Nature paper and the 2025 arXiv preprint document the agent roles and Elo-tournament design, but no code, prompts, or configs are released."
  inputs_supported:
    score: 2
    note: "Natural-language research goal plus access to literature and specialized databases (ChEMBL, UniProt) and tools such as AlphaFold."
  outputs_reproducibility:
    score: 1
    note: "Persists prose hypotheses and cited research overviews; closed and hosted, with no reproducible artifact package."
  internal_evaluation:
    score: 3
    note: "Peer-reviewed in Nature (10.1038/s41586-026-10644-y) with experimental wet-lab validation of AI-proposed leads and sustained multi-institution adoption."
  openness:
    score: 1
    note: "No source or prompts released; a heavily gated trusted-tester tool (Hypothesis Generation in Gemini for Science) is the only access path."
  maturity_traction:
    score: 3
    note: "Peer-reviewed, Google-backed, and in active real-world use across 100+ institutions with reported drug-discovery outcomes."
  cross_family_policy:
    score: 0
    note: "Single model family — all agents run on Gemini."
  assurance_runtime:
    score: 2
    note: "Reflection (peer-review) agent, Elo ranking tournament, and Meta-review provide multiple in-pipeline debate gates, with citations grounding outputs."
  cross_platform_portability:
    score: 0
    note: "Closed, hosted on Google infrastructure and locked to Gemini; not deployable on other stacks."
scored_on: "2026-07-23"

limitations:
  - "Closed source with trusted-tester-only access; the architecture is known from the papers but neither code nor prompts are published, so results are not independently reproducible."
  - "Covers ideation only — proposes hypotheses and experiments but does not execute them; all wet-lab validation and downstream work is performed by human teams."
  - "Runs entirely within the Gemini family, so it lacks cross-model-family review and is subject to that family's blind spots and single-vendor lock-in."

