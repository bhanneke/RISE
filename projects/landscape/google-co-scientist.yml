scores:
  lifecycle_coverage:
    score: 2
    note: "Six stages: the original four upstream stages plus data-analysis and code-generation, now demonstrated in a 2026-08-28 follow-up preprint's closed-loop materials-science, biology and CS case studies; still no paper-drafting or referee-simulation stage, and the demonstrated execution capability is case-study-specific rather than the documented default product."
  autonomy_level:
    score: 3
    note: "Supervisor agent autonomously orchestrates the generate-debate-evolve tournament loop; scientist supplies the goal and reviews the ranked hypotheses."
  architectural_transparency:
    score: 1
    note: "Nature paper and the 2025 arXiv preprint document the agent roles and Elo-tournament design, but no code, prompts, or configs are released."
  inputs_supported:
    score: 2
    note: "Natural-language research goal plus access to literature and specialized databases (ChEMBL, UniProt) and tools such as AlphaFold."
  outputs_reproducibility:
    score: 1
    note: "Persists prose hypotheses and cited research overviews; closed and hosted, with no reproducible artifact package."
  internal_evaluation:
    score: 3
    note: "Peer-reviewed in Nature (10.1038/s41586-026-10644-y) with experimental wet-lab validation of AI-proposed leads and sustained multi-institution adoption; reinforced by a 2026-08-28 arXiv follow-up (2608.26701) reporting closed-loop execution results across materials science, biology and CS, including single-attempt monolayer-semiconductor synthesis and outperforming six frontier models on HealthBench."
  openness:
    score: 1
    note: "No source or prompts released; a heavily gated trusted-tester tool (Hypothesis Generation in Gemini for Science) is the only access path."
  maturity_traction:
    score: 3
    note: "Peer-reviewed, Google-backed, and in active real-world use across 100+ institutions with reported drug-discovery outcomes; as of 2026-08-28 enterprise previews are also named at Daiichi Sankyo, Bayer Crop Science and US National Laboratories, with closed-loop materials/biology/CS case studies published."
  cross_family_policy:
    score: 0
    note: "Single model family — all agents run on Gemini."
  assurance_runtime:
    score: 3
    note: "Reflection (peer-review) agent, Elo ranking tournament, and Meta-review provide multiple in-pipeline debate gates; the 2026-08-28 follow-up preprint adds real execution feedback as a runtime check (synthesis outcomes, lab measurements, benchmark scores feeding back into the loop), reporting a drop in severe methodological errors from 100% in baseline models to 24% — a heavier audit stack than debate-only gating."
  cross_platform_portability:
    score: 0
    note: "Closed, hosted on Google infrastructure and locked to Gemini; not deployable on other stacks."
scored_on: "2026-10-01"

limitations:
  - "Closed source with trusted-tester-only access; the architecture is known from the papers but neither code nor prompts are published, so results are not independently reproducible."
  - "Execution-grounded closed-loop capability (materials/biology/CS) is demonstrated in named case studies in the 2026-08-28 preprint, not confirmed as the generally available default product; most deployments remain hypothesis-and-proposal generation with human teams executing downstream work."
  - "Runs entirely within the Gemini family, so it lacks cross-model-family review and is subject to that family's blind spots and single-vendor lock-in."

