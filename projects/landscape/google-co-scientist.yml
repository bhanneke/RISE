slug: google-co-scientist
name: "AI Co-Scientist (Google DeepMind)"
type: external
status: active
url: "https://deepmind.google/blog/co-scientist-a-multi-agent-ai-partner-to-accelerate-research/"
maintainers:
  - "Google DeepMind"
  - "Google Research"
year_started: 2025

positioning: >
  Google's closed multi-agent research partner (announced Feb 2025,
  published in Nature 2026-05-19) that generates, debates, and evolves
  novel research hypotheses. Built on Gemini, it orchestrates six
  specialized agents — Generation, Reflection, Ranking, Proximity,
  Evolution, Meta-review — under a Supervisor, using Elo-based
  tournaments and simulated scientific debate to surface and refine
  ideas. Originally an upstream *ideation*-only system, a follow-up
  preprint (arXiv:2608.26701, 2026-08-28) documents an
  execution-grounded configuration that closes the loop in specific
  case studies: interfacing with a real chemical-vapor-deposition
  reactor and Gemini 3 Deep Think to design and run materials-science
  syntheses, building a data-analysis pipeline for biology imaging
  data, and autonomously producing a working inference-time-scaling
  architecture in computer science — i.e. beyond pure ideation into
  research-design, data-analysis and code-generation in these
  demonstrated cases, though the publicly described default product
  remains hypothesis/proposal generation.

distinctive_contribution: >
  The most externally validated hypothesis-generation system on the
  landscape: peer-reviewed in Nature, with wet-lab confirmation of
  AI-proposed leads in AML drug repurposing, liver-fibrosis reversal,
  and antimicrobial-resistance gene transfer, and active use by
  infectious-disease, aging, and ALS research teams across 100+
  institutions. A 2026-08-28 follow-up preprint extends this with
  closed-loop, execution-grounded validation across three disciplines:
  single-attempt synthesis of monolayer MoS2/MoSe2/WS2 semiconductors
  and a novel MXene precursor route in materials science, a biology
  prediction pipeline matching unpublished wet-lab measurements, and a
  CS architecture that outperformed six frontier models on HealthBench
  — plus enterprise previews reported at Daiichi Sankyo, Bayer Crop
  Science and US National Laboratories. RISE separately catalogs the
  open-source reimplementation open-coscientist; this entry is the
  closed, first-party system whose design that project
  reverse-engineers.

