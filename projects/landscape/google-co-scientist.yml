slug: google-co-scientist
name: "AI Co-Scientist (Google DeepMind)"
type: external
status: active
url: "https://deepmind.google/blog/co-scientist-a-multi-agent-ai-partner-to-accelerate-research/"
maintainers:
  - "Google DeepMind"
  - "Google Research"
year_started: 2025

positioning: >
  Google's closed multi-agent research partner (announced Feb 2025,
  published in Nature 2026-05-19) that generates, debates, and evolves
  novel research hypotheses. Built on Gemini, it orchestrates six
  specialized agents — Generation, Reflection, Ranking, Proximity,
  Evolution, Meta-review — under a Supervisor, using Elo-based
  tournaments and simulated scientific debate to surface and refine
  ideas. It sits in the upstream *ideation* layer: it proposes
  hypotheses and experiments but does not run experiments, analyze
  data, or draft papers.

distinctive_contribution: >
  The most externally validated hypothesis-generation system on the
  landscape: peer-reviewed in Nature, with wet-lab confirmation of
  AI-proposed leads in AML drug repurposing, liver-fibrosis reversal,
  and antimicrobial-resistance gene transfer, and active use by
  infectious-disease, aging, and ALS research teams across 100+
  institutions. RISE separately catalogs the open-source
  reimplementation open-coscientist; this entry is the closed,
  first-party system whose design that project reverse-engineers.

focus: ideation

pipeline_stages:
  - literature-discovery
  - literature-synthesis
  - hypothesis-generation
  - research-design

architectural_features:
  - multi-agent
  - tool-use
  - rag-knowledge-base
  - iterative-loop
  - debate-consensus

discipline: general

inputs:
