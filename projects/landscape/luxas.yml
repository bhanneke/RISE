year_started: 2026

positioning: >
  An unattended question-to-manuscript harness: a Claude Opus "brain"
  agent coordinates 13 specialised sub-agent kinds (search, reader,
  worker, experiment, tool_impl, tool_review, experiment_reviewer, math,
  illustrator, illustrator_write, typesetter, reviewer, fixer) through
  literature discovery over OpenAlex/arXiv/CrossRef, experiment design,
  parallel implementation and testing, figure generation, LaTeX writing
  and a three-layer adversarial review, ending in a compiled PDF. The
  entire pipeline runs from a one-line topic in RESEARCH.md with no
  human gate — it sits at the far-autonomy end of the RISE end-to-end
  layer, next to aris, agon and autoresearchclaw.

distinctive_contribution: >
  Two structural anti-self-deception mechanisms rather than prompt
  instructions: implementation and testing are written by separate
  blind agents (tool_impl works from specifications only, tool_review
  writes test suites without seeing the implementation), and the
  finalize loop cannot be bypassed by prompting — a figure-internal
  audit (palette, spines, typography, clipping) and a document-level
  layout audit via PDF rasterisation gate completion, with a
  `\resultref` mechanism tying every claimed number to a computed
  result. It is also the most actively developed system in this lane
  (382 commits, 981 stars, pushed 2026-09-06) and publishes nine
  complete example runs as inspectable PDFs.

