scores:
  lifecycle_coverage:
    score: 3
    note: "Twelve declared stages from topic decomposition through literature survey, experiment design/implementation, symbolic derivation, figure generation and LaTeX drafting to adversarial review and a compiled PDF — end-to-end including both drafting and a validation stage."
  autonomy_level:
    score: 3
    note: "One-line topic in RESEARCH.md plus `luxas run` produces a compiled manuscript over multiple hours with no approval points; the README's own framing is 'while you sleep'."
  architectural_transparency:
    score: 3
    note: "MIT with the full TypeScript harness in src/ (382 commits), the 14-role agent roster documented in the README, plus skills/, schemas/, patches/ and four benchmark task specs; no separate prompts/ directory (agent prompts live inline in src) and no scoring harness for the benchmark tasks."
  inputs_supported:
    score: 1
    note: "A single input form — one free-text topic — combined with literature access via OpenAlex, arXiv, CrossRef and citation chains; no dataset input, no private-corpus connector, and experimental data is generated by the agent rather than supplied."
  outputs_reproducibility:
    score: 2
    note: "Persists LaTeX source, compiled PDF, figures, generated Python, and a full log.jsonl replay trail with `\\resultref` number provenance; but runs are stochastic and no manifest or seed makes a given manuscript reproducible from its inputs."
  internal_evaluation:
    score: 1
    note: "Nine gallery runs and four benchmark task directories (bench-01-u233-gamow, bench-02-rb-blockade-leakage, bench-03-ftqc-ccz-conflict, bench-04-prior-art-positioning) to inspect, but no paper, no scoring harness, no reported metrics and no third-party evaluation."
  openness:
    score: 2
    note: "MIT-licensed with a documented install path (Node 22+, LaTeX, poppler, tmux), but a run costs $20–80 on the default full-Claude profile ($2–10 on --profile dual), so the demonstrated examples are not reproducible on free infrastructure."
  maturity_traction:
    score: 2
    note: "981 stars, 18 forks, 382 commits and pushed 2026-09-06 — the most active project in this lane — but single-maintainer, version 0.1.0 in CITATION.cff, and no tagged GitHub releases."
  cross_family_policy:
    score: 1
    note: "Cross-family is configurable (--profile dual runs DeepSeek-v4-pro text with GLM-5.3-flash vision, OpenAI o3 backs the math agent, Kimi via env var) but the default profile keeps executor and adversarial reviewer inside the Claude family."
  assurance_runtime:
    score: 3
    note: "Blind separation of tool_impl from tool_review so the agent cannot self-validate circularly, a reviewer deliberately held outside the brain, three-layer adversarial review (content, figure internals, PDF layout), deterministic finish-gates that prompting cannot bypass, and `\\resultref` number provenance — a full runtime audit stack with gating."
  cross_platform_portability:
    score: 2
    note: "Four-plus model providers behind env-var redirects (Anthropic default, DeepSeek, GLM vision, OpenAI o3, Kimi) but a single execution environment — its own Node/tmux harness, explicitly not a general agent framework and not usable inside another IDE."
scored_on: '2026-09-08'

limitations:
  - "Uses an anti-detect browser to reach paywalled academic venues — a publisher terms-of-service and licence-compliance exposure that should be assessed before institutional use; the README does not document what the evasion does or offer a compliant-only mode."
  - "All demonstrated work is physics: the nine gallery runs and all four benchmark tasks cover quantum error correction, Rydberg atoms, cold atoms and neutral-atom imaging, so performance on economics or social-science research designs is entirely unevidenced."
  - "No paper, no benchmark scores, no external validation — quality evidence is nine self-selected example runs."
  - "Costs $20–80 per run on the default profile and runs unattended for hours; the README warns that project directories should be treated as executed code with no credential isolation guaranteed."
  - "Single maintainer, version 0.1.0, no tagged releases — bus-factor and API-stability risk."

related:
