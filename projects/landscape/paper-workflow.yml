year_started: 2026

positioning: >
  A meta-orchestrator for the empirical-economics paper pipeline: Stage
  0-9 take a project from topic selection through literature grounding,
  data, identification/estimation, exhibits, drafting, structural and
  sentence-level polish, simulated referee review, and journal
  shortlisting/submission packaging. Entry is flexible — a user can
  join with a bare idea, existing clean data, existing results, or an
  existing draft/referee report, and the orchestrator routes to the
  matching stage rather than restarting the pipeline. It does not
  reimplement research skills itself; it routes to 47 skills in a
  companion "mother" repository (Auto-Empirical-Research-Skills,
  already catalogued) plus optional per-journal skills from Awesome
  Journal Skills at the submission stage.

distinctive_contribution: >
  Two hard quality gates — a method gate after Stage 3 (design
  register + evidence bundle, blocking identification flaws) and a
  7-dimension quality-scorecard gate after Stage 7 (blocking manuscript
  defects, with automatic rollback to the weakest prior stage on
  failure) — plus a maintainer-facing acceptance-test harness
  (`evals/run_acceptance.py`) that runs the whole pipeline on synthetic
  raw data and checks for stale files, broken citations, and improper
  retrospective-disclosure/placeholder behavior. The README is explicit
  that this validates software plumbing, not paper quality or
  acceptance odds.

