    score: 2
    note: "Stage/gate logic, state schema (workflow_state.json v14) and rollback rules are public, but the 47 routed skills live in a separate companion repo, not bundled here."
  inputs_supported:
    score: 2
    note: "Multiple entry forms (idea, raw data, results, draft, referee comments) plus literature access via a routed web-research/arxiv skill; no dedicated proprietary-data connector of its own."
  outputs_reproducibility:
    score: 3
    note: "Resumable, versioned workspace (workflow_state.json) producing a full replication package; an acceptance-test suite runs the pipeline end-to-end from synthetic raw data to a checked DOCX/main.tex."
  internal_evaluation:
    score: 1
    note: "42/42 executable-gate CI badge and acceptance tests validate the software pipeline only; the README explicitly disclaims this as evidence of paper quality or acceptance rate."
  openness:
    score: 2
    note: "MIT license with passing CI, but full operation needs the separate 47-skill mother repo plus licensed analysis backends (Stata/R); not self-contained end-to-end."
  maturity_traction:
    score: 1
    note: "39 stars, 186 commits, active CI; single-team (Stanford REAP x CoPaper.AI), first public in 2026."
  cross_family_policy:
    score: 0
    note: "No cross-model-family review requirement; runs on whichever single agent backend the user has (Claude, Codex, Cursor or Gemini)."
  assurance_runtime:
    score: 2
    note: "Method gate (identification) and 7-dimension quality-scorecard gate with automatic rollback, plus a reference-verification and zero-numeric-drift check during the polish stage."
  cross_platform_portability:
    score: 2
    note: "Documented to run on 4 agent backends (Claude, Codex, Cursor, Gemini), each via its own skill/command mechanism."
scored_on: "2026-10-01"

limitations:
  - "'End-to-end' describes pipeline coverage, not a guarantee of data availability, significant results, or passing either gate; failures are recorded as audit artifacts rather than silently hidden, but they are still failures."
  - "Full capability depends on a separate companion repository (Auto-Empirical-Research-Skills, 47 skills) and on licensed analysis backends (Stata/R) that are not bundled."
  - "Acceptance testing covers software plumbing (stale files, broken citations, retrospective-disclosure handling); there is no independent evidence yet of output quality or journal-acceptance outcomes."

