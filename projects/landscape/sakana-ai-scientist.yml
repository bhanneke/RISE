slug: sakana-ai-scientist
name: "Sakana AI Scientist v2"
type: external
status: active
url: "https://github.com/SakanaAI/AI-Scientist-v2"
maintainers:
  - "Sakana AI"
year_started: 2024

positioning: >
  An autonomous "AI scientist" pipeline that ideates, runs experiments
  (primarily ML), drafts a paper, and self-reviews. Targets the full
  RISE arc end-to-end with minimal human oversight per task.

distinctive_contribution: >
  Among the earliest publicly released systems to demonstrate a single
  agentic pipeline producing complete machine-learning papers (idea →
  experiments → write-up → self-review) without per-step human
  intervention.

focus: end-to-end

pipeline_stages:
  - hypothesis-generation
  - research-design
  - data-analysis
  - code-generation
  - paper-drafting
  - revision-editing
  - referee-simulation

architectural_features:
  - multi-agent
  - tool-use
  - iterative-loop
  - artifact-versioning

discipline: computer-science

inputs:
  - research-area
  - seed-template

outputs:
  - paper-draft
  - code
  - experiment-logs
  - self-review

data_sources:
  - benchmark-datasets

knowledge_sources:
  - semantic-scholar
  - openreview

scores:
  lifecycle_coverage:
    score: 2
    note: "Covers ~7 stages; weak on literature discovery/synthesis and external dissemination."
  autonomy_level:
    score: 3
    note: "Runs end-to-end without per-task human approval."
  architectural_transparency:
    score: 3
    note: "Code, prompts, and configurations publicly released."
  inputs_supported:
    score: 1
    note: "Narrow input form (research area + template); limited external data integration."
  outputs_reproducibility:
    score: 2
    note: "Persists papers + code + experiment logs; reproducibility depends on the seeded template."
  internal_evaluation:
    score: 3
    note: "External validation: a v2-generated manuscript passed workshop-level human peer review (ICLR 2025 ICBINB, avg. score 6.33); the underlying research was subsequently peer-reviewed and published in Nature 651, 914-919 (26 Mar 2026)."
  openness:
    score: 1
    note: "Relicensed Dec 2025 from permissive terms to the custom 'AI Scientist Source Code License v1.0' (based on the Responsible AI Source Code License, confirmed in this repo's LICENSE) — a non-permissive, restriction-bearing license (mandatory AI-disclosure clause, use restrictions, termination-on-violation)."
  maturity_traction:
    score: 3
    note: "7.1k+ stars; multiple iterations (v1 → v2); capstone research published in Nature (Mar 2026), satisfying the 'citations'/production-adoption band."
  cross_family_policy:
    score: 0
    note: 'Same-model self-refinement is the canonical failure mode ARIS Table 4 identifies in this lineage.'
  assurance_runtime:
    score: 1
    note: 'Agentic tree search + self-review pass provide light runtime gating.'
  cross_platform_portability:
    score: 0
    note: 'Linux + NVIDIA GPU locked; single-template runtime.'
scored_on: "2026-09-01"

limitations:
  - "ML-paper focus; portability to non-CS domains unclear."
  - "Quality of produced papers strongly dependent on seed templates."
  - "Self-review is not a substitute for external peer review."
  - "Non-permissive license (AI Scientist Source Code License v1.0, Dec 2025), unlike the permissive license this project shipped under previously."

related:
  - e2er
  - zeropaper

