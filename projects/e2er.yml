# E2ER — End-to-End Research project
# Owned project entry. See ../projects/schema.md for field definitions
# and ../projects/EVALUATION.md for the scoring rubric.

slug: e2er
name: "E2ER — End-to-End Research"
type: owned
status: active
url: "https://github.com/bhanneke/E2ER-project"
maintainers:
  - "Björn Hanneke"
year_started: 2025

positioning: >
  E2ER is a strategist-driven agentic research pipeline that takes a
  research idea (human- or agent-supplied) and carries it through
  literature synthesis, identification, data acquisition, analysis,
  and paper drafting. It targets the full inputs → knowledge production
  → outputs arc of the RISE diagram, with explicit data and knowledge
  side-inputs.

distinctive_contribution: >
  Strategist-orchestrated multi-agent design with persona-rich review
  loops; emphasizes durable artifact production over chat output, and
  treats methodological skills (econometrics, replication, referee
  simulation) as first-class reusable modules.

focus: end-to-end

pipeline_stages:
  - rq-formulation
  - hypothesis-generation
  - literature-discovery
  - literature-synthesis
  - research-design
  - data-acquisition
  - data-analysis
  - formal-modeling
  - code-generation
  - paper-drafting
  - revision-editing
  - referee-simulation

architectural_features:
  - multi-agent
  - human-in-loop
  - tool-use
  - rag-knowledge-base
  - persistent-memory
  - dag-orchestration
  - iterative-loop
  - artifact-versioning

discipline: economics

