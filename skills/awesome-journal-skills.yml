    name: qje-workflow
    category: infra
    pipeline_stages: []
    field: economics
    description: 'Router for the QJE pack — sequences manuscript work from topic selection through rebuttal for a Quarterly Journal of Economics submission; routes, does not replace, the specialized qje-* skills.'
    source_path: 'Quarterly-Journal-of-Economics-Skills/skills/qje-workflow/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Quarterly-Journal-of-Economics-Skills/skills/qje-workflow/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: qje-topic-selection
    name: qje-topic-selection
    category: ideation
    pipeline_stages:
      - rq-formulation
    field: economics
    description: 'Scopes and pressure-tests a research question for QJE — fit, the "big idea" bar, and breadth of the takeaway for QJE''s general-interest readership.'
    source_path: 'Quarterly-Journal-of-Economics-Skills/skills/qje-topic-selection/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Quarterly-Journal-of-Economics-Skills/skills/qje-topic-selection/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: qje-identification
    name: qje-identification
    category: design
    pipeline_stages:
      - research-design
    field: economics
    description: 'Stress-tests the causal identification strategy (RCT, staggered DID, IV, RDD, event study) against the QJE general-interest bar — including the journal-specific credibility ranking and the "novel dataset answering a first-order question" exception — before tables are drafted.'
    source_path: 'Quarterly-Journal-of-Economics-Skills/skills/qje-identification/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Quarterly-Journal-of-Economics-Skills/skills/qje-identification/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: qje-theory-model
    name: qje-theory-model
    category: modeling
    pipeline_stages:
      - formal-modeling
    field: economics
    description: 'Adds the model or conceptual framework that turns a credible empirical coefficient into a lesson with broad implications — the frame QJE expects around a headline result.'
    source_path: 'Quarterly-Journal-of-Economics-Skills/skills/qje-theory-model/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Quarterly-Journal-of-Economics-Skills/skills/qje-theory-model/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: qje-literature-positioning
    name: qje-literature-positioning
    category: literature
    pipeline_stages:
      - literature-synthesis
    field: economics
    description: 'Stakes the manuscript''s contribution against the frontier — what it builds on, what it overturns, and why it belongs in a general-interest journal; positions the contribution rather than writing a full survey.'
    source_path: 'Quarterly-Journal-of-Economics-Skills/skills/qje-literature-positioning/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Quarterly-Journal-of-Economics-Skills/skills/qje-literature-positioning/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: qje-robustness
    name: qje-robustness
    category: analysis
    pipeline_stages:
      - data-analysis
    field: economics
    description: 'Plans and prioritizes the robustness suite and online appendix QJE referees expect, exploiting the journal''s no-page-limit norm, without changing the core identification design.'
    source_path: 'Quarterly-Journal-of-Economics-Skills/skills/qje-robustness/SKILL.md'
