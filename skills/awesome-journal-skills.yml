pack:
  slug: awesome-journal-skills
  name: 'Awesome Journal Skills (AJS)'
  source_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills'
  maintainers:
    - 'Bryce Wang (Stanford REAP / CoPaper.AI)'
  license: 'MIT'
  total_skills: 25
  last_update: '2026-07-23'
  related_project: ''
  compatibility:
    - claude-code
    - codex
  notes: >
    Despite the "Awesome" name this is not a link list: the repo ships
    4,150 first-party SKILL.md skills across 299 installable
    Claude-plugin packs — per-journal depth packs (~12 lifecycle
    skills each: topic selection, identification, robustness,
    tables/figures, writing style, referee strategy, rebuttal,
    replication package, submission) for top venues in economics,
    finance, management, accounting, and beyond, plus discipline-wide
    breadth bundles (one venue-fit skill per journal, 100+ journals
    each) and a cross-journal Research-Toolkit. Content is genuinely
    journal-specific (editors, acceptance norms, house style, canon),
    not find-replace boilerplate. This manifest catalogs 25
    representative skills: the full 7-skill cross-journal
    Research-Toolkit, the full 12-skill QJE depth pack as the
    exemplar, the workflow routers of five further depth packs
    (Econometrica, JPE, REStud, Management Science, MIS Quarterly),
    and one breadth-bundle venue-fit skill (AER). The AER depth pack
    lives in the separate brycewang-stanford/AER-skills repo,
    cataloged in RISE under the auto-empirical-research-skills pack.

skills:
  # ── Research-Toolkit-Skills — cross-journal toolkit (7/7) ──────
  - slug: rt-workflow
    name: rt-workflow
    category: infra
    pipeline_stages: []
    field: general
    description: 'Sequences a manuscript across venues — which cross-journal toolkit skill to invoke next, from picking a target journal through execution, submission-readiness, simulated review, rebuttal, and the replication package.'
    source_path: 'Research-Toolkit-Skills/skills/rt-workflow/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Research-Toolkit-Skills/skills/rt-workflow/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: rt-journal-match
    name: rt-journal-match
    category: submission
    pipeline_stages:
      - dissemination
    field: general
    description: 'Answers "which journal should I send this to?" — profiles the paper, shortlists candidate venues across 185+ packs, and ranks them into reach/match/safe with a resubmission ladder, reading live venue facts from each pack''s source-map.'
    source_path: 'Research-Toolkit-Skills/skills/rt-journal-match/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Research-Toolkit-Skills/skills/rt-journal-match/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: rt-execution-bridge
    name: rt-execution-bridge
    category: analysis
    pipeline_stages:
      - data-analysis
      - code-generation
    field: economics
    description: 'Runs and audits the empirical analysis rather than just advising — maps a DiD/IV/RDD/synthetic-control/DML design to the concrete StatsPAI / Stata MCP tools in the environment and reports the fitted, audited number.'
    source_path: 'Research-Toolkit-Skills/skills/rt-execution-bridge/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Research-Toolkit-Skills/skills/rt-execution-bridge/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: rt-submission-readiness
    name: rt-submission-readiness
    category: submission
    pipeline_stages:
      - dissemination
    field: general
    description: 'Venue-parameterized go/no-go scorecard on the actual manuscript — fit, identification, robustness, exhibits, exposition, venue mechanics, data/code, pre-empted objections — returning PASS/FLAG/FAIL per dimension plus desk-reject risk.'
    source_path: 'Research-Toolkit-Skills/skills/rt-submission-readiness/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Research-Toolkit-Skills/skills/rt-submission-readiness/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: rt-simulated-referee
    name: rt-simulated-referee
    category: review
    pipeline_stages:
      - referee-simulation
    field: general
    description: 'Pre-submission peer-review rehearsal — a calibrated Associate Editor desk-screen plus 2-3 distinct-lens referees for the target venue, adversarially verified and synthesized into a report, decision band, and prioritized skill-mapped fix list.'
    source_path: 'Research-Toolkit-Skills/skills/rt-simulated-referee/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Research-Toolkit-Skills/skills/rt-simulated-referee/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: rt-response-to-referees
    name: rt-response-to-referees
    category: revision
    pipeline_stages:
      - revision-editing
    field: general
    description: 'Turns a referee report into a point-by-point response letter plus revision plan — editor first, every comment answered, each empirical fix backed by a real re-run via the target pack''s skill and the execution bridge.'
    source_path: 'Research-Toolkit-Skills/skills/rt-response-to-referees/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Research-Toolkit-Skills/skills/rt-response-to-referees/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: rt-replication-package
    name: rt-replication-package
    category: replication
    pipeline_stages:
      - replication
      - dissemination
    field: general
    description: 'Assembles and validates the Data-Editor replication package against the target venue''s data-and-code policy — master script, pinned environment, README/roadmap, restricted-data plan, script-to-exhibit output map, and a Data-Editor-grade checklist.'
    source_path: 'Research-Toolkit-Skills/skills/rt-replication-package/SKILL.md'
    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Research-Toolkit-Skills/skills/rt-replication-package/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  # ── QJE depth pack — exemplar per-journal pack (12/12) ─────────
