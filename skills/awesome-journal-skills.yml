    details_url: 'https://github.com/brycewang-stanford/Awesome-Journal-Skills/blob/main/Quarterly-Journal-of-Economics-Skills/skills/qje-submission/SKILL.md'
    provenance: 'Awesome-Journal-Skills repo curation 2026-07-23'
    last_update: '2026-07'

  - slug: qje-rebuttal
    name: qje-rebuttal
    category: revision
    pipeline_stages:
      - revision-editing
    field: economics
    description: 'Structures the revision and response letter when a QJE decision letter arrives (R&R or reject-and-resubmit); routes re-analysis to the relevant qje-* skill rather than redoing it.'
