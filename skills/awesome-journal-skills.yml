    field: economics
    description: 'War-games likely referee objections before submitting, to close gaps pre-emptively given QJE''s ~2-week desk screen and ~1-4% acceptance rate; anticipates reports rather than writing the post-decision response.'
    source_path: 'Quarterly-Journal-of-Economics-Skills/skills/qje-referee-strategy/SKILL.md'
