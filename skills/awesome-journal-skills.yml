    last_update: '2026-07'

  - slug: qje-tables-figures
    name: qje-tables-figures
    category: figures
    pipeline_stages:
      - paper-drafting
    field: economics
    description: 'Finalizes main exhibits for a figure-forward QJE manuscript — clean tables and self-contained notes that read well in QJE''s single-PDF, author-date format.'
