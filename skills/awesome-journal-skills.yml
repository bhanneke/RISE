    last_update: '2026-07'

  - slug: qje-submission
    name: qje-submission
    category: submission
    pipeline_stages:
      - dissemination
    field: economics
    description: 'Final pre-submission preflight for QJE via Editorial Express — single-PDF format, double-blind anonymization, author-date references, the no-fee policy, and supplementary files.'
