pack:
  slug: claudeblattman
  name: 'claudeblattman (Chris Blattman)'
  source_url: 'https://github.com/chrisblattman/claudeblattman'
  maintainers:
    - "Chris Blattman (University of Chicago, Harris School of Public Policy)"
  license: 'MIT'
  total_skills: 35
  last_update: '2026-11-18'
  related_project: ''
  compatibility:
    - claude-code
  notes: 'Claude Code for academics — skills, agents, and setup guides. 367 stars MIT. Listed as a community extension by Pedro Santanna. Mix of research-specific skills (deep-research, proposal-write, review-plan, methodology review) and personal-workflow skills (morning-brief, schedule-query). Refresh 2026-11-24: upstream moved the skills from skills/<name>.md to skills/<name>/SKILL.md and added a starter-kit-source folder. Re-pointed 11 existing skills (checkin, deep-research, post-meeting and setup-project-management have new texts and new descriptions), removed 9 entries whose texts no longer exist upstream (dr-synthesize, prompt-only, prompt-refine, review-plan, tips-bookmarks, pre-meeting-brief and the old council, done and prompt), re-copied the 3 agents, and added 14 skills from skills/ plus 7 from starter-kit-source. Most additions are personal-productivity skills rather than research skills. The plugins/starter-kit-claude and plugins/starter-kit-codex folders mirror starter-kit-source and are not catalogued separately.'

