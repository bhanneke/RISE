  notes: >
    Single-skill pack curated from Prof. Peng Sida's open research-writing
    notes (github.com/pengsida/learning_research): one SKILL.md orchestrating
    eight on-demand reference guides (Introduction, Abstract, Related Work,
    Method, Experiments, Conclusion, paper review, paragraph-flow source)
