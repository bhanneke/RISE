pack:
  slug: thinkingwithagents-skills
  name: 'Thinking with Agents econ skills (Emily Beam and Erkmen Aslim)'
  source_url: 'https://github.com/thinkingwithagents/skills'
  maintainers:
    - 'Emily Beam (eabeam on GitHub, University of Vermont)'
    - 'Erkmen Aslim (University of Vermont), co-lead of the Thinking with Agents project'
  license: 'CC-BY-4.0 (repo LICENSE, "Creative Commons Attribution 4.0 International, Copyright (c) 2026 Emily Beam")'
  total_skills: 9
  last_update: '2026-04-26'
  related_project: ''
  compatibility:
    - claude-code
    - cursor
    - agnostic
  notes: >
    Nine skills for empirical economics from Thinking with Agents, the resource
    collection Emily Beam and Erkmen Aslim built around the UVM Economics AI
    Bootcamp (Spring 2026). The repo is a GitHub fork of eabeam/econ-skills,
    which holds the first three skills (econ-audit, data-dictionary, lit-review,
    2026-04-20); the fork adds code-review, review-paper, pipeline-audit,
    find-data, research-brainstorm and academic-beamer-deck (2026-04-26). All
    commits are by Emily Beam, and the README still credits her alone and gives
    install commands for the parent repo. The skills are plain SKILL.md files
    and the README names Claude Code, Cursor and Cline. Four of them are
    adversarial checks of applied-micro work: econ-audit (specification,
    clustering and bad-control errors in Stata, R or Python), code-review (DIME,
    Gentzkow-Shapiro, AEA and IPA code standards), pipeline-audit (variable
    construction and sample restrictions against a pre-analysis plan) and
    review-paper (skeptical referee plus devil's advocate). The rest support
    ideation, data search, codebooks, multi-session literature reviews and
    Beamer decks. A provenance audit (md5 plus difflib word-sequence ratio,
    2026-09-29) against every details copy RISE already holds, the named
    upstreams and the Auto-Empirical-Research-Skills bundle finds all nine
    first-party (best external match 0.243, review-paper against a Felpix
    Studios review skill, a shared genre and no shared text); there are no
    vendored copies. The details copies are verbatim and are redistributed under
    CC-BY-4.0 with attribution to Emily Beam, the copyright holder, and the
    Thinking with Agents project (Emily Beam and Erkmen Aslim).

skills:
  - slug: academic-beamer-deck
    name: '/academic-beamer-deck'
    category: slides
    pipeline_stages:
      - dissemination
    field: economics
    description: 'Builds or redesigns academic Beamer decks from .tex sources, figures and talk context, with a narrative structure, a design system, strict layout and TikZ rules, and a compile check, and returns a compile-ready deck with an organised figures folder.'
    source_path: 'academic-beamer-deck/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/academic-beamer-deck/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-26'

  - slug: code-review
    name: '/code-review'
    category: review
    pipeline_stages:
      - code-generation
      - replication
    field: economics
    description: 'Structured review of Stata, R or Python research code against DIME, Gentzkow-Shapiro, AEA and IPA standards, reporting silent failures, reproducibility risks and style problems by severity, with a replication-package checklist mode.'
    source_path: 'code-review/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/code-review/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-26'

  - slug: data-dictionary
    name: '/data-dictionary'
    category: data-handling
    pipeline_stages:
      - data-analysis
    field: economics
    description: 'Generates a codebook from a Stata .dta file in summary, full or analysis-ready mode: variable list, summary statistics, value labels, string variables and high-missingness flags.'
    source_path: 'data-dictionary/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/data-dictionary/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-20'

  - slug: econ-audit
    name: '/econ-audit'
    category: audit
    pipeline_stages:
      - data-analysis
      - referee-simulation
    field: econometrics
    description: 'Adversarial review of analysis code in Stata, R or Python that looks for errors which run cleanly but give wrong answers: misspecification, wrong clustering, bad controls and silent failures, together with an identification and design assessment and a specification table.'
    source_path: 'econ-audit/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/econ-audit/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-20'

  - slug: find-data
    name: '/find-data'
    category: data-handling
    pipeline_stages:
      - data-acquisition
      - research-design
    field: economics
    description: 'Searches systematically across source categories for datasets that fit a research question, verifies them, and sorts them into public, needs-processing and restricted-access tiers, with a summary table, suggested combinations and help with download, scraping or access applications.'
    source_path: 'find-data/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/find-data/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-26'

  - slug: lit-review
    name: '/lit-review'
    category: literature
    pipeline_stages:
      - literature-discovery
      - literature-synthesis
    field: economics
    description: 'Multi-session literature review workflow that scaffolds a review folder, tracks papers across sessions, shows a status dashboard, produces Beamer, Quarto or Markdown summaries, and runs referee passes to catch missing canonical papers.'
    source_path: 'lit-review/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/lit-review/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-20'

  - slug: pipeline-audit
    name: '/pipeline-audit'
    category: audit
    pipeline_stages:
      - data-analysis
      - replication
    field: economics
    description: 'Adversarial audit of a data pipeline that checks variable construction, sample restrictions and analytical choices against the pre-analysis plan and grades findings as red, orange or yellow flags.'
    source_path: 'pipeline-audit/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/pipeline-audit/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-26'

  - slug: research-brainstorm
    name: '/research-brainstorm'
    category: ideation
    pipeline_stages:
      - rq-formulation
      - literature-discovery
      - research-design
    field: economics
    description: 'Senior-colleague brainstorming dialogue that sharpens or generates a research question, runs a parallel literature scan, attacks the question, offers alternative framings, checks feasibility through find-data and writes a research brief.'
    source_path: 'research-brainstorm/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/research-brainstorm/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-26'

  - slug: review-paper
    name: '/review-paper'
    category: review
    pipeline_stages:
      - referee-simulation
    field: economics
    description: 'Simulates a skeptical referee on a paper, checking identification, statistical claims, robustness and presentation, and returns a referee report, a devil''s-advocate report and an editorial synthesis.'
    source_path: 'review-paper/SKILL.md'
    details_url: 'https://github.com/thinkingwithagents/skills/blob/main/review-paper/SKILL.md'
    provenance: 'thinkingwithagents-skills provenance audit 2026-09-29 (first-party; no upstream skill found)'
    last_update: '2026-04-26'
