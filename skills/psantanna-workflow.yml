pack:
  slug: psantanna-workflow
  name: "Pedro Sant'Anna's Claude Code Workflow"
  source_url: 'https://github.com/pedrohcgs/claude-code-my-workflow'
  maintainers:
    - "Pedro H. C. Sant'Anna (Emory University, Economics)"
  license: 'MIT'
  total_skills: 79
  last_update: '2026-09-27'
  related_project: ''
  compatibility:
    - claude-code
  notes: 'A ready-to-fork Claude Code template for academics using LaTeX/Beamer + R. 61 skills + 18 agents. Calibrated peer-review pipeline against AER, QJE, JPE, Econometrica, ReStud. Adopted by 15+ research groups. Refresh 2026-09-29 (upstream at 2026-09-27, previously catalogued at 2026-04-27 with 30 skills + 14 agents): added 31 skills (replication packaging, environment capture, disclosure and submission checks, grant/DMP/power-analysis design aids, teaching tools, audit and verification primitives such as vaccinate, differential-audit, verify-artifact, oracle-review) and 4 agents (humanize-auditor, promote-memory-council, r-package-reviewer, sim-reviewer); 43 existing skill texts changed upstream and were re-copied (notably /commit no longer merges, /deep-audit became a general adversarial audit); nothing was removed.'

