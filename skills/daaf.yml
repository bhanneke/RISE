pack:
  slug: daaf
  name: 'DAAF — Data Analyst Augmentation Framework (Brian Heseung Kim)'
  source_url: 'https://github.com/DAAF-Contribution-Community/daaf'
  maintainers:
    - 'Brian Heseung Kim (brhkim on GitHub), for the DAAF-Contribution-Community organisation'
  license: 'LGPL-3.0-or-later (as declared in the README, badge and CITATION.cff; the repo ships the GPL-3.0 text as LICENSE plus COPYING.LESSER)'
  total_skills: 56
  last_update: '2026-08-18'
  related_project: ''
  compatibility:
    - claude-code
  notes: >
    DAAF is a Claude Code instruction framework, run inside a Docker container,
    that turns the agent into a file-first quantitative research assistant:
    every data step is a script on disk, a 15-agent roster works under an
    orchestrator skill, and the analysis runs through a staged pipeline whose
    Stage 9 archives the executed scripts into marimo (Python) or Quarto (R)
    notebooks. All 56 SKILL.md files under .claude/skills/ are catalogued here.
    A provenance audit (md5 plus difflib word-sequence ratio, 2026-09-29)
    against every details copy RISE already holds, against
    K-Dense-AI/claude-scientific-skills, anthropics/skills,
    meleantonio/awesome-econ-ai-stuff, hanlulong/econ-paper-review-skill,
    JonasWeinert/EconAgentSkills and pedrohcgs/claude-code-my-workflow, and
    against the 69 other repos in the Auto-Empirical-Research-Skills bundle
    finds no vendored copies: the best external match is 0.077 (DAAF polars
    against K-Dense polars), and the library skills that share names with
    K-Dense skills (polars, scikit-learn, statsmodels, geopandas, plotly) are
    independent rewrites. The skills fall into five groups: framework internals
    (orchestrator, agent and skill authoring, shell scripting, deployment smoke
    tests, web retrieval), method routing (data-scientist,
    creative-verification, synthetic-data-workflow, science-communication),
    paired Python and R library skills (pyfixest and fixest, statsmodels and
    r-stats, linearmodels and plm, svy and survey-r, scikit-learn and
    tidymodels, geopandas and sf-terra, igraph and igraph-r, plotnine and
    ggplot2, plotly and plotly-r, great-tables and gt, polars and tidyverse,
    marimo and quarto), four Stata, R and Python translation skills, and 17
    data-source skills, 16 of them for the Urban Institute Education Data Portal
    and its mirror (CCD, IPEDS, CRDC, Scorecard, EDFacts and others) plus MIT
    MEDSL county presidential returns. The education-data focus reflects the
    project's proof of concept; the method skills are domain-general. Several
    skills are framework plumbing rather than research guidance
    (daaf-orchestrator is loaded only by the orchestrator,
    daaf-deploy-smoke-testing needs the DAAF_DEV=1 dev image). The details
    copies are verbatim and are redistributed under LGPL-3.0-or-later with
    attribution to Brian Heseung Kim and the DAAF contributors; each upstream
    skill also ships reference files that are not copied here.

