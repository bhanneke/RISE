pack:
  slug: ai-asset-pricing
  name: 'ai-asset-pricing (Alex Dickerson)'
  source_url: 'https://github.com/Alexander-M-Dickerson/ai-asset-pricing'
  maintainers:
    - 'Alex Dickerson (Alexander-M-Dickerson on GitHub)'
  license: 'MIT (repo LICENSE, "Copyright (c) 2025 Alex Dickerson")'
  total_skills: 37
  last_update: '2026-04-19'
  related_project: ''
  compatibility:
    - claude-code
    - codex
    - gemini-cli
  notes: >
    An empirical asset pricing research repo built around WRDS data, the
    author's PyBondLab corporate-bond portfolio package and a LaTeX paper
    workflow, with shared entry points for Claude Code (CLAUDE.md), Codex
    (AGENTS.md) and Gemini CLI (GEMINI.md). Besides 38 skills it ships 11 agents
    (WRDS query experts for CRSP, Compustat, OptionMetrics, TAQ, JKP global
    factors and the Dickerson bond data, a PyBondLab orchestrator and a paper
    reader), 12 rule files, hooks, a LaTeX paper boilerplate and a Python
    bootstrap engine. The skills cover five areas: WRDS and bond data access,
    factor and panel construction rules against look-ahead bias, PyBondLab runs
    and reports, paper writing and auditing section by section (write, edit,
    audit, captions, maths, consistency, citations, style, submission to JF, RFS
    or JFE, referee replies), and repo maintenance (onboarding, context sync,
    skill, agent and rule authoring). A provenance audit (md5 plus difflib
    word-sequence ratio, 2026-09-29) against every details copy RISE already
    holds, the named upstreams (K-Dense, anthropics, meleantonio, hanlulong,
    EconAgentSkills), the Auto-Empirical-Research-Skills bundle, and the full
    git histories of the two projects the README acknowledges finds 34
    first-party skills, 3 adapted skills and 1 vendored copy. The vendored copy,
    `wrds-ssh`, is Piotr Orlowski's claude-wrds-public skill (0.957; only an
    Examples block and a note preferring local psql were added) and is not
    catalogued. The adapted skills are catalogued with their origin named in the
    entry: `wrds-schema` (0.857, Orlowski's text kept whole and extended with
    JKP and Dickerson bond schemas), `wrds-psql` (0.470, also from Orlowski) and
    `split-pdf` (0.474, from Scott Cunningham's MixtapeTools, reworked for
    adaptive chunking and finance extraction notes). The README acknowledges
    both sources in general terms but the skill files do not credit them, and
    claude-wrds-public carries no licence file, so the MIT grant of this repo
    cannot extend to the Orlowski-derived text. RISE therefore links to those
    three adapted skills rather than reproducing them, the same treatment it
    gives their unlicensed sources; the other 34 are reproduced under MIT.
    Several skills assume tools a
    user must supply: `idea`, `research` and `verify-citations` search through a
    Perplexity MCP server, and the WRDS skills need the user's own WRDS account.
    The repo has been unchanged since 2026-04-19.

