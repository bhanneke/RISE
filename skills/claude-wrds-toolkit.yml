pack:
  slug: claude-wrds-toolkit
  name: 'Claude Code WRDS Toolkit (Piotr Orłowski)'
  source_url: 'https://github.com/piotrek-orlowski/claude-wrds-public'
  maintainers:
    - 'Piotr Orłowski (piotrek-orlowski on GitHub)'
  license: 'none'
  total_skills: 8
  last_update: '2026-05-06'
  related_project: ''
  compatibility:
    - claude-code
  notes: >
    A Claude Code setup for pulling empirical-finance data from WRDS: five
    subagents (database specialists for CRSP with CCM/Compustat linking,
    OptionMetrics and TAQ, a multi-database orchestrator, and a general
    academic-paper reader) plus three connection and schema skills, shipped
    with a permissions file that pre-approves the psql, ssh and scp calls.
    Its distinctive design choice is routing TAQ work through SAS batch jobs
    on the WRDS grid over SSH while everything else goes through a static
    psql service entry, which keeps the agents from tripping approval prompts.
    Requires a WRDS account with SSH-key access and Duo MFA. No licence
    declared: skill texts are not reproduced here; each skill links to its
    source.

skills:
  - slug: crsp-wrds-expert
    name: 'crsp-wrds-expert'
    category: data-handling
    pipeline_stages:
      - data-acquisition
    field: finance
    description: 'Subagent specialised in the CRSP stock files on WRDS, covering returns, price and share adjustments, delisting returns, identifiers, and linking CRSP to Compustat fundamentals through the CCM table, all via PostgreSQL.'
    source_path: 'agents/crsp-wrds-expert.md'
    details_url: 'https://github.com/piotrek-orlowski/claude-wrds-public/blob/main/agents/crsp-wrds-expert.md'
    provenance: 'claude-wrds-public repo curation 2026-09-29 (link-only, no licence)'
    last_update: '2026-05-06'

  - slug: optionmetrics-wrds-expert
    name: 'optionmetrics-wrds-expert'
    category: data-handling
    pipeline_stages:
