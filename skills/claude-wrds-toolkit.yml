    field: finance
    description: 'Subagent for OptionMetrics IvyDB extraction on WRDS: option prices, implied volatilities, Greeks, volatility surfaces and standardised options, plus mapping option security IDs to CRSP PERMNOs.'
    source_path: 'agents/optionmetrics-wrds-expert.md'
    details_url: 'https://github.com/piotrek-orlowski/claude-wrds-public/blob/main/agents/optionmetrics-wrds-expert.md'
