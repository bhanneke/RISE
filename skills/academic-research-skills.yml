pack:
  slug: academic-research-skills
  name: 'Academic Research Skills (ARS)'
  source_url: 'https://github.com/Imbad0202/academic-research-skills'
  maintainers:
    - 'Edward Cheng-I Wu'
  license: 'CC BY-NC 4.0'
  total_skills: 4
  last_update: '2026-05-17'
  related_project: 'academic-research-skills'
  compatibility:
    - claude-code
    - codex
    - vscode
    - jetbrains
  notes: 'Distributed as a Claude Code plugin. Four top-level skills, each backed by multiple sub-agents (7–13 each). Notable for claim-faithfulness audit pass (ARS_CLAIM_AUDIT) and cross-model verification.'

skills:
  - slug: academic-paper
    name: academic-paper
    category: drafting
    pipeline_stages:
      - paper-drafting
      - revision-editing
    field: general
    description: '12-agent paper writing skill with Style Calibration, Writing Quality Check, LaTeX hardening, visualization, revision coaching, citation conversion, anti-leakage protocol, and VLM figure verification.'
    source_path: 'academic-paper/SKILL.md'
    details_url: 'https://github.com/Imbad0202/academic-research-skills/blob/main/academic-paper/SKILL.md'
    provenance: 'ARS repo curation 2026-05-20'
    last_update: '2026-05'

  - slug: academic-paper-reviewer
    name: academic-paper-reviewer
    category: review
    pipeline_stages:
      - referee-simulation
    field: general
    description: '7-agent multi-perspective peer review with 0–100 quality rubrics (EIC + 3 dynamic reviewers + Devil''s Advocate), concession threshold protocol, attack intensity preservation, optional cross-model DA critique/calibration, R&R traceability matrix.'
    source_path: 'academic-paper-reviewer/SKILL.md'
    details_url: 'https://github.com/Imbad0202/academic-research-skills/blob/main/academic-paper-reviewer/SKILL.md'
    provenance: 'ARS repo curation 2026-05-20'
    last_update: '2026-05'

  - slug: deep-research
    name: deep-research
    category: literature
    pipeline_stages:
      - literature-discovery
      - literature-synthesis
    field: general
    description: '13-agent research team with Socratic guided mode, PRISMA systematic review, intent detection, dialogue health monitoring, optional cross-model DA, Semantic Scholar API verification.'
    source_path: 'deep-research/SKILL.md'
    details_url: 'https://github.com/Imbad0202/academic-research-skills/blob/main/deep-research/SKILL.md'
    provenance: 'ARS repo curation 2026-05-20'
    last_update: '2026-05'

  - slug: academic-pipeline
    name: academic-pipeline
    category: meta
    pipeline_stages: []
    field: general
    description: 'Pipeline orchestrator that chains deep-research → academic-paper → academic-paper-reviewer with quality gates between stages.'
    source_path: 'academic-pipeline/SKILL.md'
    details_url: 'https://github.com/Imbad0202/academic-research-skills/blob/main/academic-pipeline/SKILL.md'
    provenance: 'ARS repo curation 2026-05-20'
    last_update: '2026-05'
