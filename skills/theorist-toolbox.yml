pack:
  slug: theorist-toolbox
  name: 'Theorist Toolbox'
  source_url: 'https://github.com/morankor/theorist-toolbox'
  maintainers:
    - 'Moran Koren (Ben-Gurion University of the Negev, Economics)'
  license: 'MIT'
  total_skills: 11
  last_update: '2026-07-12'
  related_project: ''
  compatibility:
    - claude-code
    - codex
  notes: >
    Shared tooling for doing economic theory with LLMs — three bets on the
    same problem (machine help on a theorem you cannot already prove, with a
    trustable answer): math-proof (one careful single-shot pass), codex-math
    (OpenAI Codex as adversarial co-processor and hostile verifier), and
    co-math (a multi-agent proof-building project with strict unproven-gap
    flagging, reviewer sign-off gates, and optional Lean 4 verification,
    modelled on DeepMind's AI co-mathematician, Zheng et al. 2026).
    5 skills + 6 sub-agents; Codex CLI port and ChatGPT prompts included.
    Companion paper: arXiv:2606.22337 (Koren 2026).

skills:
  - slug: math-proof
    name: '/math-proof'
    kind: skill
    category: modeling
    pipeline_stages:
      - formal-modeling
    field: economics
    description: 'Single-pass discipline for full, gap-free proofs: state what you will show before showing it, sign every term, no "clearly", no overgeneralizing from examples.'
    source_path: 'skills/math-proof/SKILL.md'
    details_url: 'https://github.com/morankor/theorist-toolbox/blob/main/skills/math-proof/SKILL.md'
    provenance: 'theorist-toolbox repo curation 2026-07-22'
    last_update: '2026-07'
  - slug: codex-math
    name: '/codex-math'
    kind: skill
    category: audit
    pipeline_stages:
      - formal-modeling
    field: economics
    description: 'Drives OpenAI Codex as an adversarial mathematical co-processor — verify, write, and explore modes; every output is a lead, not a verdict.'
    source_path: 'skills/codex-math/skill.md'
    details_url: 'https://github.com/morankor/theorist-toolbox/blob/main/skills/codex-math/skill.md'
    provenance: 'theorist-toolbox repo curation 2026-07-22'
    last_update: '2026-07'
  - slug: co-math-init
    name: '/co-math-init'
    kind: skill
    category: infra
    pipeline_stages:
      - formal-modeling
    field: economics
    description: 'Scaffolds a structured proof-building project (paper.tex, goals, decisions log, workstreams) with strict mode: every gap flagged unproven, nothing complete without reviewer sign-off.'
    source_path: 'skills/co-math-init/SKILL.md'
    details_url: 'https://github.com/morankor/theorist-toolbox/blob/main/skills/co-math-init/SKILL.md'
    provenance: 'theorist-toolbox repo curation 2026-07-22'
    last_update: '2026-07'
  - slug: co-math-status
    name: '/co-math-status'
    kind: skill
    category: infra
    pipeline_stages: []
    field: economics
    description: 'Renders a compact status view of a co-math project — goals, active workstreams, blocked items, pending reviews, recent decisions — as an ASCII diagram.'
    source_path: 'skills/co-math-status/SKILL.md'
    details_url: 'https://github.com/morankor/theorist-toolbox/blob/main/skills/co-math-status/SKILL.md'
    provenance: 'theorist-toolbox repo curation 2026-07-22'
    last_update: '2026-07'
  - slug: proof-readability
    name: '/proof-readability'
    kind: skill
    category: editing
    pipeline_stages:
      - revision-editing
    field: economics
    description: 'Post-verification exposition pass for already-verified proofs — six layers (architecture, signposting, justification, notation, intuition, grammar) without changing the mathematics.'
    source_path: 'skills/proof-readability/SKILL.md'
    details_url: 'https://github.com/morankor/theorist-toolbox/blob/main/skills/proof-readability/SKILL.md'
    provenance: 'theorist-toolbox repo curation 2026-07-22'
    last_update: '2026-07'
  - slug: project-coordinator
