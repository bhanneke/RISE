<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <!-- Arrowhead markers -->
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6c00"/>
    </marker>
    <marker id="arrow-side" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#558b2f"/>
    </marker>
  </defs>

  <!-- ===================== INPUTS (top) ===================== -->
  <g filter="url(#softShadow)">
    <rect x="375" y="20" width="350" height="100" rx="16" ry="16"
          fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
    <text x="550" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#006064">Inputs</text>
    <text x="550" y="78" text-anchor="middle" font-size="14" fill="#00838f">human idea  ·  agentic idea</text>
    <text x="550" y="98" text-anchor="middle" font-size="14" fill="#00838f">research question  ·  replication target</text>
  </g>

  <!-- ===================== DATA LAYER (left) ===================== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="240" width="240" height="140" rx="16" ry="16"
          fill="#f1f8e9" stroke="#558b2f" stroke-width="2"/>
    <text x="160" y="270" text-anchor="middle" font-size="18" font-weight="600" fill="#33691e">Data layer</text>
    <text x="160" y="300" text-anchor="middle" font-size="13" fill="#558b2f">raw datasets</text>
    <text x="160" y="320" text-anchor="middle" font-size="13" fill="#558b2f">macro  ·  market</text>
    <text x="160" y="340" text-anchor="middle" font-size="13" fill="#558b2f">administrative</text>
    <text x="160" y="360" text-anchor="middle" font-size="13" fill="#558b2f">domain corpora</text>
  </g>

  <!-- ===================== KNOWLEDGE LAYER (right) ===================== -->
  <g filter="url(#softShadow)">
    <rect x="820" y="240" width="240" height="140" rx="16" ry="16"
          fill="#f1f8e9" stroke="#558b2f" stroke-width="2"/>
    <text x="940" y="270" text-anchor="middle" font-size="18" font-weight="600" fill="#33691e">Knowledge layer</text>
    <text x="940" y="300" text-anchor="middle" font-size="13" fill="#558b2f">literature</text>
    <text x="940" y="320" text-anchor="middle" font-size="13" fill="#558b2f">prior artifacts</text>
    <text x="940" y="340" text-anchor="middle" font-size="13" fill="#558b2f">theory</text>
    <text x="940" y="360" text-anchor="middle" font-size="13" fill="#558b2f">methods</text>
  </g>

  <!-- ===================== KNOWLEDGE PRODUCTION (center) ===================== -->
  <g filter="url(#softShadow)">
    <rect x="335" y="200" width="430" height="220" rx="20" ry="20"
          fill="#fff8e1" stroke="#ff8f00" stroke-width="3"/>
    <text x="550" y="240" text-anchor="middle" font-size="22" font-weight="700" fill="#bf360c">Knowledge Production</text>
    <text x="550" y="265" text-anchor="middle" font-size="14" font-style="italic" fill="#e65100">Agentic research pipelines</text>

    <!-- Inner stage pills -->
    <g transform="translate(0, 290)">
      <g>
        <rect x="360" y="0" width="115" height="32" rx="6" ry="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
        <text x="417" y="21" text-anchor="middle" font-size="12" fill="#bf360c">ideation</text>
      </g>
      <g>
        <rect x="485" y="0" width="180" height="32" rx="6" ry="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
        <text x="575" y="21" text-anchor="middle" font-size="12" fill="#bf360c">literature synthesis</text>
      </g>
      <g>
        <rect x="675" y="0" width="65" height="32" rx="6" ry="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
        <text x="707" y="21" text-anchor="middle" font-size="12" fill="#bf360c">design</text>
      </g>
    </g>
    <g transform="translate(0, 335)">
      <g>
        <rect x="360" y="0" width="160" height="32" rx="6" ry="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
        <text x="440" y="21" text-anchor="middle" font-size="12" fill="#bf360c">data analysis</text>
      </g>
      <g>
        <rect x="530" y="0" width="100" height="32" rx="6" ry="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
        <text x="580" y="21" text-anchor="middle" font-size="12" fill="#bf360c">drafting</text>
      </g>
      <g>
        <rect x="640" y="0" width="100" height="32" rx="6" ry="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
        <text x="690" y="21" text-anchor="middle" font-size="12" fill="#bf360c">review</text>
      </g>
    </g>
  </g>

  <!-- ===================== OUTPUTS (bottom) ===================== -->
  <g filter="url(#softShadow)">
    <rect x="375" y="500" width="350" height="100" rx="16" ry="16"
          fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
    <text x="550" y="530" text-anchor="middle" font-size="20" font-weight="600" fill="#006064">Outputs</text>
    <text x="550" y="558" text-anchor="middle" font-size="14" fill="#00838f">artifacts  ·  papers  ·  preprints</text>
    <text x="550" y="578" text-anchor="middle" font-size="14" fill="#00838f">datasets  ·  replication reports</text>
  </g>

  <!-- ===================== ARROWS ===================== -->
  <!-- INPUTS → KP -->
  <line x1="550" y1="120" x2="550" y2="200" stroke="#ef6c00" stroke-width="3"
        marker-end="url(#arrow-main)"/>
  <!-- KP → OUTPUTS -->
  <line x1="550" y1="420" x2="550" y2="500" stroke="#ef6c00" stroke-width="3"
        marker-end="url(#arrow-main)"/>
  <!-- DATA → KP -->
  <line x1="280" y1="310" x2="335" y2="310" stroke="#558b2f" stroke-width="2"
        marker-end="url(#arrow-side)"/>
  <!-- KNOWLEDGE → KP -->
  <line x1="820" y1="310" x2="765" y2="310" stroke="#558b2f" stroke-width="2"
        marker-end="url(#arrow-side)"/>
</svg>
