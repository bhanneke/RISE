site_name: RISE — Research Information Systems Engineering
site_description: A knowledge base on Research Information Systems Engineering — agentic research pipelines, projects, and papers.
site_url: https://bhanneke.github.io/RISE/
repo_url: https://github.com/bhanneke/RISE
repo_name: bhanneke/RISE
edit_uri: edit/main/docs/
copyright: "Content licensed under CC BY 4.0 — © 2026 Björn Hanneke"

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    scheme: default
    primary: teal
    accent: amber
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      type: iso_date
      enable_creation_date: true
  - bibtex:
      bib_file: papers/references.bib
      csl_file: https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn

nav:
  - Home: index.md
  - Get started:
      - getting-started/index.md
      - 1. Manuscript stack: getting-started/manuscript.md
      - 2. Agent stack: getting-started/agent.md
      - 3. First workflow: getting-started/first-workflow.md
  - Concept:
      - concept/definition.md
      - concept/history.md
      - concept/pipeline-anatomy.md
      - concept/data-layer.md
      - concept/knowledge-layer.md
      - concept/evaluation.md
      - concept/is-discipline.md
  - Projects:
      - projects/index.md
  - Papers:
      - papers/index.md
  - Skills:
      - skills/index.md
  - Glossary: glossary.md
  - Contributing: contributing.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bhanneke/RISE
